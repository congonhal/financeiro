      <div style={{
        borderRadius: 24, padding: 24, background: `linear-gradient(155deg, ${primaryDeep}, ${primary})`, position: 'relative', overflow: 'hidden',
        display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 18,
      }}>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay' }} />
        <div style={{ background: '#fff', borderRadius: 16, padding: 14, marginBottom: 16 }}>
          <svg width={tam * px} height={tam * px}>
            {celulas.filter((c) => c.ativo).map((c, i) => (
              <rect key={i} x={c.x * px} y={c.y * px} width={px - 1.5} height={px - 1.5} fill={ink} rx={2} />
            ))}
            <FinderPattern x={0} y={0} size={px} />
            <FinderPattern x={(tam - 3) * px} y={0} size={px} />
            <FinderPattern x={0} y={(tam - 3) * px} size={px} />
          </svg>
        </div>
        <div style={{ color: '#fff', fontSize: 11, opacity: 0.75, marginBottom: 6 }}>ou use o código</div>
        <button onClick={copiar} disabled={carregandoCodigo} style={{
          background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.25)', borderRadius: 12, padding: '10px 18px',
          display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer',
        }}>
          <span className="voice" style={{ color: '#fff', fontSize: 17, letterSpacing: 1.5 }}>{carregandoCodigo ? 'gerando...' : codigo}</span>
          {copiado ? <Check size={15} color={gold} /> : <Copy size={14} color="rgba(255,255,255,0.7)" />}
        </button>
      </div>

      <a href={linkWhats} target="_blank" rel="noreferrer" style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#25D366', color: '#fff', textDecoration: 'none',
        borderRadius: 16, padding: '14px 0', fontSize: 14, fontWeight: 600, marginBottom: 12,
      }}>
        <MessageCircle size={17} /> Enviar convite pelo WhatsApp
      </a>

      <button onClick={avancar} disabled={carregandoCodigo} style={{ width: '100%', background: primary, border: 'none', color: '#fff', borderRadius: 14, padding: '13px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', marginBottom: 8, opacity: carregandoCodigo ? 0.6 : 1 }}>
        Continuar
      </button>
      <button onClick={pular} disabled={carregandoCodigo} style={{ width: '100%', background: 'transparent', border: 'none', color: muted, fontSize: 12.5, cursor: carregandoCodigo ? 'default' : 'pointer', textDecoration: 'underline', opacity: carregandoCodigo ? 0.5 : 1 }}>
        {carregandoCodigo ? 'Preparando sua conta...' : 'Prefiro usar sozinho por enquanto'}
      </button>
    </div>
  );
}

function OnboardingStep3({ avatarCor, avatarLetra, codigo, finalizar }) {
  const [fase, setFase] = useState(0);

  useEffect(() => {
    const t = setTimeout(() => setFase(1), 700);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ animation: 'fadeSlide 0.4s ease', textAlign: 'center', paddingTop: 20 }}>
      <div style={{ position: 'relative', height: 110, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 24 }}>
        <div style={{
          width: 80, height: 80, borderRadius: '50%', background: avatarCor, display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 28, fontWeight: 700, color: '#fff', position: 'relative',
          boxShadow: `0 10px 24px -6px ${avatarCor}88`,
        }}>
          {avatarLetra || '?'}
          {fase === 1 && (
            <div style={{
              position: 'absolute', bottom: -4, right: -4, width: 30, height: 30, borderRadius: '50%', background: gold,
              display: 'flex', alignItems: 'center', justifyContent: 'center', animation: 'popIn 0.4s cubic-bezier(.34,1.56,.64,1) both',
              boxShadow: '0 6px 16px -4px rgba(201,164,106,0.7)', border: '2px solid #fff',
            }}>
              <Check size={15} color="#fff" strokeWidth={3} />
            </div>
          )}
        </div>
      </div>

      <div className="voice" style={{ fontSize: 22, fontWeight: 500, color: ink, marginBottom: 8, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.2s' }}>
        Seu perfil está pronto 🌱
      </div>
      <div style={{ fontSize: 13, color: muted, marginBottom: 20, lineHeight: 1.5, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.3s' }}>
        Você já pode começar a usar. Quando seu parceiro entrar com o código <b>{codigo}</b>, vocês passam a ver tudo juntos, automaticamente.
      </div>

      <button onClick={finalizar} disabled={fase === 0} style={{
        width: '100%', background: fase === 1 ? primary : 'rgba(14,79,69,0.2)', color: '#fff', border: 'none', borderRadius: 16,
        padding: '15px 0', fontSize: 14, fontWeight: 600, cursor: fase === 1 ? 'pointer' : 'default',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.4s, background 0.2s',
      }}>
        <Sparkles size={15} /> Ir para o Raiz
      </button>
    </div>
  );
}

function OnboardingRaiz({ userId, onFinish }) {
  const [step, setStep] = useState(1);
  const [nome, setNome] = useState('');
  const [avatarLetra, setAvatarLetra] = useState('');
  const [avatarCor, setAvatarCor] = useState(lucas);
  const [householdId, setHouseholdId] = useState(null);
  const [codigo, setCodigo] = useState(null);
  const [carregandoCodigo, setCarregandoCodigo] = useState(false);
  const [erroOnboarding, setErroOnboarding] = useState('');

  const salvarPerfilEAvancar = async () => {
    setErroOnboarding('');
    const { error } = await window.db.from('profiles').upsert({ id: userId, nome, avatar_cor: avatarCor, avatar_letra: avatarLetra });
    if (error) { setErroOnboarding('Erro ao salvar perfil: ' + error.message); return; }
    setStep(2);
    criarHousehold();
  };

  const criarHousehold = async () => {
    setCarregandoCodigo(true);
    setErroOnboarding('');
    const novoCodigo = 'RAIZ-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    const { data, error } = await window.db.from('households').insert({ codigo_convite: novoCodigo }).select().single();
    if (error) {
      setErroOnboarding('Erro ao criar a "casa": ' + error.message);
      setCarregandoCodigo(false);
      return;
    }
    const { error: erroUpdate } = await window.db.from('profiles').update({ household_id: data.id }).eq('id', userId);
    if (erroUpdate) {
      setErroOnboarding('Erro ao vincular seu perfil: ' + erroUpdate.message);
      setCarregandoCodigo(false);
      return;
    }
    setHouseholdId(data.id);
    setCodigo(novoCodigo);
    setCarregandoCodigo(false);
  };

  return (
    <div style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 640, borderRadius: 26, padding: '36px 26px', maxWidth: 400, margin: '0 auto', border: '1px solid rgba(14,79,69,0.08)' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
        .voice { font-family: 'Fraunces', serif; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes burstOut {
          from { transform: rotate(var(--ang)) translateX(0); opacity: 1; }
          to { transform: rotate(var(--ang)) translateX(46px); opacity: 0; }
        }
      `}</style>

      <div style={{ display: 'flex', gap: 6, marginBottom: 24 }}>
        {[1, 2, 3].map((s) => (
          <div key={s} style={{ flex: 1, height: 3, borderRadius: 2, background: s <= step ? primary : 'rgba(14,79,69,0.12)', transition: 'background 0.3s' }} />
        ))}
      </div>

      {erroOnboarding && (
        <div style={{ background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '12px 14px', fontSize: 12.5, marginBottom: 20, lineHeight: 1.5 }}>
          {erroOnboarding}
          <button onClick={criarHousehold} style={{ display: 'block', marginTop: 8, background: 'none', border: 'none', color: '#C1694F', textDecoration: 'underline', cursor: 'pointer', fontSize: 12, fontWeight: 600, padding: 0 }}>
            Tentar de novo
          </button>
        </div>
      )}

      {step === 1 && (
        <OnboardingStep1 nome={nome} setNome={setNome} avatarLetra={avatarLetra} setAvatarLetra={setAvatarLetra}
          avatarCor={avatarCor} setAvatarCor={setAvatarCor} avancar={salvarPerfilEAvancar} />
      )}
      {step === 2 && (
        <OnboardingStep2 nome={nome} codigo={codigo} carregandoCodigo={carregandoCodigo}
          avancar={() => setStep(3)} pular={() => householdId && onFinish(householdId)} />
      )}
      {step === 3 && (
        <OnboardingStep3 avatarCor={avatarCor} avatarLetra={avatarLetra} codigo={codigo} finalizar={() => onFinish(householdId)} />
      )}
    </div>
  );
}

// ============================================================================
// AUTENTICAÇÃO — login/cadastro real com Supabase, antes de tudo
// ============================================================================
function AuthGate() {
  const [sessao, setSessao] = useState(undefined); // undefined = checando, null = deslogado
  const [modoCadastro, setModoCadastro] = useState(true);
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erroAuth, setErroAuth] = useState('');
  const [carregando, setCarregando] = useState(false);

  useEffect(() => {
    window.db.auth.getSession().then(({ data }) => setSessao(data.session || null));
    const { data: listener } = window.db.auth.onAuthStateChange((_evt, session) => setSessao(session));
    return () => listener.subscription.unsubscribe();
  }, []);

  const enviar = async () => {
    setErroAuth(''); setCarregando(true);
    const acao = modoCadastro ? window.db.auth.signUp({ email, password: senha }) : window.db.auth.signInWithPassword({ email, password: senha });
    const { error } = await acao;
    if (error) setErroAuth(error.message);
    setCarregando(false);
  };

  if (sessao === undefined) {
    return <div style={{ textAlign: 'center', padding: 60, color: muted, fontFamily: 'Inter, sans-serif' }}>Carregando...</div>;
  }

  if (!sessao) {
    return (
      <div style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 640, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
          .voice { font-family: 'Fraunces', serif; }
          @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          .auth-input { width: 100%; border: 1px solid rgba(14,79,69,0.15); border-radius: 14px; padding: 13px 16px 13px 42px; font-size: 14px; outline: none; font-family: inherit; box-sizing: border-box; background: #fff; }
          .auth-input:focus { border-color: ${primary}; }
          .auth-tab { flex: 1; padding: 9px 0; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
          .auth-btn { width: 100%; background: ${primary}; color: #fff; border: none; border-radius: 16px; padding: 15px 0; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 26px rgba(14,79,69,0.28); transition: transform 0.2s; }
          .auth-btn:active { transform: scale(0.98); }
        `}</style>

        <div style={{ width: '100%', maxWidth: 380, animation: 'fadeSlide 0.4s ease' }} className="glass">
          <div style={{ borderRadius: '24px 24px 0 0', overflow: 'hidden' }}>
            <div style={{
              padding: '38px 28px 30px', textAlign: 'center', position: 'relative', overflow: 'hidden', color: '#fff',
              background: `linear-gradient(155deg, ${primaryDeep} 0%, ${primary} 55%, #14685A 100%)`,
            }}>
              <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay' }} />
              <div style={{ position: 'absolute', top: -50, right: -50, width: 180, height: 180, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%)' }} />
              <div style={{ width: 52, height: 52, borderRadius: 16, background: 'rgba(255,255,255,0.15)', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px' }}>
                <Sprout size={26} color="#fff" strokeWidth={1.8} />
              </div>
              <div className="voice" style={{ fontSize: 26, fontWeight: 500, marginBottom: 4 }}>Raiz</div>
              <div style={{ fontSize: 12.5, opacity: 0.75 }}>O painel financeiro que vocês olham juntos</div>
            </div>
          </div>

          <div style={{ padding: '26px 26px 28px' }}>
            <div style={{ display: 'flex', gap: 6, background: 'rgba(14,79,69,0.06)', borderRadius: 14, padding: 4, marginBottom: 22 }}>
              <button className="auth-tab" onClick={() => setModoCadastro(true)} style={{ background: modoCadastro ? '#fff' : 'transparent', color: modoCadastro ? primary : muted, boxShadow: modoCadastro ? '0 2px 6px rgba(0,0,0,0.06)' : 'none' }}>Criar conta</button>
              <button className="auth-tab" onClick={() => setModoCadastro(false)} style={{ background: !modoCadastro ? '#fff' : 'transparent', color: !modoCadastro ? primary : muted, boxShadow: !modoCadastro ? '0 2px 6px rgba(0,0,0,0.06)' : 'none' }}>Entrar</button>
            </div>

            <div style={{ position: 'relative', marginBottom: 12 }}>
              <Mail size={16} color={muted} style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)' }} />
              <input className="auth-input" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" type="email" />
            </div>
            <div style={{ position: 'relative', marginBottom: 18 }}>
              <Lock size={16} color={muted} style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)' }} />
              <input className="auth-input" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="Senha (mín. 6 caracteres)" type="password" />
            </div>

            {erroAuth && (
              <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6, background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '10px 12px', fontSize: 12, marginBottom: 16 }}>
                <AlertCircle size={14} style={{ flexShrink: 0, marginTop: 1 }} />{erroAuth}
              </div>
            )}

            <button className="auth-btn" onClick={enviar} disabled={carregando} style={{ opacity: carregando ? 0.7 : 1 }}>
              {carregando ? 'Aguarde...' : modoCadastro ? 'Criar minha conta' : 'Entrar'}
            </button>

            <div style={{ textAlign: 'center', fontSize: 11.5, color: muted, marginTop: 18, lineHeight: 1.5 }}>
              {modoCadastro ? 'Seus dados ficam protegidos e visíveis só pra você e quem você convidar.' : 'Bom te ver de novo 🌱'}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return <RaizApp userId={sessao.user.id} />;
}

// ============================================================================
// RAIZ APP — decide entre Onboarding (sem household ainda) e o app completo
// ============================================================================
function RaizApp({ userId }) {
  const [perfil, setPerfil] = useState(undefined);

  const buscarPerfil = () => {
    window.db.from('profiles').select('*').eq('id', userId).maybeSingle().then(({ data }) => setPerfil(data));
  };

  useEffect(() => { buscarPerfil(); }, [userId]);

  if (perfil === undefined) return <div style={{ textAlign: 'center', padding: 60, color: muted, fontFamily: 'Inter, sans-serif' }}>Carregando perfil...</div>;

  if (!perfil || !perfil.household_id) {
    return <OnboardingRaiz userId={userId} onFinish={() => buscarPerfil()} />;
  }

  return <AppPrincipal userId={userId} householdId={perfil.household_id} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthGate />);
</script>

<script>
  const codigoFonte = document.getElementById('app-source').textContent;
  let compilado;
  try {
    compilado = Babel.transform(codigoFonte, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(compilado);
  } catch (erro) {
    const box = document.getElementById('erro-visivel');
    box.style.display = 'block';
    box.innerText = 'ERRO NA EXECUÇÃO: ' + erro.message + '\n\n' + (erro.stack || '') +
      '\n\n--- INÍCIO DO CÓDIGO COMPILADO (primeiros 800 caracteres) ---\n' +
      (compilado ? compilado.slice(0, 800) : '(Babel.transform falhou antes de gerar código)');
  }
</script>
