function useCountUp(target, duration = 1100, decimals = 2) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(target * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return value.toFixed(decimals);
}

function useMounted(delay = 60) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => { const t = setTimeout(() => setMounted(true), delay); return () => clearTimeout(t); }, []);
  return mounted;
}

function ProgressRing({ percent, size = 64, stroke = 7 }) {
  const mounted = useMounted(300);
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.22)" strokeWidth={stroke} fill="none" />
      <circle cx={size / 2} cy={size / 2} r={r} stroke="url(#goldgrad)" strokeWidth={stroke} fill="none" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={mounted ? c * (1 - percent / 100) : c}
        style={{ transition: 'stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)' }} />
      <defs><linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#fff" /><stop offset="100%" stopColor={gold} /></linearGradient></defs>

  );
}

function CTAFlutuante() {
  const [aberto, setAberto] = useState(false);
  const [particulas, setParticulas] = useState([]);
  const clicar = () => {
    triggerHaptic();
    setAberto((v) => !v);
    const novas = Array.from({ length: 6 }, (_, i) => ({ id: Date.now() + i, angle: (i / 6) * 360 }));
    setParticulas(novas);
    setTimeout(() => setParticulas([]), 700);
  };
  return (
    <div className="cta-wrap">
      {particulas.map((p) => (
        <span key={p.id} className="particle" style={{ '--angle': `${p.angle}deg` }} />
      ))}
      <button onClick={clicar} className="cta-btn" style={{ transform: aberto ? 'rotate(45deg)' : 'rotate(0deg)' }}>
        <Plus size={26} color="#fff" />
      </button>
    </div>
  );
}

function MetaCard({ m }) {
  const percent = Math.min(100, (m.atual / m.total) * 100);
  const falta = Math.max(0, m.total - m.atual);
  const meses = m.aporteMedio > 0 ? Math.ceil(falta / m.aporteMedio) : 0;
  const anos = Math.floor(meses / 12), mesesResto = meses % 12;
  return (
    <div className="glass" style={{ borderRadius: 24, padding: 24, position: 'relative', overflow: 'hidden' }}>
      {m.destaque && <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.03, mixBlendMode: 'overlay', pointerEvents: 'none' }} />}
      <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 20 }}>{m.nome}</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
        <div style={{ position: 'relative', width: 84, height: 84, flexShrink: 0 }}>
          <ProgressRing percent={percent} size={84} stroke={8} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700, color: ink }}>{percent.toFixed(0)}%</div>
        </div>
        <div style={{ fontSize: 12 }}>
          <div style={{ color: muted, marginBottom: 2 }}>Alcançado</div>
          <div style={{ fontWeight: 600, marginBottom: 8, fontSize: 13.5 }}>R$ {fmt(m.atual)}</div>
          <div style={{ color: muted, marginBottom: 2 }}>Meta</div>
          <div style={{ fontWeight: 600, fontSize: 13.5 }}>R$ {fmt(m.total)}</div>
        </div>
      </div>
      <div style={{ marginTop: 18, paddingTop: 14, borderTop: '1px solid rgba(14,79,69,0.08)', fontSize: 12.5, color: muted, lineHeight: 1.5 }}>
        {percent >= 100 ? <span style={{ color: primary, fontWeight: 600 }}>Meta alcançada 🎉</span> : (
          <>No ritmo atual (<b style={{ color: ink }}>R$ {fmt(m.aporteMedio)}/mês</b>), faltam <b style={{ color: ink }}>{meses} {meses === 1 ? 'mês' : 'meses'}</b>{anos > 0 && <> (~{anos}a{mesesResto > 0 ? ` ${mesesResto}m` : ''})</>}</>
        )}
      </div>
    </div>
  );
}

  const [config, setConfig] = useState(financeiroSeed);

  const [valorSimulado, setValorSimulado] = useState('');

function gerarPadraoQR(seed, tamanho = 11) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const celulas = [];
  for (let y = 0; y < tamanho; y++) {
    for (let x = 0; x < tamanho; x++) {
      const naCanto = (x < 3 && y < 3) || (x > tamanho - 4 && y < 3) || (x < 3 && y > tamanho - 4);
      if (naCanto) continue;
      h = (h * 1103515245 + 12345) >>> 0;
      celulas.push({ x, y, ativo: (h >> 16) % 100 < 42 });
    }
  }
  return celulas;
}

function FinderPattern({ x, y, size }) {

      <rect x={size} y={size} width={size} height={size} fill={ink} rx={size * 0.15} />
    </g>
  );
}

        width: '100%', background: nome.trim() ? primary : 'rgba(14,79,69,0.25)', color: '#fff', border: 'none', borderRadius: 16,
        padding: '15px 0', fontSize: 14, fontWeight: 600, cursor: nome.trim() ? 'pointer' : 'not-allowed',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, transition: 'background 0.2s',
      }}>
        Continuar <ArrowRight size={15} />
      </button>
    </div>
  );
}

function OnboardingStep2({ nome, avancar, pular }) {
  const [copiado, setCopiado] = useState(false);
  const codigo = useMemo(() => 'RAIZ-7K2Q9X', []);
  const celulas = useMemo(() => gerarPadraoQR(codigo), [codigo]);
  const tam = 11, px = 14;

  const copiar = () => { setCopiado(true); setTimeout(() => setCopiado(false), 1800); };
  const linkWhats = `https://wa.me/?text=${encodeURIComponent(`${nome} te chamou pro Raiz — nosso painel financeiro compartilhado. Entra com o código ${codigo} 🌱`)}`;

  return (
    <div style={{ animation: 'fadeSlide 0.4s ease' }}>
      <div style={{ fontSize: 11, fontWeight: 600, color: muted, letterSpacing: 0.5, marginBottom: 6 }}>PASSO 2 DE 3</div>
      <div className="voice" style={{ fontSize: 26, fontWeight: 500, color: ink, marginBottom: 6 }}>Chame seu parceiro</div>
      <div style={{ fontSize: 13, color: muted, marginBottom: 24, lineHeight: 1.5 }}>Peça pra ele escanear, ou mande o link direto.</div>

      <div style={{
        borderRadius: 24, padding: 24, background: `linear-gradient(155deg, ${primaryDeep}, ${primary})`, position: 'relative', overflow: 'hidden',
        display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 18,
      }}>
        <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay' }} />
        <div style={{ background: '#fff', borderRadius: 16, padding: 14, marginBottom: 16 }}>
          <svg width={tam * px} height={tam * px}>
            {celulas.filter((c) => c.ativo).map((c, i) => (
              <rect key={i} x={c.x * px} y={c.y * px} width={px - 1.5} height={px - 1.5} fill={ink} rx={2} />
            ))}
            <FinderPattern x={0} y={0} size={px} />
            <FinderPattern x={(tam - 3) * px} y={0} size={px} />
            <FinderPattern x={0} y={(tam - 3) * px} size={px} />
          </svg>
        </div>
        <div style={{ color: '#fff', fontSize: 11, opacity: 0.75, marginBottom: 6 }}>ou use o código</div>
        <button onClick={copiar} style={{
          background: 'rgba(255,255,255,0.15)', border: '1px solid rgba(255,255,255,0.25)', borderRadius: 12, padding: '10px 18px',
          display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer',
        }}>
          <span className="voice" style={{ color: '#fff', fontSize: 17, letterSpacing: 1.5 }}>{codigo}</span>
          {copiado ? <Check size={15} color={gold} /> : <Copy size={14} color="rgba(255,255,255,0.7)" />}
        </button>
      </div>

      <a href={linkWhats} target="_blank" rel="noreferrer" style={{
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, background: '#25D366', color: '#fff', textDecoration: 'none',
        borderRadius: 16, padding: '14px 0', fontSize: 14, fontWeight: 600, marginBottom: 12,
      }}>
        <MessageCircle size={17} /> Enviar convite pelo WhatsApp
      </a>

      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 8, marginBottom: 20 }}>
        <div style={{ width: 7, height: 7, borderRadius: '50%', background: gold, animation: 'blink 1.6s ease-in-out infinite' }} />
        <span style={{ fontSize: 12, color: muted }}>Aguardando seu parceiro…</span>
      </div>

      <button onClick={avancar} style={{ width: '100%', background: 'transparent', border: `1px dashed rgba(14,79,69,0.3)`, color: muted, borderRadius: 14, padding: '11px 0', fontSize: 12.5, cursor: 'pointer', marginBottom: 8 }}>
        (demo) simular parceiro conectando
      </button>
      <button onClick={pular} style={{ width: '100%', background: 'transparent', border: 'none', color: muted, fontSize: 12.5, cursor: 'pointer', textDecoration: 'underline' }}>
        Prefiro usar sozinho por enquanto
      </button>

}

function OnboardingStep3({ avatarCor, avatarLetra, finalizar }) {
  const [fase, setFase] = useState(0);
  const parceiroCor = avatarCor === lucas ? marina : lucas;

  useEffect(() => {
    const t = setTimeout(() => setFase(1), 900);
    return () => clearTimeout(t);
  }, []);

  return (
    <div style={{ animation: 'fadeSlide 0.4s ease', textAlign: 'center', paddingTop: 20 }}>
      <div style={{ position: 'relative', height: 130, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 28 }}>
        <div style={{
          width: 80, height: 80, borderRadius: '50%', background: avatarCor, display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 28, fontWeight: 700, color: '#fff', position: 'absolute',
          transform: fase === 0 ? 'translateX(-52px)' : 'translateX(-24px)', transition: 'transform 0.7s cubic-bezier(.22,1,.36,1)', zIndex: 2,
          boxShadow: `0 10px 24px -6px ${avatarCor}88`,
        }}>{avatarLetra || 'L'}</div>
        <div style={{
          width: 80, height: 80, borderRadius: '50%', background: parceiroCor, display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 28, fontWeight: 700, color: '#fff', position: 'absolute',
          transform: fase === 0 ? 'translateX(52px)' : 'translateX(24px)', transition: 'transform 0.7s cubic-bezier(.22,1,.36,1)', zIndex: 1,
          boxShadow: `0 10px 24px -6px ${parceiroCor}88`,
        }}>M</div>

        {fase === 1 && (
          <div style={{
            position: 'absolute', width: 40, height: 40, borderRadius: '50%', background: gold, display: 'flex', alignItems: 'center', justifyContent: 'center',
            zIndex: 3, animation: 'popIn 0.4s cubic-bezier(.34,1.56,.64,1) 0.5s both', boxShadow: '0 6px 16px -4px rgba(201,164,106,0.7)',
          }}>
            <Check size={20} color="#fff" strokeWidth={3} />
          </div>
        )}

        {fase === 1 && Array.from({ length: 8 }).map((_, i) => (
          <span key={i} style={{
            position: 'absolute', width: 5, height: 5, borderRadius: '50%', background: i % 2 ? gold : primary,
            animation: `burstOut 0.8s ease-out ${0.5 + i * 0.02}s both`, '--ang': `${i * 45}deg`,
          }} />
        ))}
      </div>

      <div className="voice" style={{ fontSize: 24, fontWeight: 500, color: ink, marginBottom: 8, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.6s' }}>
        Conectados 🌱
      </div>
      <div style={{ fontSize: 13, color: muted, marginBottom: 32, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.7s' }}>
        Agora vocês veem a vida financeira da casa juntos, em tempo real.
      </div>

      <button onClick={finalizar} disabled={fase === 0} style={{
        width: '100%', background: fase === 1 ? primary : 'rgba(14,79,69,0.2)', color: '#fff', border: 'none', borderRadius: 16,
        padding: '15px 0', fontSize: 14, fontWeight: 600, cursor: fase === 1 ? 'pointer' : 'default',
        display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6, opacity: fase === 1 ? 1 : 0, transition: 'opacity 0.4s ease 0.8s, background 0.2s',
      }}>
        <Sparkles size={15} /> Ir para o Raiz
      </button>
    </div>
  );
}

function OnboardingRaiz({ onFinish }) {
  const [step, setStep] = useState(1);
  const [nome, setNome] = useState('');
  const [avatarLetra, setAvatarLetra] = useState('');
  const [avatarCor, setAvatarCor] = useState(lucas);

  return (
    <div style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 640, borderRadius: 26, padding: '36px 26px', maxWidth: 400, margin: '0 auto', border: '1px solid rgba(14,79,69,0.08)' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
        .voice { font-family: 'Fraunces', serif; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes burstOut {
          from { transform: rotate(var(--ang)) translateX(0); opacity: 1; }
          to { transform: rotate(var(--ang)) translateX(46px); opacity: 0; }
        }
      `}</style>

      <div style={{ display: 'flex', gap: 6, marginBottom: 32 }}>
        {[1, 2, 3].map((s) => (
          <div key={s} style={{ flex: 1, height: 3, borderRadius: 2, background: s <= step ? primary : 'rgba(14,79,69,0.12)', transition: 'background 0.3s' }} />
        ))}
      </div>

      {step === 1 && (
        <OnboardingStep1 nome={nome} setNome={setNome} avatarLetra={avatarLetra} setAvatarLetra={setAvatarLetra}
          avatarCor={avatarCor} setAvatarCor={setAvatarCor} avancar={() => setStep(2)} />
      )}
      {step === 2 && (
        <OnboardingStep2 nome={nome} avancar={() => setStep(3)} pular={onFinish} />
      )}
      {step === 3 && (
        <OnboardingStep3 avatarCor={avatarCor} avatarLetra={avatarLetra} finalizar={onFinish} />
      )}
    </div>
  );
}

// ============================================================================
// WRAPPER FINAL — decide entre mostrar o Onboarding ou o app completo
// ============================================================================
function RaizApp() {
  const [entrou, setEntrou] = useState(false);
  if (!entrou) return <OnboardingRaiz onFinish={() => setEntrou(true)} />;
  return <AppPrincipal />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<RaizApp />);
</script>

<script>
  // Controle manual: pega o código JSX (que o navegador ignorou, por ser type="text/plain"),
  // transforma com o Babel carregado, e executa — sem depender do scanner automático dele
  const codigoFonte = document.getElementById('app-source').textContent;
  try {
    const compilado = Babel.transform(codigoFonte, { presets: ['react'] }).code;
    const scriptFinal = document.createElement('script');
    scriptFinal.text = compilado;
    document.body.appendChild(scriptFinal);
  } catch (erro) {
    const box = document.getElementById('erro-visivel');
    box.style.display = 'block';
    box.innerText = 'ERRO NA TRANSFORMAÇÃO DO BABEL: ' + erro.message + '\n\n' + (erro.stack || '');
  }
</script>
</body>
</html>
