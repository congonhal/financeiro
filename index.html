<script>
  window.addEventListener('error', function (e) {
    const semDetalhe = (!e.message || e.message === 'Script error.') && !e.filename;
    if (semDetalhe) return; // ruído do navegador (ex: iOS montando o preview do "Adicionar à Tela de Início"), sem nada acionável
    const box = document.getElementById('erro-visivel');
    box.style.display = 'block';
    box.innerText = 'ERRO: ' + (e.message || 'desconhecido') +
      '\narquivo: ' + (e.filename || '?') +
      '\nlinha: ' + (e.lineno || '?') +
      (e.error && e.error.stack ? '\n\n' + e.error.stack : '');
  });
</script>

// Campo de dinheiro — formata como R$ 1.234,56 enquanto a pessoa digita, guarda o número puro por dentro
function InputDinheiro({ value, onChange, placeholder, style }) {
  const exibir = value === '' || value === null || value === undefined ? '' : fmt(value);
  const handleChange = (e) => {
    const digitos = e.target.value.replace(/\D/g, '');
    if (digitos === '') { onChange(''); return; }
    onChange((Number(digitos) / 100).toString());
  };
  return (
    <div style={{ display: 'flex', alignItems: 'center', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', ...style }}>
      <span style={{ fontSize: 13, color: '#96897A', marginRight: 4 }}>R$</span>
      <input inputMode="numeric" value={exibir} onChange={handleChange} placeholder={placeholder || '0,00'}
        style={{ border: 'none', outline: 'none', width: '100%', fontSize: 13, fontFamily: 'inherit' }} />
    </div>
  );
}

function useCountUp(target, duration = 1100, decimals = 2) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(target * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return value.toFixed(decimals);
}

function useMounted(delay = 60) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => { const t = setTimeout(() => setMounted(true), delay); return () => clearTimeout(t); }, []);
  return mounted;
}

function ProgressRing({ percent, size = 64, stroke = 7 }) {
  const mounted = useMounted(300);
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.22)" strokeWidth={stroke} fill="none" />
      <circle cx={size / 2} cy={size / 2} r={r} stroke="url(#goldgrad)" strokeWidth={stroke} fill="none" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={mounted ? c * (1 - percent / 100) : c}
        style={{ transition: 'stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)' }} />
      <defs><linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#fff" /><stop offset="100%" stopColor={gold} /></linearGradient></defs>
    </svg>
  );
}

function BlobEntradaSaida({ transacoes = [], mesLabel = '', transacoesAnterior = null }) {
  const mounted = useMounted(200);
  const entrada = transacoes.filter((t) => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor), 0);
  const saida = transacoes.filter((t) => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor), 0);
  const total = entrada + saida;

  let frases = [];
  if (transacoesAnterior && transacoesAnterior.length > 0) {
    const entradaAnt = transacoesAnterior.filter((t) => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor), 0);
    const saidaAnt = transacoesAnterior.filter((t) => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor), 0);
    const diffSaida = saida - saidaAnt;
    const diffEntrada = entrada - entradaAnt;
    if (diffSaida < -0.5) frases.push({ texto: `Economizou R$ ${fmt(Math.abs(diffSaida))} a mais que no mês passado`, boa: true });
    else if (diffSaida > 0.5) frases.push({ texto: `Gastou R$ ${fmt(diffSaida)} a mais que no mês passado`, boa: false });
    if (diffEntrada > 0.5) frases.push({ texto: `Recebeu R$ ${fmt(diffEntrada)} a mais que no mês passado`, boa: true });
    else if (diffEntrada < -0.5) frases.push({ texto: `Recebeu R$ ${fmt(Math.abs(diffEntrada))} a menos que no mês passado`, boa: false });
  }

  if (total === 0) {
    return (
      <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 10 }}>ENTROU × SAIU{mesLabel ? ` — ${mesLabel}` : ''}</div>
        <div style={{ fontSize: 13, color: muted, padding: '20px 0', textAlign: 'center' }}>Sem lançamentos nesse período</div>
      </div>
    );
  }

  const pE = mounted ? (entrada / total) * 100 : 50, pS = mounted ? (saida / total) * 100 : 50;
  const fmtK = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)}k` : `R$${v.toFixed(0)}`);
  return (
    <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 14 }}>ENTROU × SAIU{mesLabel ? ` — ${mesLabel}` : ''}</div>
      <div style={{ display: 'flex', height: 76, borderRadius: 38, overflow: 'hidden' }}>
        {entrada > 0 && (
          <div style={{
            width: `${pE}%`, background: `linear-gradient(135deg, ${primary}, #167A69)`, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', borderRadius: saida > 0 ? '38px 14px 14px 38px' : '38px',
          }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>{fmtK(entrada)}</span>
            <span style={{ fontSize: 9.5, opacity: 0.85 }}>entrou</span>
          </div>
        )}
        {saida > 0 && (
          <div style={{
            width: `${pS}%`, background: `linear-gradient(135deg, ${marina}, #A6523B)`, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', borderRadius: entrada > 0 ? '14px 38px 38px 14px' : '38px',
          }}>
            <span style={{ fontSize: 14, fontWeight: 700 }}>{fmtK(saida)}</span>
            <span style={{ fontSize: 9.5, opacity: 0.85 }}>saiu</span>
          </div>
        )}
      </div>
      {frases.length > 0 && (
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid rgba(14,79,69,0.08)', display: 'flex', flexDirection: 'column', gap: 6 }}>
          {frases.map((f, i) => (
            <div key={i} style={{ fontSize: 12.5, color: f.boa ? primary : '#C1694F', fontWeight: 600 }}>{f.boa ? '↑' : '↓'} {f.texto}</div>
          ))}
        </div>
      )}
    </div>
  );
}

              <div>
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 1 }}>{posseOuVisivel ? t.descricao : 'Gasto pessoal'}</div>
                <div style={{ fontSize: 10.5, color: muted, fontWeight: 600, marginBottom: 6 }}>{t.categoria || 'Geral'}</div>
                {posseOuVisivel
                  ? <div style={{ fontSize: 14, fontWeight: 700 }}>R$ {fmt(t.valor)}</div>
                  : <TextoPrivado visivel={false} texto="" valor={t.valor} />}

            </div>
          );
        })}

  );
}

function HeroSaldo({ saldoReal = 0, metaPrincipal = null }) {

  const falta = metaPrincipal ? Math.max(0, metaPrincipal.total - metaPrincipal.atual) : 0;
  const meses = metaPrincipal && metaPrincipal.aporteMedio > 0 ? Math.ceil(falta / metaPrincipal.aporteMedio) : null;

  return (
    <div className="hero-card" style={{
      borderRadius: 30, padding: '30px 28px', color: '#fff', position: 'relative', overflow: 'hidden',

    }}>
      <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay', pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', top: -60, right: -60, width: 220, height: 220, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%)' }} />
      <div style={{ fontSize: 12.5, opacity: 0.75, marginBottom: 6, fontWeight: 500, letterSpacing: 0.4 }}>SALDO LIVRE REAL</div>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>

          <div style={{ position: 'relative', width: 68, height: 68, flexShrink: 0 }}>

          </div>
        )}
      </div>
      <div style={{ fontSize: 12, opacity: 0.65, marginTop: 4, marginBottom: metaPrincipal ? 20 : 0 }}>já descontando contas do mês</div>

function CTAFlutuante({ onClick }) {
  const [aberto, setAberto] = useState(false);
  const [particulas, setParticulas] = useState([]);
  const clicar = () => {
    triggerHaptic();
    setAberto((v) => !v);
    const novas = Array.from({ length: 6 }, (_, i) => ({ id: Date.now() + i, angle: (i / 6) * 360 }));
    setParticulas(novas);
    setTimeout(() => setParticulas([]), 700);
    if (onClick) onClick();
  };
  return (
    <div className="cta-wrap">
      {particulas.map((p) => (
        <span key={p.id} className="particle" style={{ '--angle': `${p.angle}deg` }} />
      ))}
      <button onClick={clicar} className="cta-btn" style={{ transform: aberto ? 'rotate(45deg)' : 'rotate(0deg)' }}>
        <Plus size={26} color="#fff" />
      </button>
    </div>
  );
}

function CardSaudeFinanceira({ transacoesMes = [], mesLabel = '' }) {
  const entrada = transacoesMes.filter((t) => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor), 0);
  const saida = transacoesMes.filter((t) => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor), 0);
  const saldoMes = entrada - saida;
  const percentual = entrada > 0 ? (saida / entrada) * 100 : (saida > 0 ? 100 : 0);

  let status, cor, mensagem, Icon;
  if (entrada === 0 && saida === 0) {
    status = 'Sem dados'; cor = muted; mensagem = 'Ainda não tem lançamento nesse mês.'; Icon = Sparkles;
  } else if (percentual <= 70) {
    status = 'Saudável'; cor = primary; mensagem = `Você comprometeu ${percentual.toFixed(0)}% do que entrou esse mês.`; Icon = TrendingUp;
  } else if (percentual <= 100) {
    status = 'Atenção'; cor = gold; mensagem = `Você já comprometeu ${percentual.toFixed(0)}% do que entrou esse mês.`; Icon = Sparkles;
  } else {
    status = 'Apertado'; cor = marina; mensagem = `Gastou R$ ${fmt(saida - entrada)} a mais do que entrou esse mês.`; Icon = TrendingDown;
  }

  return (
    <div className="glass" style={{ borderRadius: 22, padding: 24, position: 'relative', overflow: 'hidden' }}>
      <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.035, mixBlendMode: 'overlay', pointerEvents: 'none' }} />
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 16 }}>
        <div>
          <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 6 }}>SAÚDE FINANCEIRA{mesLabel ? ` — ${mesLabel.toUpperCase()}` : ''}</div>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
            <div style={{ width: 8, height: 8, borderRadius: '50%', background: cor }} />
            <span style={{ fontSize: 14, fontWeight: 700, color: cor }}>{status}</span>
          </div>
        </div>
        <div style={{ width: 38, height: 38, borderRadius: '50%', background: `${cor}1A`, display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0 }}>
          <Icon size={18} color={cor} />
        </div>
      </div>
      <div className="voice" style={{ fontSize: 26, fontWeight: 500, marginBottom: 2, color: saldoMes >= 0 ? ink : marina }}>R$ {fmt(Math.abs(saldoMes))}</div>
      <div style={{ fontSize: 11.5, color: muted, marginBottom: 14 }}>{saldoMes >= 0 ? 'sobrou esse mês' : 'faltou esse mês'}</div>
      <div style={{ height: 6, borderRadius: 3, background: 'rgba(14,79,69,0.08)', overflow: 'hidden', marginBottom: 12 }}>
        <div style={{ height: '100%', width: `${Math.min(100, percentual)}%`, background: cor, borderRadius: 3, transition: 'width 1s cubic-bezier(.22,1,.36,1)' }} />
      </div>
      <div style={{ fontSize: 12.5, color: ink, lineHeight: 1.4 }}>{mensagem}</div>
    </div>
  );
}

function RelatorioMensal({ transacoes = [] }) {
  const mesAtualChave = mesChaveDeData(new Date().toISOString().slice(0, 10));
  const [modo, setModo] = useState('mes'); // 'mes' | 'acumulado'
  const [mesSelecionado, setMesSelecionado] = useState(mesAtualChave);

  const mesesDisponiveis = Array.from(new Set(transacoes.map((t) => mesChaveDeData(t.data))));
  if (!mesesDisponiveis.includes(mesAtualChave)) mesesDisponiveis.push(mesAtualChave);
  mesesDisponiveis.sort((a, b) => b.localeCompare(a));

  const saidas = transacoes.filter((t) => t.tipo === 'saida');
  const filtradas = modo === 'mes'
    ? saidas.filter((t) => mesChaveDeData(t.data) === mesSelecionado)
    : saidas.filter((t) => mesChaveDeData(t.data) <= mesSelecionado);

  const porCategoria = {};
  filtradas.forEach((t) => { const c = t.categoria || 'Geral'; porCategoria[c] = (porCategoria[c] || 0) + Number(t.valor); });
  const totalGasto = Object.values(porCategoria).reduce((s, v) => s + v, 0);
  const categoriasOrdenadas = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]);

  const paleta = [primary, gold, marina, lucas, '#8B6F47', '#5C7A72', '#B98A55', '#3D5A80'];

  // Últimos até 6 meses (ou o que tiver disponível) pra comparar visualmente
  const mesesGrafico = mesesDisponiveis.slice(0, 6).slice().reverse();
  const totaisPorMes = mesesGrafico.map((mk) => ({
    mk, total: saidas.filter((t) => mesChaveDeData(t.data) === mk).reduce((s, t) => s + Number(t.valor), 0),
  }));
  const maiorTotalMes = Math.max(1, ...totaisPorMes.map((m) => m.total));

  const rotuloMes = (mk) => {
    const [ano, mes] = mk.split('-').map(Number);
    let l = new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', '');
    return l.charAt(0).toUpperCase() + l.slice(1);
  };

  return (
    <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', flexWrap: 'wrap', gap: 10, marginBottom: 16 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4 }}>GASTOS POR CATEGORIA</div>
        <div style={{ display: 'flex', gap: 6 }}>
          <button onClick={() => setModo('mes')} style={{
            padding: '5px 12px', borderRadius: 16, border: 'none', cursor: 'pointer', fontSize: 11.5, fontWeight: 600,
            background: modo === 'mes' ? primary : 'rgba(14,79,69,0.06)', color: modo === 'mes' ? '#fff' : muted,
          }}>Esse mês</button>
          <button onClick={() => setModo('acumulado')} style={{
            padding: '5px 12px', borderRadius: 16, border: 'none', cursor: 'pointer', fontSize: 11.5, fontWeight: 600,
            background: modo === 'acumulado' ? primary : 'rgba(14,79,69,0.06)', color: modo === 'acumulado' ? '#fff' : muted,
          }}>Acumulado até o mês</button>
        </div>
      </div>

      <div style={{ display: 'flex', gap: 6, overflowX: 'auto', paddingBottom: 4, marginBottom: 18 }}>
        {mesesDisponiveis.map((mk) => (
          <button key={mk} onClick={() => setMesSelecionado(mk)} style={{
            padding: '6px 12px', borderRadius: 16, border: 'none', cursor: 'pointer', fontSize: 11.5, fontWeight: 600, whiteSpace: 'nowrap', flexShrink: 0,
            background: mesSelecionado === mk ? ink : 'rgba(14,79,69,0.06)', color: mesSelecionado === mk ? '#fff' : muted,
          }}>{rotuloMes(mk)}{mk === mesAtualChave ? ' (atual)' : ''}</button>
        ))}
      </div>

      {totalGasto === 0 ? (
        <div style={{ fontSize: 12.5, color: muted, textAlign: 'center', padding: '16px 0' }}>Sem gastos {modo === 'mes' ? 'nesse mês' : 'até esse mês'}</div>
      ) : (
        <>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 12, marginBottom: 22 }}>
            {categoriasOrdenadas.map(([nome, valor], i) => {
              const pct = (valor / totalGasto) * 100;
              return (
                <div key={nome}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12.5, marginBottom: 4 }}>
                    <span>{nome}</span>
                    <span><b>{pct.toFixed(0)}%</b> · R$ {fmt(valor)}</span>
                  </div>
                  <div style={{ height: 6, borderRadius: 3, background: 'rgba(14,79,69,0.07)', overflow: 'hidden' }}>
                    <div style={{ height: '100%', width: `${pct}%`, background: paleta[i % paleta.length], borderRadius: 3 }} />
                  </div>
                </div>
              );
            })}
          </div>
          <div style={{ fontSize: 12.5, color: muted, marginBottom: 20 }}>Total: <b style={{ color: ink }}>R$ {fmt(totalGasto)}</b></div>

          {totaisPorMes.length > 1 && (
            <div>
              <div style={{ fontSize: 11.5, color: muted, marginBottom: 10 }}>Comparando os últimos {totaisPorMes.length} meses</div>
              <div style={{ display: 'flex', alignItems: 'flex-end', gap: 10, height: 90 }}>
                {totaisPorMes.map((m) => (
                  <div key={m.mk} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'flex-end', height: '100%' }}>
                    <div style={{ fontSize: 10, color: muted, marginBottom: 4 }}>{m.total > 0 ? `${(m.total / 1000).toFixed(1)}k` : ''}</div>
                    <div style={{
                      width: '100%', maxWidth: 34, height: `${Math.max(3, (m.total / maiorTotalMes) * 62)}px`,
                      background: m.mk === mesSelecionado ? primary : 'rgba(14,79,69,0.18)', borderRadius: 6,
                    }} />
                    <div style={{ fontSize: 10.5, color: muted, marginTop: 6 }}>{rotuloMes(m.mk)}</div>
                  </div>
                ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

function TelaPainel({ transacoes = [], saldoReal = 0, householdId, userId }) {
  const [metaPrincipal, setMetaPrincipal] = useState(null);
  const [patrimonioTotal, setPatrimonioTotal] = useState(0);
  const [carregandoExtra, setCarregandoExtra] = useState(true);

  useEffect(() => {
    Promise.all([
      window.db.from('metas').select('*').eq('household_id', householdId).order('created_at', { ascending: true }),
      window.db.from('accounts').select('id, dono, saldo').eq('household_id', householdId),
      window.db.from('assets').select('atual').eq('household_id', householdId),
    ]).then(([resMeta, resContas, resAtivos]) => {
      const metasMapeadas = (resMeta.data || []).map((m) => ({
        id: m.id, nome: m.nome, total: Number(m.valor_total), atual: Number(m.valor_atual), aporteMedio: Number(m.aporte_medio),
        accountId: m.account_id, autorId: m.autor_id, favorita: !!m.favorita,
      }));
      const { conjunta, paresCasal } = agruparMetasCasal(metasMapeadas, resContas.data || []);
      let escolhida = null;
      if (conjunta.length > 0) escolhida = conjunta[0];
      else if (paresCasal.length > 0) escolhida = paresCasal[0];
      else escolhida = metasMapeadas.find((m) => m.favorita && m.autorId === userId) || metasMapeadas[0] || null;
      setMetaPrincipal(escolhida ? { nome: escolhida.nome, total: escolhida.total, atual: escolhida.atual, aporteMedio: escolhida.aporteMedio } : null);
      const totalContas = (resContas.data || []).reduce((s, c) => s + Number(c.saldo || 0), 0);
      const totalAtivos = (resAtivos.data || []).reduce((s, a) => s + Number(a.atual || 0), 0);
      setPatrimonioTotal(totalContas + totalAtivos);
      setCarregandoExtra(false);
    });
  }, [householdId]);

  const mesAtualChave = mesChaveDeData(new Date().toISOString().slice(0, 10));
  const mesAnteriorChave = addMeses(mesAtualChave, -1);
  const transacoesMesAtual = transacoes.filter((t) => mesChaveDeData(t.data) === mesAtualChave);
  const transacoesMesAnterior = transacoes.filter((t) => mesChaveDeData(t.data) === mesAnteriorChave);
  let labelMesAtual = new Date().toLocaleDateString('pt-BR', { month: 'long' });
  labelMesAtual = labelMesAtual.charAt(0).toUpperCase() + labelMesAtual.slice(1);

  return (
    <div className="content-grid">
      <div className="col-main">
        <HeroSaldo saldoReal={saldoReal} metaPrincipal={metaPrincipal} />
        <CardSaudeFinanceira transacoesMes={transacoesMesAtual} mesLabel={labelMesAtual} />
        <div className="row-2col">
          <BlobEntradaSaida transacoes={transacoesMesAtual} transacoesAnterior={transacoesMesAnterior} mesLabel={labelMesAtual} />
          <div className="only-desktop">
            <div className="glass" style={{ borderRadius: 22, padding: 22, height: '100%' }}>
              <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 10 }}>PATRIMÔNIO TOTAL</div>
              <div className="voice" style={{ fontSize: 28, fontWeight: 500, color: ink }}>{carregandoExtra ? '...' : `R$ ${fmt(patrimonioTotal)}`}</div>
              <div style={{ fontSize: 11.5, color: muted, marginTop: 4 }}>{patrimonioTotal === 0 && !carregandoExtra ? 'Nenhum ativo cadastrado ainda' : 'bancos + ativos reais'}</div>
            </div>
          </div>
        </div>
        <Feed transacoes={transacoes} userId={userId} />
        <RelatorioMensal transacoes={transacoes} />
      </div>
      <div className="col-side only-desktop">
        <div className="glass" style={{ borderRadius: 22, padding: 22, marginBottom: 20 }}>
          <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 10 }}>
            <Sparkles size={14} color={gold} />
            <span style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4 }}>PRÓXIMO MARCO</span>
          </div>
          <div style={{ fontSize: 13, lineHeight: 1.5, color: ink }}>Cadastre uma meta pra ver o progresso aqui (exemplo, ainda não conectado).</div>
        </div>
      </div>
    </div>
  );
}

function TelaPatrimonio({ householdId }) {
  const [ativos, setAtivos] = useState([]);
  const [totalBanco, setTotalBanco] = useState(0);
  const [carregando, setCarregando] = useState(true);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', categoria: 'Pecuária', investido: '', atual: '' });
  const [salvando, setSalvando] = useState(false);
  const mounted = useMounted(200);
  const [editandoId, setEditandoId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editCategoria, setEditCategoria] = useState('Pecuária');
  const [editInvestido, setEditInvestido] = useState('');
  const [editAtual, setEditAtual] = useState('');

  const abrirEdicao = (p) => {
    setEditandoId(p.id); setEditNome(p.nome); setEditCategoria(p.categoria); setEditInvestido(String(p.investido)); setEditAtual(p.atual != null ? String(p.atual) : '');
  };

  const salvarEdicao = async (id) => {
    if (!editNome || !editInvestido) return;
    const { error } = await window.db.from('assets').update({
      nome: editNome, categoria: editCategoria, investido: Number(editInvestido), atual: editAtual ? Number(editAtual) : null,
    }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setEditandoId(null);
    buscarTudo();
  };

  const apagar = async (id) => {
    if (!confirm('Apagar esse ativo?')) return;
    const { error } = await window.db.from('assets').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  const buscarTudo = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('assets').select('*').eq('household_id', householdId).order('data_aquisicao', { ascending: false }),
      window.db.from('accounts').select('saldo').eq('household_id', householdId),
    ]).then(([resAtivos, resContas]) => {
      setAtivos(resAtivos.data || []);
      setTotalBanco((resContas.data || []).reduce((s, c) => s + Number(c.saldo || 0), 0));
      setCarregando(false);
    });
  };

  useEffect(() => { buscarTudo(); }, [householdId]);

  const salvar = async () => {
    if (!novo.nome || !novo.investido) return;
    setSalvando(true);
    const { error } = await window.db.from('assets').insert([{
      household_id: householdId, nome: novo.nome, categoria: novo.categoria,
      investido: Number(novo.investido), atual: novo.atual ? Number(novo.atual) : null,
      data_aquisicao: new Date().toISOString().slice(0, 10),
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    setNovo({ nome: '', categoria: 'Pecuária', investido: '', atual: '' });
    setMostrarForm(false);
    setSalvando(false);
    buscarTudo();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const totalReal = ativos.reduce((s, p) => s + Number((p.atual !== null && p.atual !== undefined ? p.atual : p.investido) || 0), 0);
  const total = totalBanco + totalReal;
  const categoriasAtivo = ['Pecuária', 'Equipamento', 'Terra', 'Imóvel', 'Outro'];

  return (
    <div className="content-grid">
      <div className="col-main">
        <div className="hero-card" style={{ borderRadius: 30, padding: '28px 28px', color: '#fff', background: `linear-gradient(150deg, ${primary}, #4A5A2E)`, marginBottom: 24, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay', pointerEvents: 'none' }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontSize: 12.5, opacity: 0.8, marginBottom: 4 }}>O QUE VOCÊS JÁ CONSTRUÍRAM</div>
              <div className="voice hero-number">R$ {fmt(total)}</div>
            </div>
            <button onClick={() => setMostrarForm(!mostrarForm)} style={{ background: 'rgba(255,255,255,0.18)', border: 'none', color: '#fff', borderRadius: 20, padding: '9px 16px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
              + Adicionar ativo
            </button>
          </div>
          {total > 0 && (
            <>
              <div style={{ display: 'flex', height: 9, borderRadius: 5, overflow: 'hidden', marginTop: 18, marginBottom: 8 }}>
                <div style={{ width: mounted ? `${(totalBanco / total) * 100}%` : '50%', background: lucas, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
                <div style={{ width: mounted ? `${(totalReal / total) * 100}%` : '50%', background: marina, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, opacity: 0.9 }}>
                <span>Bancos: R$ {fmt(totalBanco)}</span><span>Ativos reais: R$ {fmt(totalReal)}</span>
              </div>
            </>
          )}
        </div>

        {mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 18, marginBottom: 20 }}>
            <input value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} placeholder="Ex: 6 bezerros para cria"
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 8 }}>
              {categoriasAtivo.map((c) => (
                <button key={c} onClick={() => setNovo({ ...novo, categoria: c })} style={{
                  padding: '6px 12px', borderRadius: 10, border: `1px solid ${novo.categoria === c ? primary : 'rgba(14,79,69,0.15)'}`,
                  background: novo.categoria === c ? primary : '#fff', color: novo.categoria === c ? '#fff' : ink, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                }}>{c}</button>
              ))}
            </div>
            <input value={categoriasAtivo.includes(novo.categoria) ? '' : novo.categoria} onChange={(e) => setNovo({ ...novo, categoria: e.target.value })}
              placeholder="Ou digite uma categoria própria"
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 14px', fontSize: 12.5, outline: 'none', marginBottom: 12, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor investido</label>
            <InputDinheiro value={novo.investido} onChange={(v) => setNovo({ ...novo, investido: v })} style={{ marginBottom: 10 }} />
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor atual (opcional — deixe em branco se só vai saber na hora de vender)</label>
            <InputDinheiro value={novo.atual} onChange={(v) => setNovo({ ...novo, atual: v })} style={{ marginBottom: 12 }} />
            <button onClick={salvar} disabled={salvando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', opacity: salvando ? 0.6 : 1 }}>
              {salvando ? 'Salvando...' : 'Salvar ativo'}
            </button>
          </div>
        )}

        {ativos.length === 0 && !mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center' }}>
            <TrendingUp size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhum ativo cadastrado ainda</div>
          </div>
        )}

        <div className="patrimonio-grid">
          {ativos.map((p) => {
            const Icon = categoriaIcon[p.categoria] || TrendingUp;
            const investido = Number(p.investido) || 1;
            const temAvaliacaoAtual = p.atual !== null && p.atual !== undefined && p.atual !== '';
            const valorizacao = temAvaliacaoAtual ? (((Number(p.atual) - investido) / investido) * 100).toFixed(0) : null;
            const marco = valorizacao !== null && valorizacao >= 25;
            const editando = editandoId === p.id;

            if (editando) {
              return (
                <div key={p.id} className="glass patrimonio-card">
                  <input value={editNome} onChange={(e) => setEditNome(e.target.value)} placeholder="Nome do ativo"
                    style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px', fontSize: 13, outline: 'none', marginBottom: 8, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                  <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginBottom: 6 }}>
                    {['Pecuária', 'Equipamento', 'Terra', 'Imóvel', 'Outro'].map((c) => (
                      <button key={c} onClick={() => setEditCategoria(c)} style={{
                        padding: '4px 9px', borderRadius: 8, border: `1px solid ${editCategoria === c ? primary : 'rgba(14,79,69,0.15)'}`,
                        background: editCategoria === c ? primary : '#fff', color: editCategoria === c ? '#fff' : ink, fontSize: 11, fontWeight: 600, cursor: 'pointer',
                      }}>{c}</button>
                    ))}
                  </div>
                  <input value={['Pecuária', 'Equipamento', 'Terra', 'Imóvel', 'Outro'].includes(editCategoria) ? '' : editCategoria} onChange={(e) => setEditCategoria(e.target.value)}
                    placeholder="Ou digite uma categoria própria"
                    style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 10, padding: '7px 11px', fontSize: 11.5, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                  <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Investido</label>
                  <InputDinheiro value={editInvestido} onChange={setEditInvestido} style={{ marginBottom: 8 }} />
                  <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor atual (opcional)</label>
                  <InputDinheiro value={editAtual} onChange={setEditAtual} style={{ marginBottom: 10 }} />
                  <div style={{ display: 'flex', gap: 8 }}>
                    <button onClick={() => salvarEdicao(p.id)} style={{ flex: 1, background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '9px 0', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Salvar</button>
                    <button onClick={() => setEditandoId(null)} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '9px 12px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
                  </div>
                </div>
              );
            }

            return (
              <div key={p.id} className="glass patrimonio-card">
                <Icon size={100} color={primary} style={{ position: 'absolute', top: -14, right: -24, opacity: 0.055, pointerEvents: 'none' }} />
                {marco && <div style={{ position: 'absolute', top: 14, right: 46, width: 22, height: 22, borderRadius: '50%', background: gold, display: 'flex', alignItems: 'center', justifyContent: 'center', boxShadow: '0 2px 6px rgba(201,164,106,0.5)' }}><span style={{ fontSize: 11 }}>★</span></div>}
                <div style={{ position: 'absolute', top: 14, right: 14, display: 'flex', gap: 8, zIndex: 1 }}>
                  <button onClick={() => abrirEdicao(p)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Pencil size={13} color={muted} /></button>
                  <button onClick={() => apagar(p.id)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Trash2 size={13} color="#C1694F" /></button>
                </div>
                <div style={{ fontSize: 10.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 10 }}>{(p.categoria || '').toUpperCase()}</div>
                <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 18, lineHeight: 1.35, maxWidth: '85%' }}>{p.nome}</div>
                <div style={{ fontSize: 10.5, color: muted }}>Investido</div>
                <div style={{ fontSize: 12.5, marginBottom: 10 }}>R$ {fmt(p.investido)}</div>
                {temAvaliacaoAtual ? (
                  <>
                    <div className="voice" style={{ fontSize: 'clamp(17px, 6vw, 21px)', fontWeight: 500 }}>R$ {fmt(p.atual)}</div>
                    <div style={{ fontSize: 11.5, color: gold, fontWeight: 600, marginTop: 2 }}>↗ {valorizacao >= 0 ? '+' : ''}{valorizacao}%</div>
                  </>
                ) : (
                  <div style={{ fontSize: 11.5, color: muted, fontStyle: 'italic', marginTop: 2 }}>Valor atual ainda não avaliado</div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

const tipoSinal = { entrada: '+', saida: '-', investimento: '+' };
const tipoCor = { entrada: primary, saida: ink, investimento: gold };

function TelaLancamentos({ transacoes = [], householdId, userId, rendaRegular = true, adicionarLancamento, editarLancamento, apagarLancamento, adicionarItemFatura, adicionarParcela, abrirFormAuto, onAbrirFormAutoConsumido }) {
  const [filtro, setFiltro] = useState('todos');
  const [busca, setBusca] = useState('');
  const [mostrarForm, setMostrarForm] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [novo, setNovo] = useState({ descricao: '', valor: '', tipo: 'saida', categoria: 'Geral', formaPagamento: 'direto', contaCartaoId: '', parcelado: false, numParcelas: '', data: new Date().toISOString().slice(0, 10), visivelParaOutros: true, aplicarDivisao: true, abastecerCaixinhas: false, valoresCaixinhas: {} });
  const [salvando, setSalvando] = useState(false);
  const [contas, setContas] = useState([]);
  const [metasAbastecer, setMetasAbastecer] = useState([]);
  const [regrasEntrada, setRegrasEntrada] = useState([]);
  const mesAtualChave = mesChaveDeData(new Date().toISOString().slice(0, 10));
  const [mesSelecionado, setMesSelecionado] = useState(mesAtualChave);

  useEffect(() => {
    if (!householdId || !userId) return;
    Promise.all([
      window.db.from('regras_alocacao').select('meta_id, percentual').eq('autor_id', userId),
      window.db.from('metas').select('id, nome').eq('household_id', householdId),
    ]).then(([resRegras, resMetas]) => {
      const mapaMetas = {};
      (resMetas.data || []).forEach((m) => { mapaMetas[m.id] = m.nome; });
      setRegrasEntrada((resRegras.data || []).filter((r) => mapaMetas[r.meta_id]).map((r) => ({ metaId: r.meta_id, nome: mapaMetas[r.meta_id], percentual: Number(r.percentual) })));
    });
  }, [householdId, userId]);

  const [fixas, setFixas] = useState([]);
  const [mostrarFixas, setMostrarFixas] = useState(false);
  const [mostrarFormFixa, setMostrarFormFixa] = useState(false);
  const [novaFixa, setNovaFixa] = useState({ descricao: '', valor: '', diaCobranca: '' });
  const [editandoFixaId, setEditandoFixaId] = useState(null);
  const [editFixaDescricao, setEditFixaDescricao] = useState('');
  const [editFixaValor, setEditFixaValor] = useState('');
  const [editFixaDia, setEditFixaDia] = useState('');

  const buscarFixas = () => {
    if (!householdId) return;
    window.db.from('recorrencias').select('*').eq('household_id', householdId).is('account_id', null).order('created_at', { ascending: true })
      .then(({ data }) => setFixas(data || []));
  };

  useEffect(() => { buscarFixas(); }, [householdId]);

  const salvarFixa = async () => {
    if (!novaFixa.descricao || !novaFixa.valor) return;
    const { error } = await window.db.from('recorrencias').insert([{
      household_id: householdId, account_id: null, descricao: novaFixa.descricao,
      valor: Number(novaFixa.valor), dia_cobranca: Number(novaFixa.diaCobranca) || null, ativo: true,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setNovaFixa({ descricao: '', valor: '', diaCobranca: '' });
    setMostrarFormFixa(false);
    buscarFixas();
  };

  const abrirEdicaoFixa = (f) => {
    setEditandoFixaId(f.id); setEditFixaDescricao(f.descricao); setEditFixaValor(String(f.valor)); setEditFixaDia(String(f.dia_cobranca || ''));
  };

  const salvarEdicaoFixa = async (id) => {
    if (!editFixaDescricao || !editFixaValor) return;
    const { data, error } = await window.db.from('recorrencias').update({
      descricao: editFixaDescricao, valor: Number(editFixaValor), dia_cobranca: Number(editFixaDia) || null,
    }).eq('id', id).select();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra editar essa conta fixa.'); return; }
    setEditandoFixaId(null);
    buscarFixas();
  };

  const apagarFixa = async (id) => {
    if (!confirm('Apagar essa conta fixa?')) return;
    const { data, error } = await window.db.from('recorrencias').delete().eq('id', id).select();
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra apagar essa conta fixa.'); return; }
    buscarFixas();
  };

  useEffect(() => {
    if (!householdId) return;
    window.db.from('accounts').select('id, nome, cor, dono').eq('household_id', householdId).then(({ data }) => setContas(data || []));
  }, [householdId]);

  useEffect(() => {
    if (!householdId || !userId) return;
    const idsConjunta = contas.filter((c) => c.dono === 'Conjunta').map((c) => c.id);
    window.db.from('metas').select('id, nome, valor_atual, account_id, autor_id').eq('household_id', householdId).then(({ data }) => {
      setMetasAbastecer((data || []).filter((mt) => mt.autor_id === userId || !mt.autor_id || idsConjunta.includes(mt.account_id)));
    });
  }, [householdId, userId, contas]);

  useEffect(() => {
    if (abrirFormAuto) {
      setEditandoId(null);
      setMostrarForm(true);
      if (onAbrirFormAutoConsumido) onAbrirFormAutoConsumido();
    }
  }, [abrirFormAuto]);

  const mesesDisponiveis = Array.from(new Set(transacoes.map((t) => mesChaveDeData(t.data))));
  if (!mesesDisponiveis.includes(mesAtualChave)) mesesDisponiveis.push(mesAtualChave);
  mesesDisponiveis.sort((a, b) => b.localeCompare(a));

  const filtrados = transacoes
    .filter((l) => mesSelecionado === 'todos' || mesChaveDeData(l.data) === mesSelecionado)
    .filter((l) => filtro === 'todos' || l.tipo === filtro)
    .filter((l) => (l.descricao || '').toLowerCase().includes(busca.toLowerCase()));
  const grupos = {};
  filtrados.forEach((l) => { (grupos[l.data] = grupos[l.data] || []).push(l); });
  const datasOrdenadas = Object.keys(grupos).sort((a, b) => b.localeCompare(a));
  const dataFmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', weekday: 'short' });

  const transacoesDoMes = transacoes.filter((l) => mesSelecionado === 'todos' || mesChaveDeData(l.data) === mesSelecionado);
  const porCategoria = {};
  transacoesDoMes.filter((l) => l.tipo === 'saida').forEach((l) => { const c = l.categoria || 'Geral'; porCategoria[c] = (porCategoria[c] || 0) + Number(l.valor); });
  const categoriasTop = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maiorCategoria = categoriasTop[0]?.[1] || 1;

  const filtros = [
    { id: 'todos', label: 'Todos' }, { id: 'entrada', label: 'Entradas' },
    { id: 'saida', label: 'Saídas' }, { id: 'investimento', label: 'Investimentos' },
  ];

  const abrirNovo = () => { setEditandoId(null); setNovo({ descricao: '', valor: '', tipo: 'saida', categoria: 'Geral', formaPagamento: 'direto', contaCartaoId: '', parcelado: false, numParcelas: '', data: new Date().toISOString().slice(0, 10), visivelParaOutros: true, aplicarDivisao: true, abastecerCaixinhas: false, valoresCaixinhas: {} }); setMostrarForm(!mostrarForm); };
  const abrirEdicao = (t) => { setEditandoId(t.id); setNovo({ descricao: t.descricao, valor: String(t.valor), tipo: t.tipo, categoria: t.categoria || 'Geral', formaPagamento: 'direto', contaCartaoId: '', parcelado: false, numParcelas: '', data: t.data || new Date().toISOString().slice(0, 10), visivelParaOutros: t.visivel !== false, aplicarDivisao: false, abastecerCaixinhas: false, valoresCaixinhas: {} }); setMostrarForm(true); };

  const ehCartao = novo.tipo === 'saida' && novo.formaPagamento === 'cartao';
  const ehParcelado = novo.tipo === 'saida' && novo.formaPagamento === 'parcelado';
  const precisaConta = ehCartao || ehParcelado;

  const salvar = async () => {
    if (!novo.descricao || !novo.valor) return;
    if (precisaConta && !novo.contaCartaoId) { alert(ehParcelado ? 'Escolha de qual conta as parcelas vão sair.' : 'Escolha em qual cartão foi a compra.'); return; }
    if (ehParcelado && (!novo.numParcelas || Number(novo.numParcelas) < 2)) { alert('Informe em quantas parcelas (mínimo 2).'); return; }
    setSalvando(true);
    try {
      if (editandoId) {
        await editarLancamento(editandoId, { descricao: novo.descricao, valor: Number(novo.valor), tipo: novo.tipo, categoria: novo.categoria, data: novo.data, visivel: novo.visivelParaOutros });
      } else if (ehParcelado) {
        await adicionarParcela({
          account_id: novo.contaCartaoId, descricao: novo.descricao, valor_total: Number(novo.valor),
          num_parcelas: Number(novo.numParcelas), data_primeira_parcela: new Date().toISOString().slice(0, 10),
        });
      } else if (ehCartao) {
        await adicionarItemFatura({
          account_id: novo.contaCartaoId, descricao: novo.descricao, valor: Number(novo.valor), categoria: novo.categoria,
        });
      } else {
        await adicionarLancamento({
          descricao: novo.descricao, valor: Number(novo.valor), tipo: novo.tipo,
          categoria: novo.categoria, grupo: 'Variável', visivel: novo.visivelParaOutros,
          data: novo.data || new Date().toISOString().slice(0, 10),
        });
        if (novo.tipo === 'entrada' && novo.abastecerCaixinhas) {
          const alocacoes = rendaRegular
            ? regrasEntrada.map((r) => ({ metaId: r.metaId, valor: Number(novo.valor) * (r.percentual / 100) })).filter((a) => a.valor > 0)
            : Object.entries(novo.valoresCaixinhas).map(([metaId, v]) => ({ metaId, valor: Number(v) || 0 })).filter((a) => a.valor > 0);
          for (const a of alocacoes) {
            const { data: metaAtual } = await window.db.from('metas').select('valor_atual').eq('id', a.metaId).maybeSingle();
            if (!metaAtual) continue;
            await window.db.from('metas').update({ valor_atual: Number(metaAtual.valor_atual) + a.valor }).eq('id', a.metaId);
            await window.db.from('aportes_caixinha').insert([{
              household_id: householdId, meta_id: a.metaId, autor_id: userId, tipo: 'entrada',
              valor: a.valor, data: novo.data || new Date().toISOString().slice(0, 10),
            }]);
          }
        }
      }
      setNovo({ descricao: '', valor: '', tipo: 'saida', categoria: 'Geral', formaPagamento: 'direto', contaCartaoId: '', parcelado: false, numParcelas: '', data: new Date().toISOString().slice(0, 10), visivelParaOutros: true, aplicarDivisao: true, abastecerCaixinhas: false, valoresCaixinhas: {} });
      setMostrarForm(false);
      setEditandoId(null);
    } catch (erro) {
      alert('Erro ao salvar: ' + erro.message);
    }
    setSalvando(false);
  };

  const apagar = async (id) => {
    if (!confirm('Apagar esse lançamento?')) return;
    try { await apagarLancamento(id); } catch (erro) { alert('Erro ao apagar: ' + erro.message); }
  };

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 18, flexWrap: 'wrap', gap: 10 }}>
          <div>
            <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 2 }}>Lançamentos</div>
            <div style={{ fontSize: 13, color: muted }}>Dado real, direto do seu Supabase</div>
          </div>
          <button onClick={abrirNovo} style={{ background: primary, color: '#fff', border: 'none', borderRadius: 20, padding: '10px 18px', fontSize: 13, fontWeight: 600, cursor: 'pointer' }}>
            + Novo lançamento
          </button>
        </div>

        <div className="glass" style={{ borderRadius: 20, padding: 18, marginBottom: 18 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', cursor: 'pointer' }} onClick={() => setMostrarFixas(!mostrarFixas)}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
              <Receipt size={15} color={muted} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>Contas fixas mensais</span>
              <span style={{ fontSize: 11, color: muted }}>(aluguel, internet, plano de saúde...)</span>
            </div>
            <span style={{ fontSize: 11.5, color: primary, fontWeight: 600 }}>{mostrarFixas ? 'Ocultar' : fixas.length > 0 ? `${fixas.length} cadastrada(s)` : 'Ver / cadastrar'}</span>
          </div>

          {mostrarFixas && (
            <div style={{ marginTop: 14, paddingTop: 14, borderTop: '1px solid rgba(14,79,69,0.08)' }}>
              <div style={{ fontSize: 11, color: muted, marginBottom: 12, lineHeight: 1.4 }}>Essas são fixas todo mês e não são cartão — aparecem na projeção de Contas a Pagar automaticamente.</div>

              {fixas.map((f) => (
                editandoFixaId === f.id ? (
                  <div key={f.id} style={{ background: 'rgba(14,79,69,0.04)', borderRadius: 12, padding: 12, marginBottom: 8 }}>
                    <input value={editFixaDescricao} onChange={(e) => setEditFixaDescricao(e.target.value)} placeholder="Descrição"
                      style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 10, padding: '8px 12px', fontSize: 12.5, outline: 'none', marginBottom: 8, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                    <div style={{ display: 'flex', gap: 8, marginBottom: 8 }}>
                      <InputDinheiro value={editFixaValor} onChange={setEditFixaValor} style={{ flex: 1 }} />
                      <input type="number" value={editFixaDia} onChange={(e) => setEditFixaDia(e.target.value)} placeholder="Dia"
                        style={{ width: 70, border: '1px solid rgba(14,79,69,0.15)', borderRadius: 10, padding: '8px 8px', fontSize: 12.5, outline: 'none', fontFamily: 'inherit' }} />
                    </div>
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => salvarEdicaoFixa(f.id)} style={{ flex: 1, background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '8px 0', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Salvar</button>
                      <button onClick={() => setEditandoFixaId(null)} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '8px 12px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
                    </div>
                  </div>
                ) : (
                  <div key={f.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '8px 0', borderBottom: '1px solid rgba(14,79,69,0.06)' }}>
                    <span style={{ fontSize: 12.5 }}>{f.descricao} {f.dia_cobranca && <span style={{ color: muted, fontSize: 11 }}>· dia {f.dia_cobranca}</span>}</span>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                      <span style={{ fontSize: 12.5, fontWeight: 600 }}>R$ {fmt(f.valor)}/mês</span>
                      <button onClick={() => abrirEdicaoFixa(f)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Pencil size={12} color={muted} /></button>
                      <button onClick={() => apagarFixa(f.id)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Trash2 size={12} color="#C1694F" /></button>
                    </div>
                  </div>
                )
              ))}
              {fixas.length === 0 && !mostrarFormFixa && <div style={{ fontSize: 12, color: muted, marginBottom: 10 }}>Nenhuma conta fixa cadastrada ainda</div>}

              {mostrarFormFixa ? (
                <div style={{ background: 'rgba(14,79,69,0.04)', borderRadius: 12, padding: 12, marginTop: 10 }}>
                  <input value={novaFixa.descricao} onChange={(e) => setNovaFixa({ ...novaFixa, descricao: e.target.value })} placeholder="Ex: Aluguel, Internet, Plano de saúde"
                    style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 10, padding: '8px 12px', fontSize: 12.5, outline: 'none', marginBottom: 8, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                  <div style={{ display: 'flex', gap: 8, marginBottom: 10 }}>

function agruparMetasCasal(metas, contas) {
  const contaConjuntaIds = new Set(contas.filter((c) => c.dono === 'Conjunta').map((c) => c.id));
  const conjunta = metas.filter((m) => m.accountId && contaConjuntaIds.has(m.accountId));
  const pessoais = metas.filter((m) => !(m.accountId && contaConjuntaIds.has(m.accountId)));

  const porNome = {};
  pessoais.forEach((m) => {
    const chave = (m.nome || '').trim().toLowerCase();
    (porNome[chave] = porNome[chave] || []).push(m);
  });

  const paresCasal = [];
  Object.values(porNome).forEach((grupo) => {
    const autores = new Set(grupo.map((m) => m.autorId).filter(Boolean));
    if (autores.size >= 2) {
      paresCasal.push({
        nome: grupo[0].nome,
        total: grupo.reduce((s, m) => s + m.total, 0),
        atual: grupo.reduce((s, m) => s + m.atual, 0),
        aporteMedio: grupo.reduce((s, m) => s + (m.aporteMedio || 0), 0),
        partes: grupo,
      });
    }
  });

  return { conjunta, paresCasal, pessoais };
}

function mesesParaAtingirMeta(atual, total, aporteMedio, taxaAnual) {
  if (atual >= total) return 0;
  const taxaMensal = taxaAnual > 0 ? Math.pow(1 + taxaAnual / 100, 1 / 12) - 1 : 0;
  if (taxaMensal <= 0 && aporteMedio <= 0) return null; // nunca vai chegar no ritmo atual
  let saldo = atual;
  for (let m = 1; m <= 1200; m++) { // teto de 100 anos
    saldo = saldo * (1 + taxaMensal) + aporteMedio;
    if (saldo >= total) return m;
  }
  return null; // passou de 100 anos, não vale a pena mostrar previsão
}

function MetaCard({
  m, contas, userId, editando, editNome, setEditNome, editTotal, setEditTotal, editAtual, setEditAtual,
  editAporte, setEditAporte, editAccountId, setEditAccountId, editTaxa, setEditTaxa, editPrivada, setEditPrivada,
  onEditar, onApagar, onSalvar, onCancelar, historicoAberto, onVerHistorico, historico, carregandoHistorico, onToggleFavorita,
}) {
  const percent = Math.min(100, (m.atual / (m.total || 1)) * 100);
  const falta = Math.max(0, m.total - m.atual);
  const taxa = Number(m.taxaAnual || 0);
  const taxaConsiderada = m.accountId ? taxa : 0; // só rende de verdade se estiver guardada numa conta
  const meses = mesesParaAtingirMeta(m.atual, m.total, m.aporteMedio, taxaConsiderada);
  const anos = meses !== null ? Math.floor(meses / 12) : 0, mesesResto = meses !== null ? meses % 12 : 0;
  const conta = contas.find((c) => c.id === m.accountId);
  const souDono = !m.autorId || m.autorId === userId || (conta && conta.dono === 'Conjunta');
  const estimativaRendimento = (() => {
    if (!m.accountId || taxa <= 0) return null;
    const dataRef = m.dataReferencia ? new Date(m.dataReferencia + 'T00:00:00') : new Date();
    const diasUteis = diasUteisEntre(dataRef, new Date());
    return Number(m.atual || 0) * Math.pow(1 + taxa / 100, diasUteis / 252);
  })();

  if (editando) {
    return (
      <div className="glass" style={{ borderRadius: 24, padding: 24 }}>
        <input value={editNome} onChange={(e) => setEditNome(e.target.value)} placeholder="Nome da meta"
          style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
        <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor total (alvo)</label>

        <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Já alcançado</label>
        <InputDinheiro value={editAtual} onChange={setEditAtual} style={{ marginBottom: 8 }} />
        <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Aporte médio/mês</label>
        <InputDinheiro value={editAporte} onChange={setEditAporte} style={{ marginBottom: 10 }} />
        <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 5 }}>Guardada numa conta? (opcional, permite estimar rendimento)</label>
