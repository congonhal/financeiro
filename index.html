            <button key={c.id} onClick={() => setEditAccountId(c.id)} style={{
              display: 'flex', alignItems: 'center', gap: 5, padding: '5px 11px', borderRadius: 12,
              border: `1px solid ${editAccountId === c.id ? primary : 'rgba(14,79,69,0.15)'}`,
              background: editAccountId === c.id ? primaryTint : '#fff', color: editAccountId === c.id ? primary : ink, fontSize: 11.5, fontWeight: 600, cursor: 'pointer',
            }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: c.cor || primary }} />{c.nome}
            </button>
          ))}
        </div>
        {editAccountId && (
          <div style={{ marginBottom: 10 }}>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Taxa ao ano (%) — deixe 0 se não souber</label>
            <input type="number" value={editTaxa} onChange={(e) => setEditTaxa(e.target.value)}
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
          </div>
        )}
        <label style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, cursor: 'pointer' }}>
          <input type="checkbox" checked={editPrivada} onChange={(e) => setEditPrivada(e.target.checked)} style={{ width: 15, height: 15 }} />
          <span style={{ fontSize: 12, color: ink }}>Meta privada — só eu vejo</span>
        </label>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={onSalvar} style={{ flex: 1, background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '9px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Salvar</button>
          <button onClick={onCancelar} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '9px 14px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
        </div>
      </div>
    );
  }

  return (
    <div className="glass" style={{ borderRadius: 24, padding: 24, position: 'relative', overflow: 'hidden' }}>
      {m.destaque && <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.03, mixBlendMode: 'overlay', pointerEvents: 'none' }} />}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 8 }}>
        <div>
          <div style={{ fontSize: 14, fontWeight: 600, marginBottom: conta ? 4 : 0, display: 'flex', alignItems: 'center', gap: 6 }}>
            {m.nome}
            {m.privada && <Lock size={11} color={muted} title="Meta privada — só você vê" />}
          </div>
          {conta && (
            <div style={{ display: 'flex', alignItems: 'center', gap: 5 }}>
              <div style={{ width: 6, height: 6, borderRadius: '50%', background: conta.cor || primary }} />
              <span style={{ fontSize: 10.5, color: muted }}>guardada em {conta.nome}{taxa > 0 ? ` · ${taxa}% a.a.` : ''}</span>
            </div>
          )}
          {!m.autorId && (
            <div style={{ fontSize: 10, color: gold, marginTop: 2 }}>Sem dono definido — edite e salve pra assumir essa meta</div>
          )}
        </div>
        {souDono && (
          <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
            <button onClick={onToggleFavorita} title={m.favorita ? 'Tirar dos favoritos' : 'Marcar como favorita (aparece no Painel)'} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}>
              <Star size={13} filled={m.favorita} color={m.favorita ? gold : muted} />
            </button>
            <button onClick={onEditar} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Pencil size={13} color={muted} /></button>
            <button onClick={onApagar} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Trash2 size={13} color="#C1694F" /></button>
          </div>
        )}
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginTop: 12 }}>
        <div style={{ position: 'relative', width: 84, height: 84, flexShrink: 0 }}>
          <ProgressRing percent={percent} size={84} stroke={8} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700, color: ink }}>{percent.toFixed(0)}%</div>
        </div>
        <div style={{ fontSize: 12 }}>
          <div style={{ color: muted, marginBottom: 2 }}>Alcançado</div>
          <div style={{ fontWeight: 600, marginBottom: 8, fontSize: 13.5 }}>R$ {fmt(m.atual)}</div>
          <div style={{ color: muted, marginBottom: 2 }}>Meta</div>
          <div style={{ fontWeight: 600, fontSize: 13.5 }}>R$ {fmt(m.total)}</div>
        </div>
      </div>
      {estimativaRendimento !== null && estimativaRendimento > m.atual && (
        <div style={{ fontSize: 11, color: primary, marginTop: 10 }}>+ R$ {fmt(estimativaRendimento - m.atual)} estimado de rendimento até hoje (dias úteis)</div>
      )}
      <div style={{ marginTop: 18, paddingTop: 14, borderTop: '1px solid rgba(14,79,69,0.08)', fontSize: 12.5, color: muted, lineHeight: 1.5 }}>
        {percent >= 100 ? (
          <span style={{ color: primary, fontWeight: 600 }}>Meta alcançada 🎉</span>
        ) : meses === null ? (
          <>No ritmo atual (<b style={{ color: ink }}>R$ {fmt(m.aporteMedio)}/mês</b>{taxaConsiderada > 0 ? ` + ${taxaConsiderada}% a.a.` : ''}), essa meta não tem previsão de chegar lá — ajuste o aporte ou a taxa.</>
        ) : (
          <>No ritmo atual (<b style={{ color: ink }}>R$ {fmt(m.aporteMedio)}/mês</b>{taxaConsiderada > 0 ? <> + rendimento de <b style={{ color: ink }}>{taxaConsiderada}% a.a.</b></> : ''}), faltam <b style={{ color: ink }}>{meses} {meses === 1 ? 'mês' : 'meses'}</b>{anos > 0 && <> (~{anos}a{mesesResto > 0 ? ` ${mesesResto}m` : ''})</>}</>
        )}
      </div>
      <button onClick={onVerHistorico} style={{ background: 'transparent', border: 'none', color: muted, borderRadius: 10, padding: '8px 0 0', fontSize: 11.5, fontWeight: 600, cursor: 'pointer' }}>
        {historicoAberto ? 'Ocultar histórico' : 'Ver histórico'}
      </button>
      {historicoAberto && (
        <div style={{ marginTop: 8, paddingTop: 10, borderTop: '1px solid rgba(14,79,69,0.08)' }}>
          {carregandoHistorico && !historico && <div style={{ fontSize: 11.5, color: muted }}>Carregando...</div>}
          {historico && historico.length === 0 && <div style={{ fontSize: 11.5, color: muted }}>Nenhuma movimentação registrada ainda</div>}
          {historico && historico.map((a) => (
            <div key={a.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, padding: '4px 0' }}>
              <span style={{ color: muted }}>{new Date(a.data + 'T00:00:00').toLocaleDateString('pt-BR')}</span>
              <span style={{ fontWeight: 600, color: a.tipo === 'entrada' ? primary : '#C1694F' }}>{a.tipo === 'entrada' ? '+' : '−'} R$ {fmt(a.valor)}</span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function addMeses(anoMesChave, n) {
  const [ano, mes] = anoMesChave.split('-').map(Number);
  const d = new Date(ano, mes - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
const mesChaveDeData = (dataStr) => dataStr.slice(0, 7);
const nomeMes = (chave) => {
  const [ano, mes] = chave.split('-').map(Number);
  return new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
};
// A fatura de uma conta não é "o mês em que a compra foi feita" — é o mês do PRÓXIMO vencimento
// dessa conta a partir de hoje. Uma compra do dia 8 pode perfeitamente só vencer no mês seguinte.
function domingoDePascoa(ano) {
  const a = ano % 19, b = Math.floor(ano / 100), c = ano % 100;
  const d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25);
  const g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30;
  const i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7;
  const m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mes = Math.floor((h + l - 7 * m + 114) / 31), dia = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(ano, mes - 1, dia);
}

function feriadosNacionais(ano) {
  const chave = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  const pascoa = domingoDePascoa(ano);
  const somarDias = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
  const datas = [
    new Date(ano, 0, 1),   // Confraternização Universal
    somarDias(pascoa, -47), // Carnaval (terça)
    somarDias(pascoa, -2),  // Sexta-feira Santa
    somarDias(pascoa, 60),  // Corpus Christi
    new Date(ano, 3, 21),   // Tiradentes
    new Date(ano, 4, 1),    // Dia do Trabalho
    new Date(ano, 8, 7),    // Independência
    new Date(ano, 9, 12),   // Nossa Senhora Aparecida
    new Date(ano, 10, 2),   // Finados
    new Date(ano, 10, 15),  // Proclamação da República
    new Date(ano, 10, 20),  // Consciência Negra (feriado nacional desde 2024)
    new Date(ano, 11, 25),  // Natal
  ];
  return new Set(datas.map(chave));
}

function diasUteisEntre(dataInicio, dataFim) {
  if (dataFim <= dataInicio) return 0;
  const anos = new Set();
  for (let a = dataInicio.getFullYear(); a <= dataFim.getFullYear(); a++) anos.add(a);
  const feriados = new Set();
  anos.forEach((a) => feriadosNacionais(a).forEach((f) => feriados.add(f)));
  const chave = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  let count = 0;
  const cursor = new Date(dataInicio);
  cursor.setHours(0, 0, 0, 0);
  const fim = new Date(dataFim);
  fim.setHours(0, 0, 0, 0);
  while (cursor < fim) {
    const diaSemana = cursor.getDay();
    if (diaSemana !== 0 && diaSemana !== 6 && !feriados.has(chave(cursor))) count++;
    cursor.setDate(cursor.getDate() + 1);
  }
  return count;
}

function mesDoProximoVencimento(diaVenc, hoje = new Date()) {
  const dia = diaVenc || hoje.getDate();
  let mes = hoje.getMonth(), ano = hoje.getFullYear();
  if (hoje.getDate() > dia) { mes += 1; if (mes > 11) { mes = 0; ano += 1; } }
  return `${ano}-${String(mes + 1).padStart(2, '0')}`;
}

function TelaContasAPagar({ userId, householdId }) {
  const [contas, setContas] = useState([]);
  const [itens, setItens] = useState([]);
  const [parcelas, setParcelas] = useState([]);
  const [recorrencias, setRecorrencias] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState('');

  const buscar = () => {
    setCarregando(true);
    setErro('');
    Promise.all([
      window.db.from('accounts').select('*').eq('household_id', householdId),
      window.db.from('fatura_itens').select('*').eq('household_id', householdId),
      window.db.from('compras_parceladas').select('*').eq('household_id', householdId),
      window.db.from('recorrencias').select('*').eq('household_id', householdId).eq('ativo', true),
    ]).then(([resContas, resItens, resParcelas, resRecorrencias]) => {
      const erros = [resContas, resItens, resParcelas, resRecorrencias].map((r) => r.error).filter(Boolean);
      if (erros.length > 0) setErro(erros[0].message + ' — confirma se todos os SQLs de atualização foram rodados.');
      setContas(resContas.data || []);
      setItens(resItens.data || []);
      setParcelas(resParcelas.data || []);
      setRecorrencias(resRecorrencias.data || []);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const pagarFatura = async (contaId, itensDaConta) => {
    const total = itensDaConta.reduce((s, i) => s + Number(i.valor), 0);
    if (total <= 0) return;
    const conta = contas.find((c) => c.id === contaId);
    if (!confirm(`Confirmar pagamento de R$ ${fmt(total)} da fatura ${conta?.nome}?`)) return;
    await window.db.from('transactions').insert([{
      household_id: householdId, autor_id: userId, tipo: 'saida', descricao: `Pagamento fatura ${conta?.nome || ''}`,
      valor: total, categoria: 'Fatura', grupo: 'Fixa', visivel: true, data: new Date().toISOString().slice(0, 10), conta: contaId,
    }]);
    await window.db.from('fatura_itens').delete().in('id', itensDaConta.map((i) => i.id));
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const fixas = recorrencias.filter((r) => !r.account_id);

  // Monta a projeção dos próximos 6 meses, somando 3 fontes: itens reais + parcelas (avulsas e da fatura) + recorrências
  const hoje = new Date();
  const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
  const numMeses = 6;
  const chavesMeses = Array.from({ length: numMeses }, (_, k) => addMeses(mesAtual, k));

  const projecao = {};
  const contaFixasSemCartao = { id: '__semconta__', nome: 'Contas fixas (sem cartão)', cor: muted, dia_venc: null };
  const listaParaProjecao = [...contas, contaFixasSemCartao];
  chavesMeses.forEach((mk) => { projecao[mk] = {}; listaParaProjecao.forEach((c) => { projecao[mk][c.id] = { total: 0, itensReais: [] }; }); });

  const somar = (mk, contaId, valor, item) => {
    if (!projecao[mk] || !projecao[mk][contaId]) return;
    projecao[mk][contaId].total += valor;
    if (item) projecao[mk][contaId].itensReais.push(item);
  };

  // 1. Itens de fatura já lançados (manual ou CSV) — todos pertencem à PRÓXIMA fatura a vencer
  // dessa conta (não ao mês em que a compra foi feita) — e suas parcelas futuras projetadas
  itens.forEach((i) => {
    const conta = contas.find((c) => c.id === i.account_id);
    const mk = mesDoProximoVencimento(conta?.dia_venc, hoje);
    somar(mk, i.account_id, Number(i.valor), i);
    if (i.parcela_atual && i.parcela_total && i.parcela_atual < i.parcela_total) {
      for (let n = 1; n <= i.parcela_total - i.parcela_atual; n++) {
        somar(addMeses(mk, n), i.account_id, Number(i.valor), null);
      }
    }
  });

  // 2. Compras parceladas (cadastradas manualmente) — usa a data que a própria pessoa informou
  parcelas.forEach((p) => {
    const mkInicio = mesChaveDeData(p.data_primeira_parcela);
    const valorParcela = p.valor_total / p.num_parcelas;
    for (let n = 0; n < p.num_parcelas; n++) {
      somar(addMeses(mkInicio, n), p.account_id, valorParcela, null);
    }
  });

  // 3. Recorrências fixas — se tem conta/cartão, repete a partir do próximo vencimento da conta;
  // se não tem (contas fixas mensais tipo aluguel/internet), usa o próprio dia de cobrança dela.
  // Pra não contar em dobro com o que vem do CSV, isso NÃO tenta adivinhar por nome/valor —
  // só pula um mês se a própria pessoa marcou explicitamente esse mês como "já coberto pela fatura".
  recorrencias.forEach((r) => {
    const conta = contas.find((c) => c.id === r.account_id);
    const contaId = r.account_id || '__semconta__';
    const diaBase = conta ? conta.dia_venc : r.dia_cobranca;
    const mkInicio = mesDoProximoVencimento(diaBase, hoje);
    for (let n = 0; n < numMeses; n++) {
      const mk = addMeses(mkInicio, n);
      if (r.ultimo_mes_coberto && mk <= r.ultimo_mes_coberto) continue;
      somar(mk, contaId, Number(r.valor), null);
    }
  });

  const totalGeralJanela = chavesMeses.reduce((s, mk) => s + listaParaProjecao.reduce((s2, c) => s2 + projecao[mk][c.id].total, 0), 0);

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ marginBottom: 4 }}>
          <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 2 }}>Contas a Pagar</div>
          <div style={{ fontSize: 13, color: muted }}>Linha do tempo dos próximos 6 meses — faturas, parcelas e recorrências, tudo somado</div>
        </div>

        {erro && (
          <div style={{ background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '12px 14px', fontSize: 12.5, marginTop: 16, lineHeight: 1.5 }}>
            {erro}
          </div>
        )}

        <div className="glass" style={{ borderRadius: 20, padding: 18, marginTop: 16, marginBottom: 24 }}>
          <div style={{ fontSize: 11.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 4 }}>TOTAL NOS PRÓXIMOS 6 MESES</div>
          <div className="voice" style={{ fontSize: 28, fontWeight: 500, color: totalGeralJanela > 0 ? '#C1694F' : ink }}>R$ {fmt(totalGeralJanela)}</div>
        </div>

        {contas.length === 0 && fixas.length === 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center' }}>
            <Receipt size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Cadastre uma conta na Carteira, ou uma conta fixa em Lançamentos, pra começar a ver a projeção aqui</div>
          </div>
        )}

        {/* Linha do tempo mês a mês */}
        <div style={{ position: 'relative', paddingLeft: 20 }}>
          {(contas.length > 0 || fixas.length > 0) && <div style={{ position: 'absolute', left: 5, top: 8, bottom: 8, width: 2, background: 'rgba(14,79,69,0.1)' }} />}
          {chavesMeses.map((mk) => {
            const contasDoMes = listaParaProjecao.map((c) => ({ conta: c, ...projecao[mk][c.id] })).filter((f) => f.total > 0.01);
            const totalMes = contasDoMes.reduce((s, f) => s + f.total, 0);
            if (contas.length === 0 && fixas.length === 0) return null;
            return (
              <div key={mk} style={{ position: 'relative', marginBottom: 24 }}>
                <div style={{ position: 'absolute', left: -20, top: 4, width: 12, height: 12, borderRadius: '50%', background: totalMes > 0 ? '#C1694F' : 'rgba(14,79,69,0.2)', border: '2px solid #F6F5F0' }} />
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, textTransform: 'capitalize' }}>
                  {nomeMes(mk)} {mk === mesAtual && <span style={{ fontSize: 10, color: primary, background: primaryTint, padding: '2px 8px', borderRadius: 8, marginLeft: 6 }}>ESSE MÊS</span>}
                </div>
                {contasDoMes.length === 0 ? (
                  <div style={{ fontSize: 12, color: muted, paddingBottom: 4 }}>Nada previsto</div>
                ) : (
                  <div className="glass" style={{ borderRadius: 16, padding: 14 }}>
                    {contasDoMes.map((f) => (
                      <div key={f.conta.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                          <div style={{ width: 8, height: 8, borderRadius: 2, background: f.conta.cor }} />
                          <span style={{ fontSize: 12.5 }}>{f.conta.nome}</span>
                          {f.conta.dia_venc && <span style={{ fontSize: 10.5, color: muted }}>· dia {f.conta.dia_venc}</span>}
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ fontSize: 13, fontWeight: 600 }}>R$ {fmt(f.total)}</span>
                          {mk === mesAtual && f.itensReais.length > 0 && (
                            <button onClick={() => pagarFatura(f.conta.id, f.itensReais)} style={{ background: primaryTint, color: primary, border: 'none', borderRadius: 8, padding: '4px 10px', fontSize: 10.5, fontWeight: 600, cursor: 'pointer' }}>
                              Pagar
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                    <div style={{ display: 'flex', justifyContent: 'space-between', paddingTop: 8, marginTop: 4, borderTop: '1px solid rgba(14,79,69,0.06)' }}>
                      <span style={{ fontSize: 11.5, color: muted, fontWeight: 600 }}>Total do mês</span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#C1694F' }}>R$ {fmt(totalMes)}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function MetaCasalResumo({ par }) {
  const percent = Math.min(100, (par.atual / (par.total || 1)) * 100);
  return (
    <div className="glass" style={{ borderRadius: 24, padding: 24, border: `1px solid ${gold}55`, background: 'rgba(201,164,106,0.06)' }}>
      <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 8 }}>
        <span style={{ fontSize: 14, fontWeight: 600 }}>{par.nome}</span>
        <span style={{ fontSize: 10, fontWeight: 700, color: gold, background: 'rgba(201,164,106,0.15)', padding: '2px 7px', borderRadius: 8 }}>CASAL</span>
      </div>
      <div style={{ fontSize: 11, color: muted, marginBottom: 14 }}>Soma automática — mesma meta em nomes diferentes</div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18, marginBottom: 16 }}>
        <div style={{ position: 'relative', width: 84, height: 84, flexShrink: 0 }}>
          <ProgressRing percent={percent} size={84} stroke={8} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700, color: ink }}>{percent.toFixed(0)}%</div>
        </div>
        <div style={{ fontSize: 12 }}>
          <div style={{ color: muted, marginBottom: 2 }}>Alcançado juntos</div>
          <div style={{ fontWeight: 600, marginBottom: 8, fontSize: 13.5 }}>R$ {fmt(par.atual)}</div>
          <div style={{ color: muted, marginBottom: 2 }}>Meta</div>
          <div style={{ fontWeight: 600, fontSize: 13.5 }}>R$ {fmt(par.total)}</div>
        </div>
      </div>
      <div style={{ paddingTop: 12, borderTop: '1px solid rgba(14,79,69,0.08)', display: 'flex', flexDirection: 'column', gap: 6 }}>
        {par.partes.map((p) => (
          <div key={p.id} style={{ display: 'flex', justifyContent: 'space-between', fontSize: 12 }}>
            <span style={{ color: muted }}>{p.nomeAutor || 'Alguém'}</span>
            <span>R$ {fmt(p.atual)} de R$ {fmt(p.total)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

function TelaMetas({ userId, householdId }) {
  const [metasReais, setMetasReais] = useState([]);
  const [contas, setContas] = useState([]);
  const [membros, setMembros] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', valorTotal: '', valorAtual: '', aporteMedio: '', accountId: '', taxaAnual: '', privada: false });
  const [salvando, setSalvando] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editTotal, setEditTotal] = useState('');
  const [editAtual, setEditAtual] = useState('');
  const [editAporte, setEditAporte] = useState('');
  const [editAccountId, setEditAccountId] = useState('');
  const [editTaxa, setEditTaxa] = useState('');
  const [editPrivada, setEditPrivada] = useState(false);
  const [historicoAbertoId, setHistoricoAbertoId] = useState(null);
  const [historicos, setHistoricos] = useState({});
  const [carregandoHistorico, setCarregandoHistorico] = useState(false);

  const abrirEdicao = (m) => {
    setEditandoId(m.id); setEditNome(m.nome); setEditTotal(String(m.total)); setEditAtual(String(m.atual));
    setEditAporte(String(m.aporteMedio)); setEditAccountId(m.accountId || ''); setEditTaxa(String(m.taxaAnual || 0));
    setEditPrivada(!!m.privada);
  };

  const salvarEdicao = async (id) => {
    if (!editNome || !editTotal) return;
    const metaAntes = metasReais.find((m) => m.id === id);
    const valorAntes = Number(metaAntes?.atual || 0);
    const novoAtual = Number(editAtual) || 0;
    const payload = {
      nome: editNome, valor_total: Number(editTotal), valor_atual: novoAtual, aporte_medio: Number(editAporte) || 0,
      account_id: editAccountId || null, taxa_anual: Number(editTaxa) || 0,
      data_referencia: new Date().toISOString().slice(0, 10), privada: editPrivada,
    };
    if (!metaAntes?.autorId) payload.autor_id = userId; // assume a dona/dono ao editar uma meta antiga sem dono
    const { data, error } = await window.db.from('metas').update(payload).eq('id', id).select();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra editar essa meta — ela não é sua.'); return; }
    const delta = novoAtual - valorAntes;
    if (Math.abs(delta) > 0.005) {
      await window.db.from('aportes_caixinha').insert([{
        household_id: householdId, meta_id: id, autor_id: userId,
        tipo: delta > 0 ? 'entrada' : 'retirada', valor: Math.abs(delta), data: new Date().toISOString().slice(0, 10),
      }]);
      setHistoricos((h) => { const cp = { ...h }; delete cp[id]; return cp; });
    }
    setEditandoId(null);
    buscar();
  };

  const apagar = async (id) => {
    if (!confirm('Apagar essa meta? Isso também apaga o histórico de aportes dela.')) return;
    const { data, error } = await window.db.from('metas').delete().eq('id', id).select();
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra apagar essa meta — ela não é sua.'); return; }
    buscar();
  };

  const toggleFavorita = async (m) => {
    const { data, error } = await window.db.from('metas').update({ favorita: !m.favorita }).eq('id', m.id).select();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra marcar essa meta.'); return; }
    buscar();
  };

  const buscar = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('metas').select('*').eq('household_id', householdId).order('created_at', { ascending: true }),
      window.db.from('accounts').select('id, nome, cor, dono').eq('household_id', householdId),
      window.db.from('profiles').select('id, nome, avatar_cor').eq('household_id', householdId),
    ]).then(([resMetas, resContas, resMembros]) => {
      const mapaAutores = {};
      (resMembros.data || []).forEach((m) => { mapaAutores[m.id] = m.nome; });
      setMetasReais((resMetas.data || []).map((m) => ({
        id: m.id, nome: m.nome, total: Number(m.valor_total), atual: Number(m.valor_atual), aporteMedio: Number(m.aporte_medio),
        accountId: m.account_id, taxaAnual: Number(m.taxa_anual || 0), dataReferencia: m.data_referencia,
        autorId: m.autor_id, favorita: !!m.favorita, privada: !!m.privada, nomeAutor: m.autor_id ? mapaAutores[m.autor_id] : null,
      })));
      setContas(resContas.data || []);
      setMembros(resMembros.data || []);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const buscarHistorico = (metaId) => {
    if (historicoAbertoId === metaId) { setHistoricoAbertoId(null); return; }
    setHistoricoAbertoId(metaId);
    if (historicos[metaId]) return;
    setCarregandoHistorico(true);
    window.db.from('aportes_caixinha').select('*').eq('meta_id', metaId).order('data', { ascending: false }).limit(10)
      .then(({ data, error }) => {
        if (error) { alert('Erro ao buscar histórico: ' + error.message); setCarregandoHistorico(false); return; }
        setHistoricos((h) => ({ ...h, [metaId]: data || [] }));
        setCarregandoHistorico(false);
      });
  };

  const salvar = async () => {
    if (!novo.nome || !novo.valorTotal) return;
    setSalvando(true);
    const { data, error } = await window.db.from('metas').insert([{
      household_id: householdId, autor_id: userId, nome: novo.nome, valor_total: Number(novo.valorTotal),
      valor_atual: Number(novo.valorAtual) || 0, aporte_medio: Number(novo.aporteMedio) || 0,
      account_id: novo.accountId || null, taxa_anual: Number(novo.taxaAnual) || 0,
      data_referencia: new Date().toISOString().slice(0, 10), privada: novo.privada,
    }]).select().single();
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    if (data && Number(novo.valorAtual) > 0) {
      await window.db.from('aportes_caixinha').insert([{
        household_id: householdId, meta_id: data.id, autor_id: userId, tipo: 'entrada',
        valor: Number(novo.valorAtual), data: new Date().toISOString().slice(0, 10),
      }]);
    }
    setNovo({ nome: '', valorTotal: '', valorAtual: '', aporteMedio: '', accountId: '', taxaAnual: '', privada: false });
    setMostrarForm(false);
    setSalvando(false);
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const { conjunta, paresCasal, pessoais } = agruparMetasCasal(metasReais, contas);
  const semDono = pessoais.filter((m) => !m.autorId);
  const temCasal = conjunta.length > 0 || paresCasal.length > 0;

  const renderCard = (m) => (
    <MetaCard key={m.id} m={m} contas={contas} userId={userId} editando={editandoId === m.id}
      editNome={editNome} setEditNome={setEditNome}
      editTotal={editTotal} setEditTotal={setEditTotal}
      editAtual={editAtual} setEditAtual={setEditAtual}
      editAporte={editAporte} setEditAporte={setEditAporte}
      editAccountId={editAccountId} setEditAccountId={setEditAccountId}
      editTaxa={editTaxa} setEditTaxa={setEditTaxa}
      editPrivada={editPrivada} setEditPrivada={setEditPrivada}
      onEditar={() => abrirEdicao(m)} onApagar={() => apagar(m.id)}
      onSalvar={() => salvarEdicao(m.id)} onCancelar={() => setEditandoId(null)}
      onToggleFavorita={() => toggleFavorita(m)}
      historicoAberto={historicoAbertoId === m.id} onVerHistorico={() => buscarHistorico(m.id)}
      historico={historicos[m.id]} carregandoHistorico={carregandoHistorico} />
  );

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <div>
            <div className="voice" style={{ fontSize: 22, fontWeight: 500 }}>Metas</div>
            <div style={{ fontSize: 12.5, color: muted, marginTop: 2 }}>Toda caixinha é uma meta — aqui é o lugar único pra tudo que você guarda</div>
          </div>
          <button onClick={() => setMostrarForm(!mostrarForm)} style={{ background: primary, color: '#fff', border: 'none', borderRadius: 20, padding: '9px 16px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
            + Nova meta
          </button>
        </div>

        {mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 18, marginTop: 16, marginBottom: 4 }}>
            <input value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} placeholder="Nome (ex: Viagem, Reserva de emergência...)"
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            <div style={{ fontSize: 10.5, color: muted, marginBottom: 10, lineHeight: 1.4 }}>Dica: se você e seu parceiro usarem o mesmo nome numa meta cada (ex: "Filhos"), o app soma as duas automaticamente como meta do casal.</div>
            <label style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 12, cursor: 'pointer' }}>
              <input type="checkbox" checked={novo.privada} onChange={(e) => setNovo({ ...novo, privada: e.target.checked })} style={{ width: 15, height: 15 }} />
              <span style={{ fontSize: 12, color: ink }}>Meta privada — só eu vejo, ninguém mais na household enxerga</span>
            </label>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor total (alvo)</label>
            <InputDinheiro value={novo.valorTotal} onChange={(v) => setNovo({ ...novo, valorTotal: v })} style={{ marginBottom: 8 }} />
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Já tem guardado (opcional)</label>
            <InputDinheiro value={novo.valorAtual} onChange={(v) => setNovo({ ...novo, valorAtual: v })} style={{ marginBottom: 8 }} />
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Aporte médio/mês (opcional, pra estimar prazo)</label>
            <InputDinheiro value={novo.aporteMedio} onChange={(v) => setNovo({ ...novo, aporteMedio: v })} style={{ marginBottom: 10 }} />
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 5 }}>Guardada numa conta? (opcional)</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: novo.accountId ? 8 : 12 }}>
              <button onClick={() => setNovo({ ...novo, accountId: '' })} style={{
                padding: '5px 11px', borderRadius: 12, border: `1px solid ${!novo.accountId ? primary : 'rgba(14,79,69,0.15)'}`,
                background: !novo.accountId ? primaryTint : '#fff', color: !novo.accountId ? primary : ink, fontSize: 11.5, fontWeight: 600, cursor: 'pointer',
              }}>Nenhuma</button>
              {contas.map((c) => (
                <button key={c.id} onClick={() => setNovo({ ...novo, accountId: c.id })} style={{
                  display: 'flex', alignItems: 'center', gap: 5, padding: '5px 11px', borderRadius: 12,
                  border: `1px solid ${novo.accountId === c.id ? primary : 'rgba(14,79,69,0.15)'}`,
                  background: novo.accountId === c.id ? primaryTint : '#fff', color: novo.accountId === c.id ? primary : ink, fontSize: 11.5, fontWeight: 600, cursor: 'pointer',
                }}>
                  <div style={{ width: 6, height: 6, borderRadius: '50%', background: c.cor || primary }} />{c.nome}
                </button>
              ))}
            </div>
            {novo.accountId && (
              <div style={{ fontSize: 10.5, color: muted, marginBottom: 10, lineHeight: 1.4 }}>O valor "já tem guardado" acima já deve estar incluído no saldo dessa conta — vincular aqui não soma nada a mais, é só uma etiqueta em cima do que já existe.</div>
            )}
            {novo.accountId && (
              <div style={{ marginBottom: 12 }}>
                <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Taxa ao ano (%) — deixe em branco se não souber</label>
                <input type="number" value={novo.taxaAnual} onChange={(e) => setNovo({ ...novo, taxaAnual: e.target.value })}
                  style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              </div>
            )}
            <button onClick={salvar} disabled={salvando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '10px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', opacity: salvando ? 0.6 : 1 }}>
              {salvando ? 'Salvando...' : 'Salvar meta'}
            </button>
          </div>
        )}

        {metasReais.length === 0 && !mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center', marginTop: 16 }}>
            <Target size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhuma meta ainda — toque em "+ Nova meta" pra começar</div>
          </div>
        )}

        {temCasal && (
          <div style={{ marginTop: 24 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: gold, letterSpacing: 0.4, marginBottom: 12 }}>💑 METAS DO CASAL</div>
            <div className="metas-grid">
              {conjunta.map(renderCard)}
              {paresCasal.map((par) => <MetaCasalResumo key={par.nome} par={par} />)}
            </div>
          </div>
        )}

        {membros.map((mb) => {
          const minhas = pessoais.filter((m) => m.autorId === mb.id);
          if (minhas.length === 0) return null;
          return (
            <div key={mb.id} style={{ marginTop: 24 }}>
              <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginBottom: 12 }}>
                <div style={{ width: 7, height: 7, borderRadius: '50%', background: mb.avatar_cor || primary }} />
                <span style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4 }}>METAS DE {(mb.nome || '').toUpperCase()}</span>
              </div>
              <div className="metas-grid">
                {minhas.map(renderCard)}
              </div>
            </div>
          );
        })}

        {semDono.length > 0 && (
          <div style={{ marginTop: 24 }}>
            <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 12 }}>OUTRAS METAS</div>
            <div className="metas-grid">
              {semDono.map(renderCard)}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

function TelaAjustes({ householdId, userId }) {
  const [membros, setMembros] = useState([]);
  const [metas, setMetas] = useState([]);
  const [contas, setContas] = useState([]);
  const [regras, setRegras] = useState({}); // { autorId: { metaId: percentual } }
  const [carregando, setCarregando] = useState(true);
  const [salvandoId, setSalvandoId] = useState(null);
  const [pessoaSimulada, setPessoaSimulada] = useState(null);
  const [valorSimulado, setValorSimulado] = useState('');
  const [codigoConvite, setCodigoConvite] = useState('');
  const [copiado, setCopiado] = useState(false);
  const [editandoPerfil, setEditandoPerfil] = useState(false);
  const [editNomePerfil, setEditNomePerfil] = useState('');
  const [editCorPerfil, setEditCorPerfil] = useState(primary);
  const [editRendaRegular, setEditRendaRegular] = useState(true);
  const [salvandoPerfil, setSalvandoPerfil] = useState(false);

  useEffect(() => {
    if (!householdId) return;
    window.db.from('households').select('codigo_convite').eq('id', householdId).maybeSingle()
      .then(({ data }) => setCodigoConvite(data?.codigo_convite || ''));
  }, [householdId]);

  const copiarCodigo = () => { navigator.clipboard?.writeText(codigoConvite || ''); setCopiado(true); setTimeout(() => setCopiado(false), 1800); };
  const linkWhatsConvite = `https://wa.me/?text=${encodeURIComponent(`Te chamei pro Raiz — nosso painel financeiro compartilhado. Entra com o código ${codigoConvite || ''} 🌱`)}`;

  const abrirEdicaoPerfil = () => {
    const eu = membros.find((m) => m.id === userId);
    setEditNomePerfil(eu?.nome || '');
    setEditCorPerfil(eu?.avatar_cor || primary);
    setEditRendaRegular(eu?.renda_regular !== false);
    setEditandoPerfil(true);
  };

  const salvarPerfil = async () => {
    if (!editNomePerfil.trim()) return;
    setSalvandoPerfil(true);
    const eu = membros.find((m) => m.id === userId);
    const nomeAntigo = eu?.nome || '';
    const nomeNovo = editNomePerfil.trim();
    // Se o nome mudou, atualiza primeiro o "dono" das contas que eram suas — precisa ser
    // antes de trocar o nome do perfil, senão a checagem de permissão trava (o app usa
    // comparação de texto pra saber quem é dono de cada conta)
    if (nomeAntigo && nomeAntigo !== nomeNovo) {
      const { error: erroContas } = await window.db.from('accounts').update({ dono: nomeNovo }).eq('household_id', householdId).eq('dono', nomeAntigo);
      if (erroContas) { alert('Erro ao atualizar suas contas: ' + erroContas.message); setSalvandoPerfil(false); return; }
    }
    const { data, error } = await window.db.from('profiles').update({ nome: nomeNovo, avatar_cor: editCorPerfil, renda_regular: editRendaRegular }).eq('id', userId).select();
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvandoPerfil(false); return; }
    if (!data || data.length === 0) { alert('Não foi possível salvar seu perfil.'); setSalvandoPerfil(false); return; }
    setEditandoPerfil(false);
    setSalvandoPerfil(false);
    buscar();
  };

  const buscar = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('profiles').select('id, nome, avatar_cor, renda_regular').eq('household_id', householdId),
      window.db.from('metas').select('id, nome, account_id, autor_id').eq('household_id', householdId).order('created_at', { ascending: true }),
      window.db.from('accounts').select('id, dono').eq('household_id', householdId),
      window.db.from('regras_alocacao').select('*').eq('household_id', householdId),
    ]).then(([resMembros, resMetas, resContas, resRegras]) => {
      const mapa = {};
      (resRegras.data || []).forEach((r) => {
        mapa[r.autor_id] = mapa[r.autor_id] || {};
        mapa[r.autor_id][r.meta_id] = r.percentual;
      });
      setMembros(resMembros.data || []);
      setMetas(resMetas.data || []);
      setContas(resContas.data || []);
      setRegras(mapa);
      const regularesIniciais = (resMembros.data || []).filter((m) => m.renda_regular !== false);
      if (regularesIniciais.length > 0) setPessoaSimulada((prev) => prev || regularesIniciais[0].id);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const atualizarPercentual = (autorId, metaId, valor) => {
    setRegras((prev) => ({
      ...prev,
      [autorId]: { ...(prev[autorId] || {}), [metaId]: valor === '' ? '' : Number(valor) },
    }));
  };

  const salvarPessoa = async (autorId) => {
    setSalvandoId(autorId);
    const minhasRegras = regras[autorId] || {};
    await window.db.from('regras_alocacao').delete().eq('autor_id', autorId);
    const linhas = Object.entries(minhasRegras)
      .filter(([, perc]) => Number(perc) > 0)
      .map(([metaId, perc]) => ({ household_id: householdId, autor_id: autorId, meta_id: metaId, percentual: Number(perc) }));
    if (linhas.length > 0) {
      const { error } = await window.db.from('regras_alocacao').insert(linhas);
      if (error) { alert('Erro ao salvar: ' + error.message); setSalvandoId(null); return; }
    }
    setSalvandoId(null);
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const f = membros.find((m) => m.id === pessoaSimulada);
  const regrasDoF = (f && regras[f.id]) || {};
  const valorNum = Number(valorSimulado) || 0;
  const alocacoes = metas
    .map((mt) => ({ meta: mt, percentual: Number(regrasDoF[mt.id]) || 0 }))
    .filter((a) => a.percentual > 0);
  const somaPercentualF = alocacoes.reduce((s, a) => s + a.percentual, 0);
  const totalAlocado = valorNum * (somaPercentualF / 100);
  const sobra = Math.max(0, valorNum - totalAlocado);

  return (
    <div className="content-grid">

            <InputDinheiro value={valorSimulado} onChange={setValorSimulado} placeholder="Ex: 3.500,00" style={{ marginBottom: 16 }} />

    </div>
  );

// Tenta ler um CSV de fatura de banco (formatos variam bastante entre bancos —
// isso é uma melhor tentativa, sempre mostrando prévia antes de confirmar)
function splitCSVLinha(linha, delimitador) {
  const resultado = [];
  let atual = '';
  let dentroAspas = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (ch === '"') dentroAspas = !dentroAspas;
    else if (ch === delimitador && !dentroAspas) { resultado.push(atual); atual = ''; }
    else atual += ch;
  }
  resultado.push(atual);
  return resultado.map((s) => s.trim().replace(/^"|"$/g, ''));
}

function parseCSVFatura(texto) {
  const semBOM = texto.replace(/^\uFEFF/, '');
  const linhas = semBOM.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
  if (linhas.length < 2) return [];

  const totalPontoVirgula = linhas.reduce((s, l) => s + (l.match(/;/g) || []).length, 0);
  const totalVirgula = linhas.reduce((s, l) => s + (l.match(/,/g) || []).length, 0);
  const delimitador = totalPontoVirgula > totalVirgula ? ';' : ',';

  // Procura a linha de cabeçalho de verdade (tem "data" E "valor" juntos) — bancos costumam
  // colocar várias linhas de informação da conta antes da tabela de lançamentos
  let headerIdx = -1, idxData = -1, idxValor = -1, idxDesc = -1, idxParcela = -1;
  for (let i = 0; i < linhas.length; i++) {
    const cols = splitCSVLinha(linhas[i], delimitador).map((c) => c.trim().toLowerCase());
    const dIdx = cols.findIndex((c) => c.includes('data') || c.includes('date'));
    const vIdx = cols.findIndex((c) => c.includes('valor') || c.includes('amount') || c.includes('value'));
    if (dIdx !== -1 && vIdx !== -1) {
      headerIdx = i; idxData = dIdx; idxValor = vIdx;
      idxDesc = cols.findIndex((c) => c.includes('descri') || c.includes('histor') || c.includes('estabelec') || c.includes('title') || c.includes('category'));
      idxParcela = cols.findIndex((c) => c.includes('parcela') || c.includes('installment'));
      break;
    }
  }
  if (headerIdx === -1) return [];

  const parseValor = (v) => {
    let s = (v || '').replace('R$', '').replace(/\s+/g, '').trim(); // remove todo espaço (ex: "- 472,87" vira "-472,87")
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
    return parseFloat(s) || 0;
  };
  const parseData = (v) => {
    const s = (v || '').trim();
    const br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (br) return `${br[3]}-${br[2]}-${br[1]}`;
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return s.slice(0, 10);
    return new Date().toISOString().slice(0, 10);
  };
  const parseParcela = (v) => {
    const s = (v || '').trim();
    const m = s.match(/(\d+)\s*\/\s*(\d+)/); // pega "02/03" mesmo com parênteses em volta
    if (!m) return { atual: null, total: null };
    return { atual: parseInt(m[1], 10), total: parseInt(m[2], 10) };
  };
  // Alguns bancos (Nubank, por ex.) não têm coluna de parcela — vem escrito dentro da própria descrição,
  // tipo "Loja X - Parcela 3/4". Isso procura esse padrão no texto e já limpa o nome do item.
  const extrairParcelaDoTexto = (texto) => {
    const t = texto || '';
    let m = t.match(/parcela\s*(\d+)\s*\/\s*(\d+)/i);
    if (!m) m = t.match(/\((\d+)\s*\/\s*(\d+)\)/);
    if (!m) return null;
    return { atual: parseInt(m[1], 10), total: parseInt(m[2], 10), textoCompleto: m[0] };
  };

  return linhas.slice(headerIdx + 1).map((linha) => {
    const cols = splitCSVLinha(linha, delimitador);
    if (cols.length <= idxValor) return null;
    const valorBruto = parseValor(cols[idxValor]);
    let descricaoFinal = idxDesc >= 0 ? (cols[idxDesc] || 'Lançamento importado').trim() : 'Lançamento importado';
    let parcela = idxParcela >= 0 ? parseParcela(cols[idxParcela]) : { atual: null, total: null };
    if (parcela.atual === null) {
      const achado = extrairParcelaDoTexto(descricaoFinal);
      if (achado) {
        parcela = { atual: achado.atual, total: achado.total };
        descricaoFinal = descricaoFinal.replace(achado.textoCompleto, '').replace(/[-–]\s*$/, '').trim();
      }
    }
    return {
      data: idxData >= 0 ? parseData(cols[idxData]) : new Date().toISOString().slice(0, 10),
      descricao: descricaoFinal,
      valor: Math.abs(valorBruto),
      tipo: valorBruto < 0 ? 'entrada' : 'saida', // fatura de cartão: maioria é despesa; negativo costuma ser estorno/pagamento
      parcelaAtual: parcela.atual,
      parcelaTotal: parcela.total,
      incluir: true,
    };
  }).filter((r) => r && r.valor > 0);
}

function TelaCarteira({ userId, householdId, meuNome }) {
  const [contasReais, setContasReais] = useState([]);
  const [metasContas, setMetasContas] = useState([]); // metas vinculadas a alguma conta (antigas "caixinhas")
  const [parcelas, setParcelas] = useState([]);
  const [itensFatura, setItensFatura] = useState([]);
  const [membros, setMembros] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [ativo, setAtivo] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', cor: '#3E72B8', dono: 'Conjunta', saldo: '', diaVenc: '', limite: '' });
  const [salvando, setSalvando] = useState(false);

  const [itensVisiveis, setItensVisiveis] = useState(true);
  const [recorrencias, setRecorrencias] = useState([]);
  const [mostrarFormRecorrencia, setMostrarFormRecorrencia] = useState(false);
  const [novaRecorrencia, setNovaRecorrencia] = useState({ descricao: '', valor: '' });

  const [arquivoNome, setArquivoNome] = useState('');
  const [previewCSV, setPreviewCSV] = useState([]);
  const [importando, setImportando] = useState(false);
  const [erroImport, setErroImport] = useState('');

  const buscarTudo = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('accounts').select('*').eq('household_id', householdId),
      window.db.from('metas').select('*').eq('household_id', householdId).not('account_id', 'is', null),
      window.db.from('compras_parceladas').select('*').eq('household_id', householdId),
      window.db.from('fatura_itens').select('*').eq('household_id', householdId),
      window.db.from('recorrencias').select('*').eq('household_id', householdId),
      window.db.from('profiles').select('id, nome, avatar_cor').eq('household_id', householdId),
    ]).then(([resContas, resMetas, resParcelas, resItens, resRecorrencias, resMembros]) => {
      const erros = [resContas, resMetas, resParcelas, resItens, resRecorrencias].map((r) => r.error).filter(Boolean);
      if (erros.length > 0) { alert('Erro ao carregar dados: ' + erros[0].message + '\n\nConfirma se todos os SQLs de atualização foram rodados no Supabase.'); }
      setContasReais(resContas.data || []);
      setMetasContas(resMetas.data || []);
      setParcelas(resParcelas.data || []);
      setItensFatura(resItens.data || []);
      setRecorrencias(resRecorrencias.data || []);
      setMembros(resMembros.data || []);
      if (resContas.data && resContas.data.length > 0) setAtivo((prev) => prev || resContas.data[0].id);
      setCarregando(false);
    });
  };

  useEffect(() => { buscarTudo(); }, [householdId]);

  const salvar = async () => {
    if (!novo.nome || !novo.saldo) return;
    triggerHaptic();
    setSalvando(true);
    const { error } = await window.db.from('accounts').insert([{
      household_id: householdId, nome: novo.nome, cor: novo.cor, dono: novo.dono,
      saldo: Number(novo.saldo) || 0, fatura: 0, dia_venc: Number(novo.diaVenc) || null, limite: Number(novo.limite) || 0,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    setNovo({ nome: '', cor: '#3E72B8', dono: 'Conjunta', saldo: '', diaVenc: '', limite: '' });
    setMostrarForm(false);
    setSalvando(false);
    buscarTudo();
  };

  const calcularParcelas = (compra) => {
    const hoje = new Date();
    const inicio = new Date(compra.data_primeira_parcela + 'T00:00:00');
    let mesesPassados = (hoje.getFullYear() - inicio.getFullYear()) * 12 + (hoje.getMonth() - inicio.getMonth()) + 1;
    mesesPassados = Math.max(0, Math.min(compra.num_parcelas, mesesPassados));
    const valorParcela = compra.valor_total / compra.num_parcelas;
    return { mesesPassados, valorParcela, pago: mesesPassados * valorParcela, falta: compra.valor_total - mesesPassados * valorParcela };
  };

  const handleArquivoCSV = (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    setArquivoNome(arquivo.name);
    setErroImport('');
    const leitor = new FileReader();
    leitor.onload = (ev) => {
      const linhasBrutas = parseCSVFatura(ev.target.result);
      if (linhasBrutas.length === 0) setErroImport('Não consegui reconhecer o formato desse arquivo. Confirma se é um CSV com colunas de data, descrição e valor.');
      const normalizar = (s) => (s || '').toLowerCase().trim().replace(/[^a-z0-9]/g, '');
      const linhas = linhasBrutas.map((l) => {
        const provavelDuplicata = itensFatura.some((i) =>
          i.account_id === ativo &&
          normalizar(i.descricao) === normalizar(l.descricao) &&
          Math.abs(Number(i.valor) - Number(l.valor)) < 0.5
        );
        return { ...l, incluir: l.incluir && !provavelDuplicata, provavelDuplicata };
      });
      setPreviewCSV(linhas);
    };
    leitor.readAsText(arquivo, 'utf-8');
  };

  const confirmarImportacao = async () => {
    if (!ativo) return;
    setImportando(true);
    const linhasParaImportar = previewCSV.filter((l) => l.incluir && l.tipo === 'saida').map((l) => ({
      household_id: householdId, account_id: ativo, descricao: l.descricao, valor: l.valor, categoria: 'Importado', data: l.data,
      parcela_atual: l.parcelaAtual, parcela_total: l.parcelaTotal,
    }));
    const { error } = await window.db.from('fatura_itens').insert(linhasParaImportar);
    setImportando(false);
    if (error) { alert('Erro ao importar: ' + error.message); return; }
    setPreviewCSV([]);
    setArquivoNome('');
    buscarTudo();
    alert(`${linhasParaImportar.length} item(ns) adicionado(s) à fatura!`);
  };

  const apagarItemFatura = async (id) => {
    const { data, error } = await window.db.from('fatura_itens').delete().eq('id', id).select();
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra apagar esse item — o cartão não é seu.'); return; }
    buscarTudo();
  };

  const salvarRecorrencia = async () => {
    if (!novaRecorrencia.descricao || !novaRecorrencia.valor || !ativo) return;
    const { error } = await window.db.from('recorrencias').insert([{
      household_id: householdId, account_id: ativo, descricao: novaRecorrencia.descricao,
      valor: Number(novaRecorrencia.valor), dia_cobranca: null, ativo: true,

    if (error) { alert('Erro ao salvar: ' + error.message); return; }

    setMostrarFormRecorrencia(false);
    buscarTudo();
  };

  const apagarRecorrencia = async (id) => {
    const { data, error } = await window.db.from('recorrencias').delete().eq('id', id).select();
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra apagar essa recorrência — o cartão não é seu.'); return; }
    buscarTudo();
  };

  const pagarFatura = async (contaId, itensDaConta) => {
    const total = itensDaConta.reduce((s, i) => s + Number(i.valor), 0);
    if (total <= 0) return;
    const conta = contasReais.find((c) => c.id === contaId);
    if (!confirm(`Confirmar pagamento de R$ ${fmt(total)} da fatura ${conta?.nome}? Isso cria um lançamento de saída e limpa os itens dessa fatura.`)) return;
    triggerHaptic();
    const { error: erroTx } = await window.db.from('transactions').insert([{
      household_id: householdId, autor_id: userId, tipo: 'saida', descricao: `Pagamento fatura ${conta?.nome || ''}`,
      valor: total, categoria: 'Fatura', grupo: 'Fixa', visivel: true, data: new Date().toISOString().slice(0, 10), conta: contaId,

    if (erroTx) { alert('Erro ao registrar pagamento: ' + erroTx.message); return; }
    const idsParaApagar = itensDaConta.map((i) => i.id);
    await window.db.from('fatura_itens').delete().in('id', idsParaApagar);
    buscarTudo();

  const apagarConta = async (id) => {

      : 'Apagar essa conta? Isso também apaga a fatura, parcelas e recorrências ligadas a ela.';
    if (!confirm(aviso)) return;
    if (metasVinculadas.length > 0) {
      const { error: erroMetas } = await window.db.from('metas').delete().in('id', metasVinculadas.map((m) => m.id));

    }
    const { data, error } = await window.db.from('accounts').delete().eq('id', id).select();
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra apagar essa conta — ela não é sua.'); return; }
    if (ativo === id) setAtivo(null);
    buscarTudo();

  const apagarParcela = async (id) => {

    buscarTudo();

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const contaAtiva = contasReais.find((c) => c.id === ativo);
  const itensDaContaAtiva = itensFatura.filter((i) => i.account_id === (contaAtiva && contaAtiva.id));
  const totalFaturaContaAtiva = itensDaContaAtiva.reduce((s, i) => s + Number(i.valor), 0);
  const souOdonoDaContaAtiva = !!contaAtiva && (contaAtiva.dono === 'Conjunta' || contaAtiva.dono === meuNome);
  const faturaEscondidaPorPrivacidade = !!contaAtiva && contaAtiva.dono !== 'Conjunta' && !souOdonoDaContaAtiva && !!contaAtiva.fatura_privada;

    const { data, error } = await window.db.from('accounts').update({ fatura_privada: !conta.fatura_privada }).eq('id', conta.id).select();
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    if (!data || data.length === 0) { alert('Você não tem permissão pra mudar isso — a conta não é sua.'); return; }
    buscarTudo();
  };
  let dataVencimentoFormatada = '';
  let mesFaturaAtualContaAtiva = null;
  if (contaAtiva && contaAtiva.dia_venc) {
    mesFaturaAtualContaAtiva = mesDoProximoVencimento(contaAtiva.dia_venc, new Date());
    const [anoV, mesV] = mesFaturaAtualContaAtiva.split('-').map(Number);
    const dataV = new Date(anoV, mesV - 1, contaAtiva.dia_venc);
    dataVencimentoFormatada = dataV.toLocaleDateString('pt-BR');
  }

  const marcarRecorrenciaCoberta = async (r, coberta) => {

  const totais = contasReais.reduce((acc, c) => { acc.saldo += Number(c.saldo || 0); return acc; }, { saldo: 0 });
  totais.fatura = itensFatura.reduce((s, i) => s + Number(i.valor || 0), 0);
  const cores = [lucas, marina, primary, gold, '#3E72B8', '#820AD1', '#EC7000', '#21C25E', '#C1694F', '#5B7FDB', '#D4526E', '#1C1C1C', '#00AAFF', '#8B6F47'];

  return (

      <div className="col-main">

        {mostrarForm && (

            <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap', marginBottom: 10 }}>
              {cores.map((c) => (
                <button key={c} onClick={() => setNovo({ ...novo, cor: c })} style={{ width: 28, height: 28, borderRadius: '50%', background: c, border: novo.cor === c ? '2px solid #fff' : 'none', boxShadow: novo.cor === c ? `0 0 0 2px ${c}` : 'none', cursor: 'pointer', flexShrink: 0 }} />
              ))}
            </div>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 5 }}>Dono da conta</label>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 6, marginBottom: 14 }}>
              <button onClick={() => setNovo({ ...novo, dono: 'Conjunta' })} style={{

              }}>Conjunta</button>
              {membros.filter((m) => m.id === userId).map((m) => (
                <button key={m.id} onClick={() => setNovo({ ...novo, dono: m.nome })} style={{
                  display: 'flex', alignItems: 'center', gap: 6, padding: '6px 13px', borderRadius: 14,

                  <div style={{ width: 6, height: 6, borderRadius: '50%', background: m.avatar_cor || primary }} />{m.nome}

            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Limite (se for cartão)</label>

            <input type="number" value={novo.diaVenc} onChange={(e) => setNovo({ ...novo, diaVenc: e.target.value })} placeholder="Ex: 15"

            <div style={{ fontSize: 11.5, color: muted, lineHeight: 1.4, marginBottom: 14 }}>A fatura não é digitada aqui — ela nasce dos itens/CSV que você lançar depois de criar a conta. Pra vincular uma meta/reserva a essa conta, faça isso depois na aba Metas.</div>

            <button onClick={salvar} disabled={salvando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', opacity: salvando ? 0.6 : 1 }}>
              {salvando ? 'Salvando...' : 'Salvar conta'}
            </button>
          </div>
        )}

        {contasReais.length === 0 && !mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center', marginTop: 16 }}>
            <WalletIcon size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhuma conta cadastrada ainda</div>
          </div>
        )}

        {contasReais.length > 0 && (
          <>
            <div className="stat-grid-2" style={{ marginTop: 16, marginBottom: 4 }}>
              <div className="glass" style={{ borderRadius: 20, padding: 18, minWidth: 0 }}>
                <div style={{ fontSize: 11.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 4 }}>SALDO TOTAL</div>
                <div className="voice" style={{ fontSize: 'clamp(20px, 7vw, 24px)', fontWeight: 500 }}>R$ {fmt(totais.saldo)}</div>
              </div>
              <div className="glass" style={{ borderRadius: 20, padding: 18, minWidth: 0 }}>
                <div style={{ fontSize: 11.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 4 }}>FATURAS EM ABERTO</div>
                <div className="voice" style={{ fontSize: 'clamp(20px, 7vw, 24px)', fontWeight: 500 }}>R$ {fmt(totais.fatura)}</div>
              </div>
            </div>

            <div className="card-stack">
              {contasReais.map((c, i) => {
                const isAtivo = c.id === ativo;
                return (
                  <div key={c.id} className="bank-card" onClick={() => { triggerHaptic(); setAtivo(c.id); }} style={{
                    background: `linear-gradient(135deg, ${c.cor}, ${c.cor}CC)`, color: '#fff',
                    marginLeft: i === 0 ? 0 : -22, zIndex: isAtivo ? 20 : i,

                    <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
                      <span style={{ fontSize: 14, fontWeight: 700 }}>{c.nome}</span>

            {contaAtiva && (

                  <div style={{ width: 10, height: 10, borderRadius: 3, background: contaAtiva.cor }} />
                  <span style={{ fontSize: 14, fontWeight: 600 }}>{contaAtiva.nome}</span>
                  <span style={{ fontSize: 11, color: primary, fontWeight: 600, background: 'rgba(0,0,0,0.04)', padding: '2px 9px', borderRadius: 10 }}>{contaAtiva.dono}</span>
                  {souOdonoDaContaAtiva && (
                    <button onClick={() => apagarConta(contaAtiva.id)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', marginLeft: 'auto' }} title="Apagar conta">
                      <Trash2 size={15} color="#C1694F" />
                    </button>

                  <div>
                    <div style={{ fontSize: 11, color: muted, marginBottom: 3 }}>Saldo</div>
                    <div style={{ fontSize: 15, fontWeight: 600 }}>R$ {fmt(contaAtiva.saldo)}</div>
                    {metasContas.filter((m) => m.account_id === contaAtiva.id).length > 0 && (

                      </div>

                  </div>

                <div style={{ borderTop: '1px solid rgba(14,79,69,0.08)', paddingTop: 16, marginTop: 16, marginBottom: 16 }}>
                  <div style={{ marginBottom: 6 }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.3 }}>METAS GUARDADAS NESSA CONTA</span>
                  </div>
                  <div style={{ fontSize: 11, color: muted, marginBottom: 10, lineHeight: 1.4 }}>Pra criar, editar ou vincular uma meta a essa conta, use a aba Metas.</div>
                  {metasContas.filter((m) => m.account_id === contaAtiva.id).length === 0

                    : (
                      <div style={{ display: 'flex', flexWrap: 'wrap', gap: 8 }}>
                        {metasContas.filter((m) => m.account_id === contaAtiva.id).map((m) => (

                <div style={{ borderTop: '1px solid rgba(14,79,69,0.08)', paddingTop: 16, marginBottom: 16 }}>

                    <span style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.3 }}>PARCELAS EM ANDAMENTO</span>

                  {parcelas.filter((p) => p.account_id === contaAtiva.id).length === 0

                </div>

                {/* Recorrências fixas — cobrança automática todo mês, não entra no limite. Fica aqui mesmo, é configuração da conta */}
                <div style={{ borderTop: '1px solid rgba(14,79,69,0.08)', paddingTop: 16 }}>
                  <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                    <span style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.3 }}>FIXAS TODO MÊS (assinaturas, débitos automáticos)</span>
                    {souOdonoDaContaAtiva && (
                      <button onClick={() => setMostrarFormRecorrencia(!mostrarFormRecorrencia)} style={{ background: 'transparent', border: 'none', color: primary, fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>+ Adicionar</button>

                  ) : (
