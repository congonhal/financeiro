                          }}>
                            {coberta ? <Check size={11} /> : <div style={{ width: 11, height: 11, borderRadius: 3, border: `1.5px solid ${muted}` }} />}
                            {coberta ? 'Já veio na fatura desse mês' : 'Marcar como já veio na fatura desse mês'}
                          </button>
                        )}
                      </div>
                      );
                    })
                  )}
                </div>
              </div>

              {/* FATURA — card separado de propósito, pra não misturar com informação da conta em si */}
              <div className="glass" style={{ borderRadius: 22, padding: 22, marginTop: 16, border: '1px solid rgba(193,105,79,0.28)', background: 'rgba(193,105,79,0.05)' }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', flexWrap: 'wrap', gap: 10, marginBottom: 16 }}>
                  <div>
                    <div style={{ fontSize: 12, fontWeight: 600, color: '#C1694F', letterSpacing: 0.3, marginBottom: 6 }}>FATURA · {contaAtiva.nome}</div>
                    <div style={{ fontSize: 13.5, fontWeight: 700, color: '#C1694F' }}>
                      {contaAtiva.dia_venc ? `VENCIMENTO: ${dataVencimentoFormatada}` : 'Sem dia de vencimento cadastrado nessa conta'}
                    </div>
                  </div>
                  <div style={{ textAlign: 'right' }}>
                    <div style={{ fontSize: 11, color: muted, marginBottom: 2 }}>Total em aberto</div>
                    <div className="voice" style={{ fontSize: 22, fontWeight: 500, color: '#C1694F' }}>R$ {fmt(totalFaturaContaAtiva)}</div>
                  </div>
                </div>

                {contaAtiva.dono !== 'Conjunta' && souOdonoDaContaAtiva && (
                  <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'rgba(255,255,255,0.5)', borderRadius: 10, padding: '8px 12px', marginBottom: 14 }}>
                    <span style={{ fontSize: 11.5, color: ink, display: 'flex', alignItems: 'center', gap: 6 }}>
                      <Lock size={11} color={muted} /> Parceiro(a) vê os itens dessa fatura?
                    </span>
                    <button onClick={() => alternarPrivacidadeFatura(contaAtiva)} style={{
                      background: contaAtiva.fatura_privada ? 'rgba(193,105,79,0.12)' : primaryTint,
                      color: contaAtiva.fatura_privada ? '#C1694F' : primary,
                      border: 'none', borderRadius: 8, padding: '5px 11px', fontSize: 11, fontWeight: 600, cursor: 'pointer',
                    }}>{contaAtiva.fatura_privada ? 'Só o total' : 'Sim, tudo'}</button>
                  </div>
                )}
                {contaAtiva.dono !== 'Conjunta' && !souOdonoDaContaAtiva && contaAtiva.fatura_privada && (
                  <div style={{ fontSize: 11, color: muted, display: 'flex', alignItems: 'center', gap: 6, marginBottom: 14 }}>
                    <Lock size={11} /> {contaAtiva.dono} deixou os itens dessa fatura privados — você vê só o total.
                  </div>
                )}

                {itensDaContaAtiva.length > 0 && souOdonoDaContaAtiva && (
                  <button onClick={() => pagarFatura(contaAtiva.id, itensDaContaAtiva)}
                    style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', marginBottom: 16 }}>
                    Marcar fatura como paga
                  </button>
                )}

                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <span style={{ fontSize: 11.5, color: muted, fontWeight: 600 }}>{itensDaContaAtiva.length} ITEM(NS) NESSA FATURA</span>
                  {itensDaContaAtiva.length > 0 && !faturaEscondidaPorPrivacidade && (
                    <button onClick={() => setItensVisiveis(!itensVisiveis)} style={{ background: 'transparent', border: 'none', color: muted, cursor: 'pointer', display: 'flex' }} title={itensVisiveis ? 'Esconder itens' : 'Mostrar itens'}>
                      {itensVisiveis ? <EyeOff size={14} /> : <Eye size={14} />}
                    </button>
                  )}
                </div>

                {faturaEscondidaPorPrivacidade ? (
                  <div style={{ fontSize: 12, color: muted, marginBottom: 12, fontStyle: 'italic' }}>Itens privados — só {contaAtiva.dono} vê o detalhe.</div>
                ) : itensDaContaAtiva.length === 0 ? (
                  <div style={{ fontSize: 12, color: muted, marginBottom: 12 }}>Nenhum item lançado ainda nessa fatura</div>
                ) : !itensVisiveis ? (
                  <div style={{ fontSize: 12, color: muted, marginBottom: 12, fontStyle: 'italic' }}>
                    Itens ocultos — toque no olho pra conferir antes de pagar
                  </div>
                ) : (
                  <div style={{ marginBottom: 4 }}>
                    {itensDaContaAtiva.map((item) => (
                      <div key={item.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '7px 0', borderBottom: '1px solid rgba(193,105,79,0.1)' }}>
                        <span style={{ fontSize: 12.5 }}>
                          {item.descricao}
                          {item.parcela_atual && (
                            <span style={{ marginLeft: 6, fontSize: 9.5, background: 'rgba(139,111,71,0.15)', color: '#8B6F47', padding: '1px 6px', borderRadius: 8, fontWeight: 600 }}>
                              {item.parcela_atual}/{item.parcela_total}
                              {item.parcela_atual < item.parcela_total ? ` · +${item.parcela_total - item.parcela_atual} depois` : ' · última'}
                            </span>
                          )}
                        </span>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
                          <span style={{ fontSize: 12.5, fontWeight: 600 }}>R$ {fmt(item.valor)}</span>
                          {souOdonoDaContaAtiva && (
                          <button onClick={() => apagarItemFatura(item.id)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex', padding: 0 }}>
                            <Trash2 size={12} color="#C1694F" />
                          </button>
                          )}
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ fontSize: 11, color: muted, margin: '14px 0 12px', lineHeight: 1.4, borderTop: '1px solid rgba(193,105,79,0.15)', paddingTop: 12 }}>
                  Pra lançar um gasto novo nesse cartão, use a aba Lançamentos → Cartão de crédito. Aqui você só importa o extrato ou revisa/paga a fatura.
                </div>

                {souOdonoDaContaAtiva && (
                <>
                <label style={{ display: 'inline-flex', alignItems: 'center', gap: 6, background: 'rgba(14,79,69,0.06)', borderRadius: 10, padding: '8px 14px', fontSize: 12, fontWeight: 600, color: primary, cursor: 'pointer' }}>
                  <Copy size={13} /> {arquivoNome || 'Importar CSV da fatura'}
                  <input type="file" accept=".csv" onChange={handleArquivoCSV} style={{ display: 'none' }} />
                </label>
                {erroImport && <div style={{ fontSize: 12, color: '#C1694F', marginTop: 8 }}>{erroImport}</div>}
                {previewCSV.length > 0 && (
                  <div style={{ marginTop: 12 }}>
                    <div style={{ fontSize: 11.5, color: muted, marginBottom: 8 }}>{previewCSV.length} item(ns) encontrado(s) — confira antes de importar:</div>
                    {previewCSV.some((l) => l.provavelDuplicata) && (
                      <div style={{ fontSize: 11, color: '#C1694F', marginBottom: 8, display: 'flex', alignItems: 'center', gap: 5 }}>
                        <AlertCircle size={12} style={{ flexShrink: 0 }} />
                        {previewCSV.filter((l) => l.provavelDuplicata).length} item(ns) parecem já estar na fatura em aberto — vieram desmarcados, mas confira antes de importar.
                      </div>
                    )}
                    <div style={{ maxHeight: 200, overflowY: 'auto', marginBottom: 10 }}>
                      {previewCSV.map((linha, i) => (
                        <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '6px 0', borderBottom: '1px solid rgba(14,79,69,0.05)' }}>
                          <input type="checkbox" checked={linha.incluir} onChange={(e) => setPreviewCSV((prev) => prev.map((l, idx) => idx === i ? { ...l, incluir: e.target.checked } : l))} />
                          <span style={{ fontSize: 11.5, flex: 1 }}>
                            {linha.descricao}
                            {linha.parcelaAtual && <span style={{ marginLeft: 6, fontSize: 9.5, background: 'rgba(139,111,71,0.15)', color: '#8B6F47', padding: '1px 6px', borderRadius: 8, fontWeight: 600 }}>{linha.parcelaAtual}/{linha.parcelaTotal}</span>}
                            {linha.provavelDuplicata && <span style={{ marginLeft: 6, fontSize: 9.5, background: 'rgba(193,105,79,0.15)', color: '#C1694F', padding: '1px 6px', borderRadius: 8, fontWeight: 600 }}>já na fatura?</span>}
                          </span>
                          <span onClick={() => setPreviewCSV((prev) => prev.map((l, idx) => idx === i ? { ...l, tipo: l.tipo === 'saida' ? 'entrada' : 'saida' } : l))}
                            title="Clique pra corrigir se estiver errado" style={{ fontSize: 11.5, color: tipoCor[linha.tipo], cursor: 'pointer', textDecoration: 'underline dotted' }}>
                            {tipoSinal[linha.tipo]} R$ {fmt(linha.valor)}
                          </span>
                        </div>
                      ))}
                    </div>
                    <div style={{ fontSize: 10.5, color: muted, marginBottom: 8 }}>Só as linhas marcadas como saída entram na fatura — entradas/estornos ficam de fora dessa importação.</div>
                    <button onClick={confirmarImportacao} disabled={importando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '10px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', opacity: importando ? 0.6 : 1 }}>
                      {importando ? 'Importando...' : `Adicionar ${previewCSV.filter((l) => l.incluir && l.tipo === 'saida').length} item(ns) à fatura`}
                    </button>
                  </div>
                )}
                </>
                )}
              </div>
              </>
            )}
          </>
        )}

      </div>
    </div>
  );
}



function AppPrincipal({ userId, householdId }) {
  const [nav, setNav] = useState('painel');
  const [transacoes, setTransacoes] = useState([]);
  const [carregandoTx, setCarregandoTx] = useState(true);
  const [meuPerfil, setMeuPerfil] = useState(null);
  const [abrirLancamentoAuto, setAbrirLancamentoAuto] = useState(false);
  const [maisAberto, setMaisAberto] = useState(false);

  useEffect(() => {
    window.db.from('profiles').select('nome, avatar_cor, avatar_letra, renda_regular').eq('id', userId).maybeSingle().then(({ data }) => setMeuPerfil(data));
  }, [userId]);

  const sair = () => window.db.auth.signOut();

  const buscarTransacoes = () => {
    setCarregandoTx(true);
    window.db.from('transactions').select('*').eq('household_id', householdId)
      .order('data', { ascending: false }).order('created_at', { ascending: false })
      .then(({ data, error }) => {
        if (!error) setTransacoes(data || []);
        setCarregandoTx(false);
      });
  };

  useEffect(() => { buscarTransacoes(); }, [householdId]);

  const adicionarLancamento = async (dados) => {
    const { error } = await window.db.from('transactions').insert([{ ...dados, household_id: householdId, autor_id: userId }]);
    if (error) throw error;
    buscarTransacoes();
  };

  const editarLancamento = async (id, dados) => {
    const { data, error } = await window.db.from('transactions').update(dados).eq('id', id).select();
    if (error) throw error;
    if (!data || data.length === 0) throw new Error('Você não tem permissão pra editar esse lançamento — não foi você que lançou.');
    buscarTransacoes();
  };

  const apagarLancamento = async (id) => {
    const { data, error } = await window.db.from('transactions').delete().eq('id', id).select();
    if (error) throw error;
    if (!data || data.length === 0) throw new Error('Você não tem permissão pra apagar esse lançamento — não foi você que lançou.');
    buscarTransacoes();
  };

  const adicionarItemFatura = async (dados) => {
    const { error } = await window.db.from('fatura_itens').insert([{ ...dados, household_id: householdId }]);
    if (error) throw error;
  };

  const adicionarParcela = async (dados) => {
    const { error } = await window.db.from('compras_parceladas').insert([{ ...dados, household_id: householdId }]);
    if (error) throw error;
  };

  const saldoReal = transacoes.reduce((s, t) => s + (t.tipo === 'entrada' ? Number(t.valor) : t.tipo === 'saida' ? -Number(t.valor) : 0), 0);

  const abas = [
    { id: 'painel', label: 'Painel', icon: HomeIcon },
    { id: 'lancamentos', label: 'Lançamentos', icon: Receipt },
    { id: 'carteira', label: 'Carteira', icon: WalletIcon },
    { id: 'contasapagar', label: 'Contas a Pagar', icon: AlertCircle },
    { id: 'patrimonio', label: 'Patrimônio', icon: TrendingUp },
    { id: 'metas', label: 'Metas', icon: Target },
    { id: 'ajustes', label: 'Ajustes', icon: Settings },
  ];
  const idsPrincipaisMobile = ['painel', 'lancamentos', 'carteira', 'contasapagar'];
  const abasPrincipaisMobile = abas.filter((a) => idsPrincipaisMobile.includes(a.id));
  const abasMaisMobile = abas.filter((a) => !idsPrincipaisMobile.includes(a.id));
  const estaEmAbaMais = abasMaisMobile.some((a) => a.id === nav);

  return (
    <div className="app-shell" style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 720, color: ink }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
        * { box-sizing: border-box; }
        button, input, select, textarea, optgroup { font-family: inherit; }
        .voice { font-family: 'Fraunces', serif; }
        .hero-number { font-family: 'Fraunces', serif; font-size: clamp(28px, 8vw, 42px); font-weight: 500; line-height: 1; }
        .glass {
          background: rgba(255,255,255,0.66);
          backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
          border: 1px solid rgba(255,255,255,0.7);
          box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 1px 2px rgba(14,79,69,0.04), 0 20px 40px -16px rgba(14,79,69,0.16);
        }
        .hero-card {
          box-shadow: 0 20px 40px -15px rgba(14, 79, 69, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
          transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
          cursor: pointer;
        }
        .hero-card:active { transform: scale(0.98); }
        .main-area > div { animation: slideUpFade 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slideUpFade {
          from { opacity: 0; transform: translateY(12px); }
          to { opacity: 1; transform: translateY(0); }
        }
        .app-shell { display: flex; flex-direction: column; }
        .sidebar-desktop { display: none; }
        .bottomnav { display: flex; }
        .main-area { flex: 1; padding: 20px 18px 96px; max-width: 480px; margin: 0 auto; width: 100%; }
        .content-grid { display: flex; flex-direction: column; gap: 20px; }
        .row-2col { display: flex; flex-direction: column; gap: 20px; }
        .stat-grid-2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
        .only-desktop { display: none; }
        .patrimonio-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .metas-grid { display: grid; grid-template-columns: 1fr; gap: 16px; }
        .card-stack { display: flex; padding: 16px 24px 10px 4px; margin-top: 2px; overflow-x: auto; -webkit-overflow-scrolling: touch; scroll-padding-left: 4px; }
        .feed-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .feed-card { border-radius: 16px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; min-height: 108px; transition: transform 0.2s ease; }
        .feed-card:hover { transform: translateY(-3px); }
        .bank-card {
          width: 168px; height: 100px; border-radius: 16px; padding: 16px; cursor: pointer;
          display: flex; flex-direction: column; justify-content: space-between; flex-shrink: 0;
          transition: transform 0.25s cubic-bezier(.22,1,.36,1), box-shadow 0.25s ease;
        }
        .bank-card:hover { transform: translateY(-6px); }
        .patrimonio-card { border-radius: 22px; padding: 20px; position: relative; overflow: hidden; min-height: 200px; transition: transform 0.25s ease, box-shadow 0.25s ease; }
        .patrimonio-card:hover { transform: translateY(-5px); }
        .feedrow { transition: background 0.15s ease; }
        .feedrow:hover { background: rgba(255,255,255,0.5) !important; }

        .cta-wrap { position: fixed; bottom: 88px; right: 20px; z-index: 40; }
        .cta-btn {
          width: 60px; height: 60px; border-radius: 50%; background: ${primary}; border: none; cursor: pointer;
          display: flex; align-items: center; justify-content: center; position: relative;
          box-shadow: 0 10px 26px rgba(14,79,69,0.42);
          transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
          animation: halo 3.5s ease-in-out infinite;
        }
        @keyframes halo {
          0%, 100% { box-shadow: 0 10px 26px rgba(14,79,69,0.42), 0 0 0 0 rgba(14,79,69,0.18); }
          50% { box-shadow: 0 10px 26px rgba(14,79,69,0.42), 0 0 0 12px rgba(14,79,69,0); }
        }
        .particle {
          position: absolute; top: 30px; left: 30px; width: 5px; height: 5px; border-radius: 50%; background: ${gold};
          animation: burst 0.7s ease-out forwards;
        }
        @keyframes burst {
          0% { transform: rotate(var(--angle)) translateX(0) scale(1); opacity: 1; }
          100% { transform: rotate(var(--angle)) translateX(38px) scale(0); opacity: 0; }
        }

        .bottomnav {
          position: fixed; bottom: 0; left: 0; right: 0; padding: 10px 8px;
          background: rgba(255,255,255,0.75); backdrop-filter: blur(20px);
          border-top: 1px solid rgba(255,255,255,0.7); z-index: 30;
          overflow-x: auto; -webkit-overflow-scrolling: touch; justify-content: flex-start;
        }
        .navbtn-mobile { background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 5px; flex: 1 1 0; min-width: 0; padding: 6px 2px; }
        .navbtn-mobile span { white-space: nowrap; }

        /* ===== DESKTOP ===== */
        @media (min-width: 900px) {
          .app-shell { flex-direction: row; min-height: 100vh; }
          .sidebar-desktop { display: flex; }
          .bottomnav { display: none; }
          .cta-wrap { bottom: 32px; right: 40px; }
          .main-area { max-width: 980px; padding: 44px 48px 60px; margin: 0; }
          .hero-number { font-size: 54px; }
          .content-grid { flex-direction: row; gap: 28px; align-items: flex-start; }
          .col-main { flex: 1.7; display: flex; flex-direction: column; gap: 22px; }
          .col-side { flex: 1; display: flex; flex-direction: column; }
          .row-2col { flex-direction: row; }
          .row-2col > * { flex: 1; }
          .stat-grid-2 { grid-template-columns: repeat(2, 1fr); }
          .only-desktop { display: block; }
          .patrimonio-grid { grid-template-columns: repeat(3, 1fr); }
          .metas-grid { grid-template-columns: repeat(3, 1fr); }
          .header-mobile-only { display: none; }
        }
      `}</style>

      {/* Sidebar desktop */}
      <div className="sidebar-desktop" style={{ width: 240, flexShrink: 0, padding: '32px 20px', flexDirection: 'column', gap: 6, borderRight: '1px solid rgba(14,79,69,0.08)' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 32, padding: '0 8px' }}>
          <div style={{ width: 34, height: 34, borderRadius: 11, overflow: 'hidden', flexShrink: 0 }}>
            <img src={logoRaizUrl} alt="Raiz" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          </div>
          <span className="voice" style={{ fontSize: 19, fontWeight: 500 }}>Raiz</span>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', marginBottom: 28, padding: '0 8px' }}>
          <div style={{ width: 30, height: 30, borderRadius: '50%', background: meuPerfil?.avatar_cor || primary, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff' }}>
            {meuPerfil?.avatar_letra || '?'}
          </div>
          <span style={{ fontSize: 12.5, color: ink, marginLeft: 9, fontWeight: 500 }}>{meuPerfil?.nome || 'Carregando...'}</span>
        </div>
        {abas.map((a) => {
          const Icon = a.icon; const active = nav === a.id;
          return (
            <button key={a.id} onClick={() => { triggerHaptic(); setNav(a.id); }} style={{
              display: 'flex', alignItems: 'center', gap: 11, padding: '11px 12px', borderRadius: 12, border: 'none', cursor: 'pointer',
              background: active ? primaryTint : 'transparent', color: active ? primary : muted, fontSize: 13.5, fontWeight: active ? 600 : 500, textAlign: 'left',
            }}>
              <Icon size={17} strokeWidth={active ? 2.2 : 1.8} />{a.label}
            </button>
          );
        })}
        <button onClick={sair} style={{ display: 'flex', alignItems: 'center', gap: 11, padding: '11px 12px', borderRadius: 12, border: 'none', cursor: 'pointer', background: 'transparent', color: '#C1694F', fontSize: 13, fontWeight: 500, textAlign: 'left', marginTop: 'auto' }}>
          Sair
        </button>
      </div>

      {/* Header mobile only */}
      <div className="main-area">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 20 }} className="header-mobile-only">
          <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
            <div style={{ width: 32, height: 32, borderRadius: '50%', background: meuPerfil?.avatar_cor || primary, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 12, fontWeight: 700, color: '#fff' }}>
              {meuPerfil?.avatar_letra || '?'}
            </div>
            <span style={{ fontSize: 13, fontWeight: 500, color: ink }}>{meuPerfil?.nome || 'Carregando...'}</span>
          </div>
          <button onClick={sair} className="glass" style={{ border: 'none', borderRadius: 11, padding: '8px 14px', cursor: 'pointer', fontSize: 12, fontWeight: 600, color: '#C1694F' }}>
            Sair
          </button>
        </div>

        {nav === 'painel' && <TelaPainel transacoes={transacoes} saldoReal={saldoReal} householdId={householdId} userId={userId} />}
        {nav === 'patrimonio' && <TelaPatrimonio householdId={householdId} />}
        {nav === 'lancamentos' && <TelaLancamentos transacoes={transacoes} householdId={householdId} userId={userId} rendaRegular={meuPerfil?.renda_regular !== false} adicionarLancamento={adicionarLancamento} editarLancamento={editarLancamento} apagarLancamento={apagarLancamento} adicionarItemFatura={adicionarItemFatura} adicionarParcela={adicionarParcela} abrirFormAuto={abrirLancamentoAuto} onAbrirFormAutoConsumido={() => setAbrirLancamentoAuto(false)} />}
        {nav === 'carteira' && <TelaCarteira userId={userId} householdId={householdId} meuNome={meuPerfil?.nome} />}
        {nav === 'contasapagar' && <TelaContasAPagar userId={userId} householdId={householdId} />}
        {nav === 'metas' && <TelaMetas userId={userId} householdId={householdId} />}
        {nav === 'ajustes' && <TelaAjustes householdId={householdId} userId={userId} />}
      </div>

      <CTAFlutuante onClick={() => { setNav('lancamentos'); setAbrirLancamentoAuto(true); }} />

function gerarPadraoQR(seed, tamanho = 11) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const celulas = [];
  for (let y = 0; y < tamanho; y++) {
    for (let x = 0; x < tamanho; x++) {
      const naCanto = (x < 3 && y < 3) || (x > tamanho - 4 && y < 3) || (x < 3 && y > tamanho - 4);
      if (naCanto) continue;
      h = (h * 1103515245 + 12345) >>> 0;
      celulas.push({ x, y, ativo: (h >> 16) % 100 < 42 });
    }
  }
  return celulas;
}

function FinderPattern({ x, y, size }) {
  return (
    <g transform={`translate(${x},${y})`}>
      <rect width={size * 3} height={size * 3} fill={ink} rx={size * 0.4} />
      <rect x={size * 0.5} y={size * 0.5} width={size * 2} height={size * 2} fill="#fff" rx={size * 0.25} />
      <rect x={size} y={size} width={size} height={size} fill={ink} rx={size * 0.15} />
    </g>
  );
}

function OnboardingRaiz({ userId, onFinish }) {
  const [step, setStep] = useState(1);
  const [nome, setNome] = useState('');
  const [avatarLetra, setAvatarLetra] = useState('');
  const [avatarCor, setAvatarCor] = useState(lucas);
  const [rendaRegular, setRendaRegular] = useState(true);
  const [householdId, setHouseholdId] = useState(null);
  const [codigo, setCodigo] = useState(null);
  const [carregandoCodigo, setCarregandoCodigo] = useState(false);
  const [erroOnboarding, setErroOnboarding] = useState('');
  const [mostrarConvite, setMostrarConvite] = useState(false);
  const [codigoDigitado, setCodigoDigitado] = useState('');
  const [carregandoConvite, setCarregandoConvite] = useState(false);
  const [erroConvite, setErroConvite] = useState('');

  const entrarComCodigo = async () => {
    setErroConvite('');
    setCarregandoConvite(true);
    const codigoLimpo = codigoDigitado.trim().toUpperCase();
    const { data: household, error: erroBusca } = await window.db.from('households').select('id').eq('codigo_convite', codigoLimpo).maybeSingle();
    if (erroBusca) { setErroConvite('Erro ao buscar o código: ' + erroBusca.message); setCarregandoConvite(false); return; }
    if (!household) { setErroConvite('Código não encontrado — confira com quem te chamou.'); setCarregandoConvite(false); return; }
    const { error: erroPerfil } = await window.db.from('profiles').upsert({ id: userId, nome, avatar_cor: avatarCor, avatar_letra: avatarLetra, renda_regular: rendaRegular, household_id: household.id });
    if (erroPerfil) { setErroConvite('Erro ao entrar: ' + erroPerfil.message); setCarregandoConvite(false); return; }
    setCarregandoConvite(false);
    onFinish();
  };

  const salvarPerfilEAvancar = async () => {
    setErroOnboarding('');
    const { error } = await window.db.from('profiles').upsert({ id: userId, nome, avatar_cor: avatarCor, avatar_letra: avatarLetra, renda_regular: rendaRegular });
    if (error) { setErroOnboarding('Erro ao salvar perfil: ' + error.message); return; }
    setStep(2);
    criarHousehold();
  };

  const criarHousehold = async () => {
    setCarregandoCodigo(true);
    setErroOnboarding('');
    const novoCodigo = 'RAIZ-' + Math.random().toString(36).slice(2, 7).toUpperCase();
    const { data, error } = await window.db.from('households').insert({ codigo_convite: novoCodigo }).select().single();
    if (error) {
      setErroOnboarding('Erro ao criar a "casa": ' + error.message);
      setCarregandoCodigo(false);
      return;
    }
    const { error: erroUpdate } = await window.db.from('profiles').update({ household_id: data.id }).eq('id', userId);
    if (erroUpdate) {
      setErroOnboarding('Erro ao vincular seu perfil: ' + erroUpdate.message);
      setCarregandoCodigo(false);
      return;
    }
    setHouseholdId(data.id);
    setCodigo(novoCodigo);
    setCarregandoCodigo(false);
  };

  return (
    <div style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 640, borderRadius: 26, padding: '36px 26px', maxWidth: 400, margin: '0 auto', border: '1px solid rgba(14,79,69,0.08)' }}>
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
        button, input, select, textarea, optgroup { font-family: inherit; }
        .voice { font-family: 'Fraunces', serif; }
        @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        @keyframes popIn { from { transform: scale(0); } to { transform: scale(1); } }
        @keyframes burstOut {
          from { transform: rotate(var(--ang)) translateX(0); opacity: 1; }
          to { transform: rotate(var(--ang)) translateX(46px); opacity: 0; }
        }
      `}</style>

      <div style={{ display: 'flex', gap: 6, marginBottom: 24 }}>
        {[1, 2, 3].map((s) => (
          <div key={s} style={{ flex: 1, height: 3, borderRadius: 2, background: s <= step ? primary : 'rgba(14,79,69,0.12)', transition: 'background 0.3s' }} />
        ))}
      </div>

      {erroOnboarding && (
        <div style={{ background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '12px 14px', fontSize: 12.5, marginBottom: 20, lineHeight: 1.5 }}>
          {erroOnboarding}
          <button onClick={criarHousehold} style={{ display: 'block', marginTop: 8, background: 'none', border: 'none', color: '#C1694F', textDecoration: 'underline', cursor: 'pointer', fontSize: 12, fontWeight: 600, padding: 0 }}>
            Tentar de novo
          </button>
        </div>
      )}

      {step === 1 && (
        <OnboardingStep1 nome={nome} setNome={setNome} avatarLetra={avatarLetra} setAvatarLetra={setAvatarLetra}
          avatarCor={avatarCor} setAvatarCor={setAvatarCor} avancar={salvarPerfilEAvancar}
          rendaRegular={rendaRegular} setRendaRegular={setRendaRegular}
          mostrarConvite={mostrarConvite} setMostrarConvite={setMostrarConvite}
          codigoDigitado={codigoDigitado} setCodigoDigitado={setCodigoDigitado}
          entrarComCodigo={entrarComCodigo} carregandoConvite={carregandoConvite} erroConvite={erroConvite} />
      )}
      {step === 2 && (
        <OnboardingStep2 nome={nome} codigo={codigo} carregandoCodigo={carregandoCodigo}
          avancar={() => setStep(3)} pular={() => householdId && onFinish(householdId)} />
      )}
      {step === 3 && (
        <OnboardingStep3 avatarCor={avatarCor} avatarLetra={avatarLetra} codigo={codigo} finalizar={() => onFinish(householdId)} />
      )}
    </div>
  );
}

function AuthGate() {
  const [sessao, setSessao] = useState(undefined); // undefined = checando, null = deslogado
  const [modoCadastro, setModoCadastro] = useState(true);
  const [email, setEmail] = useState('');
  const [senha, setSenha] = useState('');
  const [erroAuth, setErroAuth] = useState('');
  const [carregando, setCarregando] = useState(false);
  const [modoRecuperar, setModoRecuperar] = useState(false);
  const [recuperarEnviado, setRecuperarEnviado] = useState(false);

  useEffect(() => {
    window.db.auth.getSession().then(({ data }) => setSessao(data.session || null));
    const { data: listener } = window.db.auth.onAuthStateChange((_evt, session) => setSessao(session));
    return () => listener.subscription.unsubscribe();
  }, []);

  const enviar = async () => {
    setErroAuth(''); setCarregando(true);
    const acao = modoCadastro ? window.db.auth.signUp({ email, password: senha }) : window.db.auth.signInWithPassword({ email, password: senha });
    const { error } = await acao;
    if (error) setErroAuth(error.message);
    setCarregando(false);
  };

  const enviarRecuperacao = async () => {
    if (!email) { setErroAuth('Digite seu email primeiro.'); return; }
    setErroAuth(''); setCarregando(true);
    const { error } = await window.db.auth.resetPasswordForEmail(email, { redirectTo: window.location.href });
    setCarregando(false);
    if (error) { setErroAuth(error.message); return; }
    setRecuperarEnviado(true);
  };

  if (sessao === undefined) {
    return <div style={{ textAlign: 'center', padding: 60, color: muted, fontFamily: 'Inter, sans-serif' }}>Carregando...</div>;
  }

  if (!sessao) {
    return (
      <div style={{ fontFamily: 'Inter, sans-serif', background: bg, minHeight: 640, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 20 }}>
        <style>{`
          @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500;600;700&display=swap');
          button, input, select, textarea, optgroup { font-family: inherit; }
          .voice { font-family: 'Fraunces', serif; }
          @keyframes fadeSlide { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
          .auth-input { width: 100%; border: 1px solid rgba(14,79,69,0.15); border-radius: 14px; padding: 13px 16px 13px 42px; font-size: 14px; outline: none; font-family: inherit; box-sizing: border-box; background: #fff; }
          .auth-input:focus { border-color: ${primary}; }
          .auth-tab { flex: 1; padding: 9px 0; border-radius: 12px; border: none; cursor: pointer; font-size: 13px; font-weight: 600; }
          .auth-btn { width: 100%; background: ${primary}; color: #fff; border: none; border-radius: 16px; padding: 15px 0; font-size: 14px; font-weight: 600; cursor: pointer; box-shadow: 0 10px 26px rgba(14,79,69,0.28); transition: transform 0.2s; }
          .auth-btn:active { transform: scale(0.98); }
        `}</style>

        <div style={{ width: '100%', maxWidth: 380, animation: 'fadeSlide 0.4s ease' }} className="glass">
          <div style={{ borderRadius: '24px 24px 0 0', overflow: 'hidden' }}>
            <div style={{
              padding: '38px 28px 30px', textAlign: 'center', position: 'relative', overflow: 'hidden', color: '#fff',
              background: `linear-gradient(155deg, ${primaryDeep} 0%, ${primary} 55%, #14685A 100%)`,
            }}>
              <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay', pointerEvents: 'none' }} />
              <div style={{ position: 'absolute', top: -50, right: -50, width: 180, height: 180, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%)' }} />
              <div style={{ width: 64, height: 64, borderRadius: 18, background: '#fff', display: 'flex', alignItems: 'center', justifyContent: 'center', margin: '0 auto 14px', overflow: 'hidden', boxShadow: '0 8px 20px rgba(0,0,0,0.15)' }}>
                <img src={logoRaizUrl} alt="Raiz" style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
              </div>
              <div className="voice" style={{ fontSize: 26, fontWeight: 500, marginBottom: 4 }}>Raiz</div>
              <div style={{ fontSize: 12.5, opacity: 0.75 }}>O painel financeiro que vocês olham juntos</div>
            </div>
          </div>

          <div style={{ padding: '26px 26px 28px' }}>
            <div style={{ display: 'flex', gap: 6, background: 'rgba(14,79,69,0.06)', borderRadius: 14, padding: 4, marginBottom: 22 }}>
              <button className="auth-tab" onClick={() => setModoCadastro(true)} style={{ background: modoCadastro ? '#fff' : 'transparent', color: modoCadastro ? primary : muted, boxShadow: modoCadastro ? '0 2px 6px rgba(0,0,0,0.06)' : 'none' }}>Criar conta</button>
              <button className="auth-tab" onClick={() => setModoCadastro(false)} style={{ background: !modoCadastro ? '#fff' : 'transparent', color: !modoCadastro ? primary : muted, boxShadow: !modoCadastro ? '0 2px 6px rgba(0,0,0,0.06)' : 'none' }}>Entrar</button>
            </div>

            <div style={{ position: 'relative', marginBottom: 12 }}>
              <Mail size={16} color={muted} style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)' }} />
              <input className="auth-input" value={email} onChange={(e) => setEmail(e.target.value)} placeholder="seu@email.com" type="email" />
            </div>

            {modoRecuperar ? (
              <>
                {recuperarEnviado ? (
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6, background: primaryTint, color: primary, borderRadius: 12, padding: '10px 12px', fontSize: 12.5, marginBottom: 16, lineHeight: 1.5 }}>
                    <Check size={14} style={{ flexShrink: 0, marginTop: 1 }} />Te mandamos um link por email pra criar uma senha nova. Pode fechar essa tela.
                  </div>
                ) : (
                  <>
                    {erroAuth && (
                      <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6, background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '10px 12px', fontSize: 12, marginBottom: 16 }}>
                        <AlertCircle size={14} style={{ flexShrink: 0, marginTop: 1 }} />{erroAuth}
                      </div>
                    )}
                    <button className="auth-btn" onClick={enviarRecuperacao} disabled={carregando} style={{ opacity: carregando ? 0.7 : 1, marginBottom: 12 }}>
                      {carregando ? 'Enviando...' : 'Enviar link de recuperação'}
                    </button>
                  </>
                )}
                <button onClick={() => { setModoRecuperar(false); setRecuperarEnviado(false); setErroAuth(''); }} style={{ width: '100%', background: 'transparent', border: 'none', color: muted, fontSize: 12.5, cursor: 'pointer', textDecoration: 'underline' }}>
                  Voltar pro login
                </button>
              </>
            ) : (
              <>
                <div style={{ position: 'relative', marginBottom: 8 }}>
                  <Lock size={16} color={muted} style={{ position: 'absolute', left: 14, top: '50%', transform: 'translateY(-50%)' }} />
                  <input className="auth-input" value={senha} onChange={(e) => setSenha(e.target.value)} placeholder="Senha (mín. 6 caracteres)" type="password" />
                </div>
                {!modoCadastro && (
                  <div style={{ textAlign: 'right', marginBottom: 10 }}>
                    <button onClick={() => { setModoRecuperar(true); setErroAuth(''); }} style={{ background: 'transparent', border: 'none', color: primary, fontSize: 12, cursor: 'pointer', fontWeight: 600 }}>
                      Esqueci minha senha
                    </button>
                  </div>
                )}

                {erroAuth && (
                  <div style={{ display: 'flex', alignItems: 'flex-start', gap: 6, background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '10px 12px', fontSize: 12, marginBottom: 16 }}>
                    <AlertCircle size={14} style={{ flexShrink: 0, marginTop: 1 }} />{erroAuth}
                  </div>
                )}

                <button className="auth-btn" onClick={enviar} disabled={carregando} style={{ opacity: carregando ? 0.7 : 1 }}>
                  {carregando ? 'Aguarde...' : modoCadastro ? 'Criar minha conta' : 'Entrar'}
                </button>
              </>
            )}

            <div style={{ textAlign: 'center', fontSize: 11.5, color: muted, marginTop: 18, lineHeight: 1.5 }}>
              {modoCadastro ? 'Seus dados ficam protegidos e visíveis só pra você e quem você convidar.' : 'Bom te ver de novo 🌱'}
            </div>
          </div>
        </div>
      </div>
    );
  }

  return <RaizApp userId={sessao.user.id} />;
}

// ============================================================================
// RAIZ APP — decide entre Onboarding (sem household ainda) e o app completo
// ============================================================================
function RaizApp({ userId }) {
  const [perfil, setPerfil] = useState(undefined);

  const buscarPerfil = () => {
    window.db.from('profiles').select('*').eq('id', userId).maybeSingle().then(({ data }) => setPerfil(data));
  };

  useEffect(() => { buscarPerfil(); }, [userId]);

  if (perfil === undefined) return <div style={{ textAlign: 'center', padding: 60, color: muted, fontFamily: 'Inter, sans-serif' }}>Carregando perfil...</div>;

  if (!perfil || !perfil.household_id) {
    return <OnboardingRaiz userId={userId} onFinish={() => buscarPerfil()} />;
  }

  return <AppPrincipal userId={userId} householdId={perfil.household_id} />;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<AuthGate />);
</script>

<script>
  const codigoFonte = document.getElementById('app-source').textContent;
  let compilado;
  try {
    compilado = Babel.transform(codigoFonte, { presets: [['react', { runtime: 'classic' }]] }).code;
    (0, eval)(compilado);
  } catch (erro) {
    const box = document.getElementById('erro-visivel');
    box.style.display = 'block';
    box.innerText = 'ERRO NA EXECUÇÃO: ' + erro.message + '\n\n' + (erro.stack || '') +
      '\n\n--- INÍCIO DO CÓDIGO COMPILADO (primeiros 800 caracteres) ---\n' +
      (compilado ? compilado.slice(0, 800) : '(Babel.transform falhou antes de gerar código)');
  }
</script>
</body>
</html>
