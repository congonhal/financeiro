// Campo de dinheiro — formata como R$ 1.234,56 enquanto a pessoa digita, guarda o número puro por dentro
function InputDinheiro({ value, onChange, placeholder, style }) {
  const exibir = value === '' || value === null || value === undefined ? '' : fmt(value);
  const handleChange = (e) => {
    const digitos = e.target.value.replace(/\D/g, '');
    if (digitos === '') { onChange(''); return; }
    onChange((Number(digitos) / 100).toString());
  };
  return (
    <div style={{ display: 'flex', alignItems: 'center', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', ...style }}>
      <span style={{ fontSize: 13, color: '#96897A', marginRight: 4 }}>R$</span>
      <input inputMode="numeric" value={exibir} onChange={handleChange} placeholder={placeholder || '0,00'}
        style={{ border: 'none', outline: 'none', width: '100%', fontSize: 13, fontFamily: 'inherit' }} />
    </div>
  );
}

function useCountUp(target, duration = 1100, decimals = 2) {
  const [value, setValue] = useState(0);
  useEffect(() => {
    let raf, start;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setValue(target * eased);
      if (p < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf);
  }, [target]);
  return value.toFixed(decimals);
}

function useMounted(delay = 60) {
  const [mounted, setMounted] = useState(false);
  useEffect(() => { const t = setTimeout(() => setMounted(true), delay); return () => clearTimeout(t); }, []);
  return mounted;
}

function ProgressRing({ percent, size = 64, stroke = 7 }) {
  const mounted = useMounted(300);
  const r = (size - stroke) / 2, c = 2 * Math.PI * r;
  return (
    <svg width={size} height={size} style={{ transform: 'rotate(-90deg)' }}>
      <circle cx={size / 2} cy={size / 2} r={r} stroke="rgba(255,255,255,0.22)" strokeWidth={stroke} fill="none" />
      <circle cx={size / 2} cy={size / 2} r={r} stroke="url(#goldgrad)" strokeWidth={stroke} fill="none" strokeLinecap="round"
        strokeDasharray={c} strokeDashoffset={mounted ? c * (1 - percent / 100) : c}
        style={{ transition: 'stroke-dashoffset 1.4s cubic-bezier(.22,1,.36,1)' }} />
      <defs><linearGradient id="goldgrad" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#fff" /><stop offset="100%" stopColor={gold} /></linearGradient></defs>
    </svg>
  );
}

function BlobEntradaSaida({ transacoes = [] }) {
  const mounted = useMounted(200);
  const entrada = transacoes.filter((t) => t.tipo === 'entrada').reduce((s, t) => s + Number(t.valor), 0);
  const saida = transacoes.filter((t) => t.tipo === 'saida').reduce((s, t) => s + Number(t.valor), 0);
  const total = entrada + saida;

  if (total === 0) {
    return (
      <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
        <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 10 }}>ENTROU × SAIU</div>
        <div style={{ fontSize: 13, color: muted, padding: '20px 0', textAlign: 'center' }}>Sem lançamentos ainda</div>
      </div>
    );
  }

  const pE = mounted ? (entrada / total) * 100 : 50, pS = mounted ? (saida / total) * 100 : 50;
  const fmtK = (v) => (v >= 1000 ? `${(v / 1000).toFixed(1)}k` : `R$${v.toFixed(0)}`);
  return (
    <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
      <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 14 }}>ENTROU × SAIU</div>
      <div style={{ display: 'flex', height: 76, borderRadius: 38, overflow: 'hidden' }}>
        {entrada > 0 && (
          <div style={{
            width: `${pE}%`, background: `linear-gradient(135deg, ${primary}, #167A69)`, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', borderRadius: saida > 0 ? '38px 14px 14px 38px' : '38px',
          }}>
            <span style={{ fontSize: 16, fontWeight: 700 }}>{fmtK(entrada)}</span>
            <span style={{ fontSize: 9.5, opacity: 0.85 }}>entrou</span>
          </div>
        )}
        {saida > 0 && (
          <div style={{
            width: `${pS}%`, background: `linear-gradient(135deg, ${marina}, #A6523B)`, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)',
            display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', color: '#fff', borderRadius: entrada > 0 ? '14px 38px 38px 14px' : '38px',
          }}>
            <span style={{ fontSize: 14, fontWeight: 700 }}>{fmtK(saida)}</span>
            <span style={{ fontSize: 9.5, opacity: 0.85 }}>saiu</span>
          </div>
        )}
      </div>
    </div>
  );
}

function HeroSaldo({ saldoReal = 0, metaPrincipal = null }) {
  const saldo = useCountUp(saldoReal, 1300, 2);
  const percent = metaPrincipal ? Math.min(100, (metaPrincipal.atual / metaPrincipal.total) * 100) : 0;
  const falta = metaPrincipal ? Math.max(0, metaPrincipal.total - metaPrincipal.atual) : 0;
  const meses = metaPrincipal && metaPrincipal.aporteMedio > 0 ? Math.ceil(falta / metaPrincipal.aporteMedio) : null;

  return (
    <div className="hero-card" style={{
      borderRadius: 30, padding: '30px 28px', color: '#fff', position: 'relative', overflow: 'hidden',
      background: `linear-gradient(155deg, ${primaryDeep} 0%, ${primary} 55%, #14685A 100%)`,
    }}>
      <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay', pointerEvents: 'none' }} />
      <div style={{ position: 'absolute', top: -60, right: -60, width: 220, height: 220, borderRadius: '50%', background: 'radial-gradient(circle, rgba(255,255,255,0.10), transparent 70%)' }} />
      <div style={{ fontSize: 12.5, opacity: 0.75, marginBottom: 6, fontWeight: 500, letterSpacing: 0.4 }}>SALDO LIVRE REAL</div>
      <div style={{ display: 'flex', alignItems: 'flex-end', justifyContent: 'space-between', flexWrap: 'wrap', gap: 16 }}>
        <div className="voice hero-number">R$ {fmt(saldo)}</div>
        {metaPrincipal && (
          <div style={{ position: 'relative', width: 68, height: 68, flexShrink: 0 }}>
            <ProgressRing percent={percent} size={68} stroke={7} />
            <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 13, fontWeight: 700 }}>{percent.toFixed(0)}%</div>
          </div>
        )}
      </div>
      <div style={{ fontSize: 12, opacity: 0.65, marginTop: 4, marginBottom: metaPrincipal ? 20 : 0 }}>já descontando contas do mês</div>
      {metaPrincipal && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: 'rgba(255,255,255,0.13)', borderRadius: 16, padding: '12px 16px', backdropFilter: 'blur(4px)' }}>
          <Target size={14} />

            {metaPrincipal.nome} — {meses !== null ? <>faltam <b>{meses} {meses === 1 ? 'mês' : 'meses'}</b> no ritmo atual</> : 'defina um aporte médio pra ver a previsão'}

}

function CTAFlutuante() {
  const [aberto, setAberto] = useState(false);
  const [particulas, setParticulas] = useState([]);
  const clicar = () => {
    triggerHaptic();
    setAberto((v) => !v);
    const novas = Array.from({ length: 6 }, (_, i) => ({ id: Date.now() + i, angle: (i / 6) * 360 }));
    setParticulas(novas);
    setTimeout(() => setParticulas([]), 700);
  };
  return (
    <div className="cta-wrap">
      {particulas.map((p) => (
        <span key={p.id} className="particle" style={{ '--angle': `${p.angle}deg` }} />
      ))}
      <button onClick={clicar} className="cta-btn" style={{ transform: aberto ? 'rotate(45deg)' : 'rotate(0deg)' }}>
        <Plus size={26} color="#fff" />
      </button>
    </div>
  );
}

function TelaPatrimonio({ householdId }) {
  const [ativos, setAtivos] = useState([]);
  const [totalBanco, setTotalBanco] = useState(0);
  const [carregando, setCarregando] = useState(true);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', categoria: 'Pecuária', investido: '', atual: '' });
  const [salvando, setSalvando] = useState(false);
  const mounted = useMounted(200);
  const [editandoId, setEditandoId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editCategoria, setEditCategoria] = useState('Pecuária');
  const [editInvestido, setEditInvestido] = useState('');
  const [editAtual, setEditAtual] = useState('');

  const abrirEdicao = (p) => {
    setEditandoId(p.id); setEditNome(p.nome); setEditCategoria(p.categoria); setEditInvestido(String(p.investido)); setEditAtual(String(p.atual));
  };

  const salvarEdicao = async (id) => {
    if (!editNome || !editInvestido) return;
    const { error } = await window.db.from('assets').update({
      nome: editNome, categoria: editCategoria, investido: Number(editInvestido), atual: Number(editAtual) || Number(editInvestido),
    }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setEditandoId(null);
    buscarTudo();
  };

  const apagar = async (id) => {
    if (!confirm('Apagar esse ativo?')) return;
    const { error } = await window.db.from('assets').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  const buscarTudo = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('assets').select('*').eq('household_id', householdId).order('data_aquisicao', { ascending: false }),
      window.db.from('accounts').select('saldo').eq('household_id', householdId),
    ]).then(([resAtivos, resContas]) => {
      setAtivos(resAtivos.data || []);
      setTotalBanco((resContas.data || []).reduce((s, c) => s + Number(c.saldo || 0), 0));
      setCarregando(false);
    });
  };

  useEffect(() => { buscarTudo(); }, [householdId]);

  const salvar = async () => {
    if (!novo.nome || !novo.investido) return;
    setSalvando(true);
    const { error } = await window.db.from('assets').insert([{
      household_id: householdId, nome: novo.nome, categoria: novo.categoria,
      investido: Number(novo.investido), atual: Number(novo.atual) || Number(novo.investido),
      data_aquisicao: new Date().toISOString().slice(0, 10),
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    setNovo({ nome: '', categoria: 'Pecuária', investido: '', atual: '' });
    setMostrarForm(false);
    setSalvando(false);
    buscarTudo();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const totalReal = ativos.reduce((s, p) => s + Number(p.atual || 0), 0);
  const total = totalBanco + totalReal;
  const categoriasAtivo = ['Pecuária', 'Equipamento', 'Terra', 'Imóvel', 'Outro'];

  return (
    <div className="content-grid">
      <div className="col-main">
        <div className="hero-card" style={{ borderRadius: 30, padding: '28px 28px', color: '#fff', background: `linear-gradient(150deg, ${primary}, #4A5A2E)`, marginBottom: 24, position: 'relative', overflow: 'hidden' }}>
          <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.05, mixBlendMode: 'overlay' }} />
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start' }}>
            <div>
              <div style={{ fontSize: 12.5, opacity: 0.8, marginBottom: 4 }}>O QUE VOCÊS JÁ CONSTRUÍRAM</div>
              <div className="voice hero-number">R$ {fmt(total)}</div>
            </div>
            <button onClick={() => setMostrarForm(!mostrarForm)} style={{ background: 'rgba(255,255,255,0.18)', border: 'none', color: '#fff', borderRadius: 20, padding: '9px 16px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
              + Adicionar ativo
            </button>
          </div>
          {total > 0 && (
            <>
              <div style={{ display: 'flex', height: 9, borderRadius: 5, overflow: 'hidden', marginTop: 18, marginBottom: 8 }}>
                <div style={{ width: mounted ? `${(totalBanco / total) * 100}%` : '50%', background: lucas, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
                <div style={{ width: mounted ? `${(totalReal / total) * 100}%` : '50%', background: marina, transition: 'width 1.1s cubic-bezier(.22,1,.36,1)' }} />
              </div>
              <div style={{ display: 'flex', justifyContent: 'space-between', fontSize: 11.5, opacity: 0.9 }}>
                <span>Bancos: R$ {fmt(totalBanco)}</span><span>Ativos reais: R$ {fmt(totalReal)}</span>
              </div>
            </>
          )}
        </div>

        {mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 18, marginBottom: 20 }}>
            <input value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} placeholder="Ex: 6 bezerros para cria"
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            <div style={{ display: 'flex', gap: 6, flexWrap: 'wrap', marginBottom: 10 }}>
              {categoriasAtivo.map((c) => (
                <button key={c} onClick={() => setNovo({ ...novo, categoria: c })} style={{
                  padding: '6px 12px', borderRadius: 10, border: `1px solid ${novo.categoria === c ? primary : 'rgba(14,79,69,0.15)'}`,
                  background: novo.categoria === c ? primary : '#fff', color: novo.categoria === c ? '#fff' : ink, fontSize: 12, fontWeight: 600, cursor: 'pointer',
                }}>{c}</button>
              ))}
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10, marginBottom: 10 }}>
              <input type="number" value={novo.investido} onChange={(e) => setNovo({ ...novo, investido: e.target.value })} placeholder="Valor investido (R$)"
                style={{ border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              <input type="number" value={novo.atual} onChange={(e) => setNovo({ ...novo, atual: e.target.value })} placeholder="Valor atual (R$)"
                style={{ border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
            </div>
            <button onClick={salvar} disabled={salvando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', opacity: salvando ? 0.6 : 1 }}>
              {salvando ? 'Salvando...' : 'Salvar ativo'}
            </button>
          </div>
        )}

        {ativos.length === 0 && !mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center' }}>
            <TrendingUp size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhum ativo cadastrado ainda</div>
          </div>
        )}

        <div className="patrimonio-grid">
          {ativos.map((p) => {
            const Icon = categoriaIcon[p.categoria] || TrendingUp;
            const investido = Number(p.investido) || 1;
            const valorizacao = (((Number(p.atual) - investido) / investido) * 100).toFixed(0);
            const marco = valorizacao >= 25;
            const editando = editandoId === p.id;

            if (editando) {
              return (
                <div key={p.id} className="glass patrimonio-card">
                  <input value={editNome} onChange={(e) => setEditNome(e.target.value)} placeholder="Nome do ativo"
                    style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px', fontSize: 13, outline: 'none', marginBottom: 8, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                  <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', marginBottom: 8 }}>
                    {['Pecuária', 'Equipamento', 'Terra', 'Imóvel', 'Outro'].map((c) => (
                      <button key={c} onClick={() => setEditCategoria(c)} style={{
                        padding: '4px 9px', borderRadius: 8, border: `1px solid ${editCategoria === c ? primary : 'rgba(14,79,69,0.15)'}`,
                        background: editCategoria === c ? primary : '#fff', color: editCategoria === c ? '#fff' : ink, fontSize: 11, fontWeight: 600, cursor: 'pointer',

                    ))}
                  </div>
                  <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Investido</label>

                  <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor atual</label>

                  <div style={{ display: 'flex', gap: 8 }}>

                    <button onClick={() => setEditandoId(null)} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '9px 12px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>

            }

            return (
              <div key={p.id} className="glass patrimonio-card">
                <Icon size={100} color={primary} style={{ position: 'absolute', top: -14, right: -24, opacity: 0.055 }} />

                <div style={{ fontSize: 10.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 10 }}>{(p.categoria || '').toUpperCase()}</div>

                <div style={{ fontSize: 12.5, marginBottom: 10 }}>R$ {fmt(p.investido)}</div>
                <div className="voice" style={{ fontSize: 21, fontWeight: 500 }}>R$ {fmt(p.atual)}</div>
                <div style={{ fontSize: 11.5, color: gold, fontWeight: 600, marginTop: 2 }}>↗ {valorizacao >= 0 ? '+' : ''}{valorizacao}%</div>
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

  const [contas, setContas] = useState([]);

  useEffect(() => {
    if (!householdId) return;

  const filtrados = transacoes
    .filter((l) => filtro === 'todos' || l.tipo === filtro)
    .filter((l) => (l.descricao || '').toLowerCase().includes(busca.toLowerCase()));
  const grupos = {};
  filtrados.forEach((l) => { (grupos[l.data] = grupos[l.data] || []).push(l); });
  const datasOrdenadas = Object.keys(grupos).sort((a, b) => b.localeCompare(a));
  const dataFmt = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: 'short', weekday: 'short' });

  const porCategoria = {};
  transacoes.filter((l) => l.tipo === 'saida').forEach((l) => { const c = l.categoria || 'Geral'; porCategoria[c] = (porCategoria[c] || 0) + Number(l.valor); });
  const categoriasTop = Object.entries(porCategoria).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const maiorCategoria = categoriasTop[0]?.[1] || 1;

  const filtros = [
    { id: 'todos', label: 'Todos' }, { id: 'entrada', label: 'Entradas' },
    { id: 'saida', label: 'Saídas' }, { id: 'investimento', label: 'Investimentos' },
  ];

  const abrirNovo = () => { setEditandoId(null); setNovo({ descricao: '', valor: '', tipo: 'saida', categoria: 'Geral', formaPagamento: 'direto', contaCartaoId: '' }); setMostrarForm(!mostrarForm); };
  const abrirEdicao = (t) => { setEditandoId(t.id); setNovo({ descricao: t.descricao, valor: String(t.valor), tipo: t.tipo, categoria: t.categoria || 'Geral', formaPagamento: 'direto', contaCartaoId: '' }); setMostrarForm(true); };

  const ehCartao = novo.tipo === 'saida' && novo.formaPagamento === 'cartao';

  const salvar = async () => {
    if (!novo.descricao || !novo.valor) return;
    if (ehCartao && !novo.contaCartaoId) { alert('Escolha em qual cartão foi a compra.'); return; }
    setSalvando(true);
    try {
      if (editandoId) {
        await editarLancamento(editandoId, { descricao: novo.descricao, valor: Number(novo.valor), tipo: novo.tipo, categoria: novo.categoria });
      } else if (ehCartao) {
        await adicionarItemFatura({
          account_id: novo.contaCartaoId, descricao: novo.descricao, valor: Number(novo.valor), categoria: novo.categoria,
        });
      } else {
        await adicionarLancamento({
          descricao: novo.descricao, valor: Number(novo.valor), tipo: novo.tipo,
          categoria: novo.categoria, grupo: 'Variável', visivel: true,
          data: new Date().toISOString().slice(0, 10),
        });
      }
      setNovo({ descricao: '', valor: '', tipo: 'saida', categoria: 'Geral', formaPagamento: 'direto', contaCartaoId: '' });
      setMostrarForm(false);
      setEditandoId(null);
    } catch (erro) {
      alert('Erro ao salvar: ' + erro.message);
    }
    setSalvando(false);
  };

  const apagar = async (id) => {
    if (!confirm('Apagar esse lançamento?')) return;
    try { await apagarLancamento(id); } catch (erro) { alert('Erro ao apagar: ' + erro.message); }

                          {!t.visivel && <Lock size={11} color={muted} />}
                        </div>

                          : <TextoPrivado visivel={false} texto="" valor={t.valor} />}
                      </div>
                      <button onClick={() => abrirEdicao(t)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', padding: 4, display: 'flex' }} title="Editar">

        ))}
      </div>

      <div className="col-side only-desktop">
        <div className="glass" style={{ borderRadius: 22, padding: 22 }}>
          <div style={{ fontSize: 12, fontWeight: 600, color: muted, letterSpacing: 0.4, marginBottom: 16 }}>POR CATEGORIA</div>
          {categoriasTop.length === 0 && <div style={{ fontSize: 12, color: muted }}>Sem dados ainda</div>}

            ))}

    </div>
  );
}

function MetaCard({ m, editando, editNome, setEditNome, editTotal, setEditTotal, editAtual, setEditAtual, editAporte, setEditAporte, onEditar, onApagar, onSalvar, onCancelar }) {
  const percent = Math.min(100, (m.atual / m.total) * 100);
  const falta = Math.max(0, m.total - m.atual);
  const meses = m.aporteMedio > 0 ? Math.ceil(falta / m.aporteMedio) : 0;
  const anos = Math.floor(meses / 12), mesesResto = meses % 12;

  if (editando) {
    return (
      <div className="glass" style={{ borderRadius: 24, padding: 24 }}>
        <input value={editNome} onChange={(e) => setEditNome(e.target.value)} placeholder="Nome da meta"
          style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
        <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 8, marginBottom: 12 }}>
          <div>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Valor total</label>
            <InputDinheiro value={editTotal} onChange={setEditTotal} />
          </div>
          <div>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Já alcançado</label>
            <InputDinheiro value={editAtual} onChange={setEditAtual} />
          </div>
          <div>
            <label style={{ fontSize: 10.5, color: muted, display: 'block', marginBottom: 3 }}>Aporte/mês</label>
            <InputDinheiro value={editAporte} onChange={setEditAporte} />
          </div>
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <button onClick={onSalvar} style={{ flex: 1, background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '9px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Salvar</button>
          <button onClick={onCancelar} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '9px 14px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
        </div>
      </div>
    );
  }

  return (
    <div className="glass" style={{ borderRadius: 24, padding: 24, position: 'relative', overflow: 'hidden' }}>
      {m.destaque && <div style={{ position: 'absolute', inset: 0, backgroundImage: `url("${noiseUrl}")`, opacity: 0.03, mixBlendMode: 'overlay', pointerEvents: 'none' }} />}
      <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 20 }}>
        <div style={{ fontSize: 14, fontWeight: 600 }}>{m.nome}</div>
        <div style={{ display: 'flex', gap: 10, flexShrink: 0 }}>
          <button onClick={onEditar} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Pencil size={13} color={muted} /></button>
          <button onClick={onApagar} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}><Trash2 size={13} color="#C1694F" /></button>
        </div>
      </div>
      <div style={{ display: 'flex', alignItems: 'center', gap: 18 }}>
        <div style={{ position: 'relative', width: 84, height: 84, flexShrink: 0 }}>
          <ProgressRing percent={percent} size={84} stroke={8} />
          <div style={{ position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 16, fontWeight: 700, color: ink }}>{percent.toFixed(0)}%</div>
        </div>
        <div style={{ fontSize: 12 }}>
          <div style={{ color: muted, marginBottom: 2 }}>Alcançado</div>
          <div style={{ fontWeight: 600, marginBottom: 8, fontSize: 13.5 }}>R$ {fmt(m.atual)}</div>
          <div style={{ color: muted, marginBottom: 2 }}>Meta</div>
          <div style={{ fontWeight: 600, fontSize: 13.5 }}>R$ {fmt(m.total)}</div>
        </div>
      </div>
      <div style={{ marginTop: 18, paddingTop: 14, borderTop: '1px solid rgba(14,79,69,0.08)', fontSize: 12.5, color: muted, lineHeight: 1.5 }}>
        {percent >= 100 ? <span style={{ color: primary, fontWeight: 600 }}>Meta alcançada 🎉</span> : (
          <>No ritmo atual (<b style={{ color: ink }}>R$ {fmt(m.aporteMedio)}/mês</b>), faltam <b style={{ color: ink }}>{meses} {meses === 1 ? 'mês' : 'meses'}</b>{anos > 0 && <> (~{anos}a{mesesResto > 0 ? ` ${mesesResto}m` : ''})</>}</>
        )}
      </div>
    </div>
  );
}

function addMeses(anoMesChave, n) {
  const [ano, mes] = anoMesChave.split('-').map(Number);
  const d = new Date(ano, mes - 1 + n, 1);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`;
}
const mesChaveDeData = (dataStr) => dataStr.slice(0, 7);
const nomeMes = (chave) => {
  const [ano, mes] = chave.split('-').map(Number);
  return new Date(ano, mes - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' });
};
// A fatura de uma conta não é "o mês em que a compra foi feita" — é o mês do PRÓXIMO vencimento
// dessa conta a partir de hoje. Uma compra do dia 8 pode perfeitamente só vencer no mês seguinte.
function mesDoProximoVencimento(diaVenc, hoje = new Date()) {
  const dia = diaVenc || hoje.getDate();
  let mes = hoje.getMonth(), ano = hoje.getFullYear();
  if (hoje.getDate() > dia) { mes += 1; if (mes > 11) { mes = 0; ano += 1; } }
  return `${ano}-${String(mes + 1).padStart(2, '0')}`;
}

function TelaContasAPagar({ userId, householdId }) {
  const [contas, setContas] = useState([]);
  const [itens, setItens] = useState([]);
  const [parcelas, setParcelas] = useState([]);
  const [recorrencias, setRecorrencias] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [erro, setErro] = useState('');

  const buscar = () => {
    setCarregando(true);
    setErro('');
    Promise.all([
      window.db.from('accounts').select('*').eq('household_id', householdId),
      window.db.from('fatura_itens').select('*').eq('household_id', householdId),
      window.db.from('compras_parceladas').select('*').eq('household_id', householdId),
      window.db.from('recorrencias').select('*').eq('household_id', householdId).eq('ativo', true),
    ]).then(([resContas, resItens, resParcelas, resRecorrencias]) => {
      const erros = [resContas, resItens, resParcelas, resRecorrencias].map((r) => r.error).filter(Boolean);
      if (erros.length > 0) setErro(erros[0].message + ' — confirma se todos os SQLs de atualização foram rodados.');
      setContas(resContas.data || []);
      setItens(resItens.data || []);
      setParcelas(resParcelas.data || []);
      setRecorrencias(resRecorrencias.data || []);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const pagarFatura = async (contaId, itensDaConta) => {
    const total = itensDaConta.reduce((s, i) => s + Number(i.valor), 0);
    if (total <= 0) return;
    const conta = contas.find((c) => c.id === contaId);
    if (!confirm(`Confirmar pagamento de R$ ${fmt(total)} da fatura ${conta?.nome}?`)) return;
    await window.db.from('transactions').insert([{
      household_id: householdId, autor_id: userId, tipo: 'saida', descricao: `Pagamento fatura ${conta?.nome || ''}`,
      valor: total, categoria: 'Fatura', grupo: 'Fixa', visivel: true, data: new Date().toISOString().slice(0, 10), conta: contaId,
    }]);
    await window.db.from('fatura_itens').delete().in('id', itensDaConta.map((i) => i.id));
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  // Monta a projeção dos próximos 6 meses, somando 3 fontes: itens reais + parcelas (avulsas e da fatura) + recorrências
  const hoje = new Date();
  const mesAtual = `${hoje.getFullYear()}-${String(hoje.getMonth() + 1).padStart(2, '0')}`;
  const numMeses = 6;
  const chavesMeses = Array.from({ length: numMeses }, (_, k) => addMeses(mesAtual, k));

  const projecao = {};
  chavesMeses.forEach((mk) => { projecao[mk] = {}; contas.forEach((c) => { projecao[mk][c.id] = { total: 0, itensReais: [] }; }); });

  const somar = (mk, contaId, valor, item) => {
    if (!projecao[mk] || !projecao[mk][contaId]) return;
    projecao[mk][contaId].total += valor;
    if (item) projecao[mk][contaId].itensReais.push(item);
  };

  // 1. Itens de fatura já lançados (manual ou CSV) — todos pertencem à PRÓXIMA fatura a vencer
  // dessa conta (não ao mês em que a compra foi feita) — e suas parcelas futuras projetadas
  itens.forEach((i) => {
    const conta = contas.find((c) => c.id === i.account_id);
    const mk = mesDoProximoVencimento(conta?.dia_venc, hoje);
    somar(mk, i.account_id, Number(i.valor), i);
    if (i.parcela_atual && i.parcela_total && i.parcela_atual < i.parcela_total) {
      for (let n = 1; n <= i.parcela_total - i.parcela_atual; n++) {
        somar(addMeses(mk, n), i.account_id, Number(i.valor), null);
      }
    }
  });

  // 2. Compras parceladas (cadastradas manualmente) — usa a data que a própria pessoa informou
  parcelas.forEach((p) => {
    const mkInicio = mesChaveDeData(p.data_primeira_parcela);
    const valorParcela = p.valor_total / p.num_parcelas;
    for (let n = 0; n < p.num_parcelas; n++) {
      somar(addMeses(mkInicio, n), p.account_id, valorParcela, null);
    }
  });

  // 3. Recorrências fixas — repete a partir do próximo vencimento dessa conta, todo mês
  recorrencias.forEach((r) => {
    const conta = contas.find((c) => c.id === r.account_id);
    const mkInicio = mesDoProximoVencimento(conta?.dia_venc, hoje);
    for (let n = 0; n < numMeses; n++) {
      somar(addMeses(mkInicio, n), r.account_id, Number(r.valor), null);
    }
  });

  const totalGeralJanela = chavesMeses.reduce((s, mk) => s + contas.reduce((s2, c) => s2 + projecao[mk][c.id].total, 0), 0);

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ marginBottom: 4 }}>
          <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 2 }}>Contas a Pagar</div>
          <div style={{ fontSize: 13, color: muted }}>Linha do tempo dos próximos 6 meses — faturas, parcelas e recorrências, tudo somado</div>
        </div>

        {erro && (
          <div style={{ background: '#F6E8E2', color: '#C1694F', borderRadius: 12, padding: '12px 14px', fontSize: 12.5, marginTop: 16, lineHeight: 1.5 }}>
            {erro}
          </div>
        )}

        <div className="glass" style={{ borderRadius: 20, padding: 18, marginTop: 16, marginBottom: 24 }}>
          <div style={{ fontSize: 11.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 4 }}>TOTAL NOS PRÓXIMOS 6 MESES</div>
          <div className="voice" style={{ fontSize: 28, fontWeight: 500, color: totalGeralJanela > 0 ? '#C1694F' : ink }}>R$ {fmt(totalGeralJanela)}</div>
        </div>

        {contas.length === 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center' }}>
            <Receipt size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Cadastre uma conta na Carteira pra começar a ver a projeção aqui</div>
          </div>
        )}

        {/* Linha do tempo mês a mês */}
        <div style={{ position: 'relative', paddingLeft: 20 }}>
          {contas.length > 0 && <div style={{ position: 'absolute', left: 5, top: 8, bottom: 8, width: 2, background: 'rgba(14,79,69,0.1)' }} />}
          {chavesMeses.map((mk) => {
            const contasDoMes = contas.map((c) => ({ conta: c, ...projecao[mk][c.id] })).filter((f) => f.total > 0.01);
            const totalMes = contasDoMes.reduce((s, f) => s + f.total, 0);
            if (contas.length === 0) return null;
            return (
              <div key={mk} style={{ position: 'relative', marginBottom: 24 }}>
                <div style={{ position: 'absolute', left: -20, top: 4, width: 12, height: 12, borderRadius: '50%', background: totalMes > 0 ? '#C1694F' : 'rgba(14,79,69,0.2)', border: '2px solid #F6F5F0' }} />
                <div style={{ fontSize: 13, fontWeight: 600, marginBottom: 8, textTransform: 'capitalize' }}>
                  {nomeMes(mk)} {mk === mesAtual && <span style={{ fontSize: 10, color: primary, background: primaryTint, padding: '2px 8px', borderRadius: 8, marginLeft: 6 }}>ESSE MÊS</span>}
                </div>
                {contasDoMes.length === 0 ? (
                  <div style={{ fontSize: 12, color: muted, paddingBottom: 4 }}>Nada previsto</div>
                ) : (
                  <div className="glass" style={{ borderRadius: 16, padding: 14 }}>
                    {contasDoMes.map((f) => (
                      <div key={f.conta.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '6px 0' }}>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 7 }}>
                          <div style={{ width: 8, height: 8, borderRadius: 2, background: f.conta.cor }} />
                          <span style={{ fontSize: 12.5 }}>{f.conta.nome}</span>
                          {f.conta.dia_venc && <span style={{ fontSize: 10.5, color: muted }}>· dia {f.conta.dia_venc}</span>}
                        </div>
                        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
                          <span style={{ fontSize: 13, fontWeight: 600 }}>R$ {fmt(f.total)}</span>
                          {mk === mesAtual && f.itensReais.length > 0 && (
                            <button onClick={() => pagarFatura(f.conta.id, f.itensReais)} style={{ background: primaryTint, color: primary, border: 'none', borderRadius: 8, padding: '4px 10px', fontSize: 10.5, fontWeight: 600, cursor: 'pointer' }}>
                              Pagar
                            </button>
                          )}
                        </div>
                      </div>
                    ))}
                    <div style={{ display: 'flex', justifyContent: 'space-between', paddingTop: 8, marginTop: 4, borderTop: '1px solid rgba(14,79,69,0.06)' }}>
                      <span style={{ fontSize: 11.5, color: muted, fontWeight: 600 }}>Total do mês</span>
                      <span style={{ fontSize: 13, fontWeight: 700, color: '#C1694F' }}>R$ {fmt(totalMes)}</span>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TelaCaixinhas({ householdId }) {
  const [caixinhas, setCaixinhas] = useState([]);
  const [contas, setContas] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [editandoId, setEditandoId] = useState(null);
  const [novoValor, setNovoValor] = useState('');
  const [novaTaxa, setNovaTaxa] = useState('');

  const buscar = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('caixinhas_conta').select('*').eq('household_id', householdId),
      window.db.from('accounts').select('id, nome, cor, dono').eq('household_id', householdId),
    ]).then(([resCaixinhas, resContas]) => {
      setCaixinhas(resCaixinhas.data || []);
      setContas(resContas.data || []);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const estimativaHoje = (c) => {
    const dataRef = c.data_referencia ? new Date(c.data_referencia + 'T00:00:00') : new Date();
    const dias = Math.max(0, (new Date() - dataRef) / (1000 * 60 * 60 * 24));
    const taxa = Number(c.taxa_anual || 0) / 100;
    return Number(c.valor || 0) * Math.pow(1 + taxa, dias / 365);
  };

  const abrirEdicao = (c) => { setEditandoId(c.id); setNovoValor(String(c.valor)); setNovaTaxa(String(c.taxa_anual ?? 10.5)); };

  const salvarValorReal = async (id) => {
    const { error } = await window.db.from('caixinhas_conta').update({
      valor: Number(novoValor) || 0, taxa_anual: Number(novaTaxa) || 0, data_referencia: new Date().toISOString().slice(0, 10),
    }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setEditandoId(null);
    buscar();
  };

  const apagar = async (id) => {
    if (!confirm('Apagar essa caixinha?')) return;
    const { error } = await window.db.from('caixinhas_conta').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const totalEstimado = caixinhas.reduce((s, c) => s + estimativaHoje(c), 0);

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ marginBottom: 4 }}>
          <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 2 }}>Caixinhas</div>
          <div style={{ fontSize: 13, color: muted }}>Reservas guardadas em cada conta, com estimativa de rendimento</div>
        </div>

        {caixinhas.length > 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 18, marginTop: 16, marginBottom: 4 }}>
            <div style={{ fontSize: 11.5, color: muted, fontWeight: 600, letterSpacing: 0.4, marginBottom: 4 }}>TOTAL ESTIMADO HOJE</div>
            <div className="voice" style={{ fontSize: 26, fontWeight: 500 }}>R$ {fmt(totalEstimado)}</div>
          </div>
        )}

        {caixinhas.length === 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center', marginTop: 16 }}>
            <PiggyBank size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhuma caixinha ainda — adicione uma dentro de uma conta, na Carteira</div>
          </div>
        )}

        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fit, minmax(260px, 1fr))', gap: 14, marginTop: 16 }}>
          {caixinhas.map((c) => {
            const conta = contas.find((ct) => ct.id === c.account_id);
            const estimativa = estimativaHoje(c);
            const diferenca = estimativa - Number(c.valor || 0);
            const editando = editandoId === c.id;
            return (
              <div key={c.id} className="glass" style={{ borderRadius: 20, padding: 18 }}>
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 10 }}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 6 }}>
                    <div style={{ width: 7, height: 7, borderRadius: '50%', background: conta?.cor || primary }} />
                    <span style={{ fontSize: 11, color: muted }}>{conta?.nome || '—'} · {conta?.dono || '—'}</span>
                  </div>
                  <button onClick={() => apagar(c.id)} style={{ background: 'transparent', border: 'none', cursor: 'pointer', display: 'flex' }}>
                    <Trash2 size={13} color="#C1694F" />
                  </button>
                </div>
                <div style={{ fontSize: 14, fontWeight: 600, marginBottom: 10 }}>{c.nome}</div>

                {!editando ? (
                  <>
                    <div style={{ fontSize: 10.5, color: muted, marginBottom: 2 }}>Estimativa hoje ({c.taxa_anual || 0}% a.a.)</div>
                    <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 4 }}>R$ {fmt(estimativa)}</div>
                    <div style={{ fontSize: 11, color: primary, marginBottom: 12 }}>+ R$ {fmt(diferenca)} desde {c.data_referencia}</div>
                    <button onClick={() => abrirEdicao(c)} style={{ background: 'rgba(14,79,69,0.06)', border: 'none', color: primary, borderRadius: 10, padding: '7px 12px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>
                      Atualizar valor real
                    </button>
                  </>
                ) : (
                  <div>
                    <label style={{ fontSize: 11, color: muted, display: 'block', marginBottom: 4 }}>Valor real de hoje</label>
                    <InputDinheiro value={novoValor} onChange={setNovoValor} style={{ marginBottom: 8 }} />
                    <label style={{ fontSize: 11, color: muted, display: 'block', marginBottom: 4 }}>Taxa ao ano (%) — deixe como está se não souber</label>
                    <input type="number" value={novaTaxa} onChange={(e) => setNovaTaxa(e.target.value)}
                      style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
                    <div style={{ display: 'flex', gap: 8 }}>
                      <button onClick={() => salvarValorReal(c.id)} style={{ flex: 1, background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '9px 0', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Salvar</button>
                      <button onClick={() => setEditandoId(null)} style={{ background: 'rgba(14,79,69,0.06)', color: muted, border: 'none', borderRadius: 10, padding: '9px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer' }}>Cancelar</button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function TelaMetas({ householdId }) {
  const [metasReais, setMetasReais] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', valorTotal: '', valorAtual: '', aporteMedio: '' });
  const [salvando, setSalvando] = useState(false);
  const [editandoId, setEditandoId] = useState(null);
  const [editNome, setEditNome] = useState('');
  const [editTotal, setEditTotal] = useState('');
  const [editAtual, setEditAtual] = useState('');
  const [editAporte, setEditAporte] = useState('');

  const abrirEdicao = (m) => {
    setEditandoId(m.id); setEditNome(m.nome); setEditTotal(String(m.total)); setEditAtual(String(m.atual)); setEditAporte(String(m.aporteMedio));
  };

  const salvarEdicao = async (id) => {
    if (!editNome || !editTotal) return;
    const { error } = await window.db.from('metas').update({
      nome: editNome, valor_total: Number(editTotal), valor_atual: Number(editAtual) || 0, aporte_medio: Number(editAporte) || 0,
    }).eq('id', id);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setEditandoId(null);
    buscar();
  };

  const apagar = async (id) => {
    if (!confirm('Apagar essa meta?')) return;
    const { error } = await window.db.from('metas').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscar();
  };

  const buscar = () => {
    setCarregando(true);
    window.db.from('metas').select('*').eq('household_id', householdId).order('created_at', { ascending: true })
      .then(({ data }) => {
        setMetasReais((data || []).map((m) => ({ id: m.id, nome: m.nome, total: Number(m.valor_total), atual: Number(m.valor_atual), aporteMedio: Number(m.aporte_medio) })));
        setCarregando(false);
      });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const salvar = async () => {
    if (!novo.nome || !novo.valorTotal) return;
    setSalvando(true);
    const { error } = await window.db.from('metas').insert([{
      household_id: householdId, nome: novo.nome, valor_total: Number(novo.valorTotal),
      valor_atual: Number(novo.valorAtual) || 0, aporte_medio: Number(novo.aporteMedio) || 0,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    setNovo({ nome: '', valorTotal: '', valorAtual: '', aporteMedio: '' });
    setMostrarForm(false);
    setSalvando(false);
    buscar();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 4 }}>
          <div className="voice" style={{ fontSize: 22, fontWeight: 500 }}>Metas</div>
          <button onClick={() => setMostrarForm(!mostrarForm)} style={{ background: primary, color: '#fff', border: 'none', borderRadius: 20, padding: '9px 16px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>
            + Nova meta
          </button>
        </div>

        {mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 18, marginTop: 16, marginBottom: 16 }}>
            <input value={novo.nome} onChange={(e) => setNovo({ ...novo, nome: e.target.value })} placeholder="Nome da meta (ex: Entrada da casa)"
              style={{ width: '100%', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', marginBottom: 10, fontFamily: 'inherit', boxSizing: 'border-box' }} />
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr 1fr', gap: 10, marginBottom: 10 }}>
              <input type="number" value={novo.valorTotal} onChange={(e) => setNovo({ ...novo, valorTotal: e.target.value })} placeholder="Valor total"
                style={{ border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              <input type="number" value={novo.valorAtual} onChange={(e) => setNovo({ ...novo, valorAtual: e.target.value })} placeholder="Já alcançado"
                style={{ border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
              <input type="number" value={novo.aporteMedio} onChange={(e) => setNovo({ ...novo, aporteMedio: e.target.value })} placeholder="Aporte/mês"
                style={{ border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', fontSize: 13, outline: 'none', fontFamily: 'inherit', boxSizing: 'border-box' }} />
            </div>
            <button onClick={salvar} disabled={salvando} style={{ width: '100%', background: primary, color: '#fff', border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 600, cursor: 'pointer', opacity: salvando ? 0.6 : 1 }}>
              {salvando ? 'Salvando...' : 'Salvar meta'}
            </button>
          </div>
        )}

        {metasReais.length === 0 && !mostrarForm && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center', marginTop: 16 }}>
            <Target size={26} color={muted} style={{ marginBottom: 10 }} />
            <div style={{ fontSize: 13, color: muted }}>Nenhuma meta cadastrada ainda</div>
          </div>
        )}

        <div className="metas-grid">
          {metasReais.map((m) => (
            <MetaCard key={m.id} m={m} editando={editandoId === m.id}
              editNome={editNome} setEditNome={setEditNome}
              editTotal={editTotal} setEditTotal={setEditTotal}
              editAtual={editAtual} setEditAtual={setEditAtual}
              editAporte={editAporte} setEditAporte={setEditAporte}
              onEditar={() => abrirEdicao(m)} onApagar={() => apagar(m.id)}
              onSalvar={() => salvarEdicao(m.id)} onCancelar={() => setEditandoId(null)} />
          ))}
        </div>
      </div>
    </div>
  );
}

function TelaAjustes({ householdId }) {
  const [membros, setMembros] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [pessoaSimulada, setPessoaSimulada] = useState(null);
  const [valorSimulado, setValorSimulado] = useState('');
  const [decisao, setDecisao] = useState(null);
  const [salvandoId, setSalvandoId] = useState(null);

  const buscar = () => {
    setCarregando(true);
    const inicioMes = new Date(); inicioMes.setDate(1);
    const inicioMesStr = inicioMes.toISOString().slice(0, 10);
    Promise.all([
      window.db.from('profiles').select('id, nome, avatar_cor, perc_caixinha, renda_base, caixinha_valor, colchao_valor').eq('household_id', householdId),
      window.db.from('transactions').select('autor_id, valor').eq('household_id', householdId).eq('tipo', 'entrada').gte('data', inicioMesStr),
    ]).then(([resMembros, resEntradas]) => {
      const entradasPorAutor = {};
      (resEntradas.data || []).forEach((t) => { entradasPorAutor[t.autor_id] = (entradasPorAutor[t.autor_id] || 0) + Number(t.valor); });
      const lista = (resMembros.data || []).map((m) => ({ ...m, entradaMesAtual: entradasPorAutor[m.id] || 0, perc_caixinha: m.perc_caixinha ?? 20, renda_base: m.renda_base ?? 0 }));
      setMembros(lista);
      if (lista.length > 0) setPessoaSimulada((prev) => prev || lista[0].id);
      setCarregando(false);
    });
  };

  useEffect(() => { buscar(); }, [householdId]);

  const atualizarCampo = (id, campo, valor) => {
    setMembros((prev) => prev.map((m) => (m.id === id ? { ...m, [campo]: Number(valor) } : m)));
  };

  const salvarPessoa = async (id) => {
    const m = membros.find((x) => x.id === id);
    setSalvandoId(id);
    const { error } = await window.db.from('profiles').update({ perc_caixinha: m.perc_caixinha, renda_base: m.renda_base }).eq('id', id);
    if (error) alert('Erro ao salvar: ' + error.message);
    setSalvandoId(null);
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const f = membros.find((m) => m.id === pessoaSimulada);
  const valorNum = Number(valorSimulado) || 0;
  const paraCaixinha = f ? valorNum * ((f.perc_caixinha || 0) / 100) : 0;
  const restante = valorNum - paraCaixinha;
  const espacoNoTeto = f ? Math.max(0, (f.renda_base || 0) - f.entradaMesAtual) : 0;
  const excedente = Math.max(0, restante - espacoNoTeto);
  const estourouTeto = excedente > 0;

  return (
    <div className="content-grid">
      <div className="col-main">
        <div style={{ marginBottom: 4 }}>
          <div className="voice" style={{ fontSize: 22, fontWeight: 500, marginBottom: 2 }}>Como organizamos nosso dinheiro</div>
          <div style={{ fontSize: 13, color: muted }}>Isso define o que vira "disponível pra gastar" a cada entrada</div>
        </div>

        {membros.length === 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 40, textAlign: 'center', marginTop: 16 }}>
            <div style={{ fontSize: 13, color: muted }}>Nenhum membro encontrado</div>
          </div>
        )}

        {membros.map((m) => (
          <div key={m.id} className="glass" style={{ borderRadius: 20, padding: 20, marginTop: 16 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 16 }}>
              <div style={{ width: 8, height: 8, borderRadius: '50%', background: m.avatar_cor || primary }} />
              <span style={{ fontSize: 13.5, fontWeight: 600 }}>{m.nome || 'Sem nome'}</span>
            </div>
            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
              <div>
                <label style={{ fontSize: 11.5, color: muted, display: 'block', marginBottom: 6 }}>% de cada entrada pra caixinha</label>
                <div style={{ display: 'flex', alignItems: 'center', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '9px 12px' }}>
                  <input type="number" value={m.perc_caixinha} onChange={(e) => atualizarCampo(m.id, 'perc_caixinha', e.target.value)}
                    style={{ border: 'none', outline: 'none', width: '100%', fontSize: 14, fontFamily: 'inherit' }} />
                  <span style={{ fontSize: 13, color: muted }}>%</span>
                </div>
              </div>

                <label style={{ fontSize: 11.5, color: muted, display: 'block', marginBottom: 6 }}>Teto mensal (renda-base)</label>

                  <input type="number" value={m.renda_base} onChange={(e) => atualizarCampo(m.id, 'renda_base', e.target.value)}

            </div>

              {salvandoId === m.id ? 'Salvando...' : 'Salvar'}
            </button>
          </div>
        ))}

        {/* Simulador do ponto de decisão */}
        {membros.length > 0 && (
          <div className="glass" style={{ borderRadius: 20, padding: 20, marginTop: 20 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 7, marginBottom: 4 }}>
              <Sparkles size={14} color={gold} />
              <span style={{ fontSize: 13, fontWeight: 600 }}>Simular uma nova entrada</span>
            </div>
            <div style={{ fontSize: 11.5, color: muted, marginBottom: 16 }}>Veja como o app reagiria a um novo lançamento de entrada</div>

            <div style={{ display: 'flex', gap: 8, marginBottom: 14, flexWrap: 'wrap' }}>
              {membros.map((m) => (
                <button key={m.id} onClick={() => { setPessoaSimulada(m.id); setDecisao(null); }} style={{
                  padding: '7px 16px', borderRadius: 20, border: 'none', cursor: 'pointer', fontSize: 12.5, fontWeight: 600,
                  background: pessoaSimulada === m.id ? (m.avatar_cor || primary) : 'rgba(14,79,69,0.06)',
                  color: pessoaSimulada === m.id ? '#fff' : muted,
                }}>{m.nome || 'Sem nome'}</button>
              ))}
            </div>

            <div style={{ display: 'flex', alignItems: 'center', border: '1px solid rgba(14,79,69,0.15)', borderRadius: 12, padding: '10px 14px', marginBottom: 16 }}>
              <span style={{ fontSize: 13, color: muted, marginRight: 4 }}>R$</span>
              <input type="number" value={valorSimulado} onChange={(e) => { setValorSimulado(e.target.value); setDecisao(null); }} placeholder="Ex: 3500"
                style={{ border: 'none', outline: 'none', width: '100%', fontSize: 14, fontFamily: 'inherit' }} />
            </div>

            {valorNum > 0 && f && (
              <div style={{ background: 'rgba(14,79,69,0.04)', borderRadius: 14, padding: 16 }}>
                <div style={{ fontSize: 12, marginBottom: 8 }}>💰 <b>R$ {fmt(paraCaixinha)}</b> vai automático pra caixinha ({f.perc_caixinha}%)</div>
                {!estourouTeto ? (
                  <div style={{ fontSize: 12, color: primary }}>✓ O resto (R$ {fmt(restante)}) cabe dentro do seu teto — vira disponível pra gastar normalmente.</div>
                ) : (
                  <>
                    <div style={{ fontSize: 12, color: '#C1694F', marginBottom: 12, display: 'flex', alignItems: 'center', gap: 5 }}>
                      <AlertCircle size={13} /> Isso passa seu teto em <b>R$ {fmt(excedente)}</b>. O que fazer com o excedente?
                    </div>
                    <div style={{ display: 'flex', gap: 8, flexWrap: 'wrap' }}>
                      {['Colchão', 'Investimento', 'Dividir'].map((opcao) => (
                        <button key={opcao} onClick={() => setDecisao(opcao)} style={{
                          padding: '8px 14px', borderRadius: 10, border: `1px solid ${decisao === opcao ? primary : 'rgba(14,79,69,0.15)'}`,
                          background: decisao === opcao ? primaryTint : '#fff', color: decisao === opcao ? primary : ink,
                          fontSize: 12, fontWeight: 600, cursor: 'pointer',
                        }}>{opcao}</button>
                      ))}
                    </div>
                    {decisao && (
                      <div style={{ fontSize: 11.5, color: muted, marginTop: 12 }}>
                        {decisao === 'Colchão' && `R$ ${fmt(excedente)} vão pro colchão de meses fracos.`}
                        {decisao === 'Investimento' && `R$ ${fmt(excedente)} seguem direto pra Investimentos.`}
                        {decisao === 'Dividir' && `Metade (R$ ${fmt(excedente / 2)}) pro colchão, metade pra investimento — você pode ajustar a proporção depois.`}
                      </div>
                    )}
                  </>
                )}
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}

// Tenta ler um CSV de fatura de banco (formatos variam bastante entre bancos —
// isso é uma melhor tentativa, sempre mostrando prévia antes de confirmar)
function splitCSVLinha(linha, delimitador) {
  const resultado = [];
  let atual = '';
  let dentroAspas = false;
  for (let i = 0; i < linha.length; i++) {
    const ch = linha[i];
    if (ch === '"') dentroAspas = !dentroAspas;
    else if (ch === delimitador && !dentroAspas) { resultado.push(atual); atual = ''; }
    else atual += ch;
  }
  resultado.push(atual);
  return resultado.map((s) => s.trim().replace(/^"|"$/g, ''));
}

function parseCSVFatura(texto) {
  const semBOM = texto.replace(/^\uFEFF/, '');
  const linhas = semBOM.split('\n').map((l) => l.trim()).filter((l) => l.length > 0);
  if (linhas.length < 2) return [];

  const totalPontoVirgula = linhas.reduce((s, l) => s + (l.match(/;/g) || []).length, 0);
  const totalVirgula = linhas.reduce((s, l) => s + (l.match(/,/g) || []).length, 0);
  const delimitador = totalPontoVirgula > totalVirgula ? ';' : ',';

  // Procura a linha de cabeçalho de verdade (tem "data" E "valor" juntos) — bancos costumam
  // colocar várias linhas de informação da conta antes da tabela de lançamentos
  let headerIdx = -1, idxData = -1, idxValor = -1, idxDesc = -1, idxParcela = -1;
  for (let i = 0; i < linhas.length; i++) {
    const cols = splitCSVLinha(linhas[i], delimitador).map((c) => c.trim().toLowerCase());
    const dIdx = cols.findIndex((c) => c.includes('data') || c.includes('date'));
    const vIdx = cols.findIndex((c) => c.includes('valor') || c.includes('amount') || c.includes('value'));
    if (dIdx !== -1 && vIdx !== -1) {
      headerIdx = i; idxData = dIdx; idxValor = vIdx;
      idxDesc = cols.findIndex((c) => c.includes('descri') || c.includes('histor') || c.includes('estabelec') || c.includes('title') || c.includes('category'));
      idxParcela = cols.findIndex((c) => c.includes('parcela') || c.includes('installment'));
      break;
    }
  }
  if (headerIdx === -1) return [];

  const parseValor = (v) => {
    let s = (v || '').replace('R$', '').replace(/\s+/g, '').trim(); // remove todo espaço (ex: "- 472,87" vira "-472,87")
    if (s.includes(',') && s.includes('.')) s = s.replace(/\./g, '').replace(',', '.');
    else if (s.includes(',') && !s.includes('.')) s = s.replace(',', '.');
    return parseFloat(s) || 0;
  };
  const parseData = (v) => {
    const s = (v || '').trim();
    const br = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
    if (br) return `${br[3]}-${br[2]}-${br[1]}`;
    const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (iso) return s.slice(0, 10);
    return new Date().toISOString().slice(0, 10);
  };
  const parseParcela = (v) => {
    const s = (v || '').trim();
    const m = s.match(/(\d+)\s*\/\s*(\d+)/); // pega "02/03" mesmo com parênteses em volta
    if (!m) return { atual: null, total: null };
    return { atual: parseInt(m[1], 10), total: parseInt(m[2], 10) };
  };
  // Alguns bancos (Nubank, por ex.) não têm coluna de parcela — vem escrito dentro da própria descrição,
  // tipo "Loja X - Parcela 3/4". Isso procura esse padrão no texto e já limpa o nome do item.
  const extrairParcelaDoTexto = (texto) => {
    const t = texto || '';
    let m = t.match(/parcela\s*(\d+)\s*\/\s*(\d+)/i);
    if (!m) m = t.match(/\((\d+)\s*\/\s*(\d+)\)/);
    if (!m) return null;
    return { atual: parseInt(m[1], 10), total: parseInt(m[2], 10), textoCompleto: m[0] };
  };

  return linhas.slice(headerIdx + 1).map((linha) => {
    const cols = splitCSVLinha(linha, delimitador);
    if (cols.length <= idxValor) return null;
    const valorBruto = parseValor(cols[idxValor]);
    let descricaoFinal = idxDesc >= 0 ? (cols[idxDesc] || 'Lançamento importado').trim() : 'Lançamento importado';
    let parcela = idxParcela >= 0 ? parseParcela(cols[idxParcela]) : { atual: null, total: null };
    if (parcela.atual === null) {
      const achado = extrairParcelaDoTexto(descricaoFinal);
      if (achado) {
        parcela = { atual: achado.atual, total: achado.total };
        descricaoFinal = descricaoFinal.replace(achado.textoCompleto, '').replace(/[-–]\s*$/, '').trim();
      }
    }
    return {
      data: idxData >= 0 ? parseData(cols[idxData]) : new Date().toISOString().slice(0, 10),
      descricao: descricaoFinal,
      valor: Math.abs(valorBruto),
      tipo: valorBruto < 0 ? 'entrada' : 'saida', // fatura de cartão: maioria é despesa; negativo costuma ser estorno/pagamento
      parcelaAtual: parcela.atual,
      parcelaTotal: parcela.total,
      incluir: true,
    };
  }).filter((r) => r && r.valor > 0);
}

function TelaCarteira({ userId, householdId }) {
  const [contasReais, setContasReais] = useState([]);
  const [membros, setMembros] = useState([]);
  const [caixinhas, setCaixinhas] = useState([]);
  const [parcelas, setParcelas] = useState([]);
  const [itensFatura, setItensFatura] = useState([]);
  const [carregando, setCarregando] = useState(true);
  const [ativo, setAtivo] = useState(null);
  const [mostrarForm, setMostrarForm] = useState(false);
  const [novo, setNovo] = useState({ nome: '', cor: '#3E72B8', dono: 'Conjunta', saldo: '', diaVenc: '', limite: '' });
  const [caixinhasEstagio, setCaixinhasEstagio] = useState([]); // caixinhas adicionadas antes de salvar a conta
  const [caixinhaEstagioAtual, setCaixinhaEstagioAtual] = useState({ nome: '', valor: '' });
  const [salvando, setSalvando] = useState(false);

  const [mostrarFormCaixinha, setMostrarFormCaixinha] = useState(false);
  const [novaCaixinha, setNovaCaixinha] = useState({ nome: '', valor: '' });
  const [mostrarFormParcela, setMostrarFormParcela] = useState(false);
  const [novaParcela, setNovaParcela] = useState({ descricao: '', valorTotal: '', numParcelas: '', dataPrimeira: new Date().toISOString().slice(0, 10) });
  const [mostrarFormItem, setMostrarFormItem] = useState(false);
  const [novoItem, setNovoItem] = useState({ descricao: '', valor: '', categoria: 'Geral' });
  const [itensVisiveis, setItensVisiveis] = useState(true);
  const [recorrencias, setRecorrencias] = useState([]);
  const [mostrarFormRecorrencia, setMostrarFormRecorrencia] = useState(false);
  const [novaRecorrencia, setNovaRecorrencia] = useState({ descricao: '', valor: '', diaCobranca: '' });

  const [arquivoNome, setArquivoNome] = useState('');
  const [previewCSV, setPreviewCSV] = useState([]);
  const [importando, setImportando] = useState(false);
  const [erroImport, setErroImport] = useState('');

  const buscarTudo = () => {
    setCarregando(true);
    Promise.all([
      window.db.from('accounts').select('*').eq('household_id', householdId),
      window.db.from('profiles').select('id, nome, avatar_cor, perc_caixinha, renda_base, caixinha_valor, colchao_valor').eq('household_id', householdId),
      window.db.from('caixinhas_conta').select('*').eq('household_id', householdId),
      window.db.from('compras_parceladas').select('*').eq('household_id', householdId),
      window.db.from('fatura_itens').select('*').eq('household_id', householdId),
      window.db.from('recorrencias').select('*').eq('household_id', householdId),
    ]).then(([resContas, resMembros, resCaixinhas, resParcelas, resItens, resRecorrencias]) => {
      const erros = [resContas, resMembros, resCaixinhas, resParcelas, resItens, resRecorrencias].map((r) => r.error).filter(Boolean);
      if (erros.length > 0) { alert('Erro ao carregar dados: ' + erros[0].message + '\n\nConfirma se todos os SQLs de atualização foram rodados no Supabase.'); }
      setContasReais(resContas.data || []);
      setMembros(resMembros.data || []);
      setCaixinhas(resCaixinhas.data || []);
      setParcelas(resParcelas.data || []);
      setItensFatura(resItens.data || []);
      setRecorrencias(resRecorrencias.data || []);
      if (resContas.data && resContas.data.length > 0) setAtivo((prev) => prev || resContas.data[0].id);
      setCarregando(false);
    });
  };

  useEffect(() => { buscarTudo(); }, [householdId]);

  const adicionarCaixinhaEstagio = () => {
    if (!caixinhaEstagioAtual.nome) return;
    setCaixinhasEstagio([...caixinhasEstagio, caixinhaEstagioAtual]);
    setCaixinhaEstagioAtual({ nome: '', valor: '' });
  };

  const salvar = async () => {
    if (!novo.nome || !novo.saldo) return;
    setSalvando(true);
    const { data, error } = await window.db.from('accounts').insert([{
      household_id: householdId, nome: novo.nome, cor: novo.cor, dono: novo.dono,
      saldo: Number(novo.saldo) || 0, fatura: 0, dia_venc: Number(novo.diaVenc) || null, limite: Number(novo.limite) || 0,
    }]).select().single();
    if (error) { alert('Erro ao salvar: ' + error.message); setSalvando(false); return; }
    if (caixinhasEstagio.length > 0) {
      await window.db.from('caixinhas_conta').insert(
        caixinhasEstagio.map((c) => ({ household_id: householdId, account_id: data.id, nome: c.nome, valor: Number(c.valor) || 0 }))
      );
    }
    setNovo({ nome: '', cor: '#3E72B8', dono: 'Conjunta', saldo: '', diaVenc: '', limite: '' });
    setCaixinhasEstagio([]);
    setMostrarForm(false);
    setSalvando(false);
    buscarTudo();
  };

  const salvarCaixinha = async () => {
    if (!novaCaixinha.nome || !ativo) return;
    const { error } = await window.db.from('caixinhas_conta').insert([{
      household_id: householdId, account_id: ativo, nome: novaCaixinha.nome, valor: Number(novaCaixinha.valor) || 0,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setNovaCaixinha({ nome: '', valor: '' });
    setMostrarFormCaixinha(false);
    buscarTudo();
  };

  const salvarParcela = async () => {
    if (!novaParcela.descricao || !novaParcela.valorTotal || !novaParcela.numParcelas || !ativo) return;
    const { error } = await window.db.from('compras_parceladas').insert([{
      household_id: householdId, account_id: ativo, descricao: novaParcela.descricao,
      valor_total: Number(novaParcela.valorTotal), num_parcelas: Number(novaParcela.numParcelas),
      data_primeira_parcela: novaParcela.dataPrimeira,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setNovaParcela({ descricao: '', valorTotal: '', numParcelas: '', dataPrimeira: new Date().toISOString().slice(0, 10) });
    setMostrarFormParcela(false);
    buscarTudo();
  };

  const calcularParcelas = (compra) => {
    const hoje = new Date();
    const inicio = new Date(compra.data_primeira_parcela + 'T00:00:00');
    let mesesPassados = (hoje.getFullYear() - inicio.getFullYear()) * 12 + (hoje.getMonth() - inicio.getMonth()) + 1;
    mesesPassados = Math.max(0, Math.min(compra.num_parcelas, mesesPassados));
    const valorParcela = compra.valor_total / compra.num_parcelas;
    return { mesesPassados, valorParcela, pago: mesesPassados * valorParcela, falta: compra.valor_total - mesesPassados * valorParcela };
  };

  const handleArquivoCSV = (e) => {
    const arquivo = e.target.files[0];
    if (!arquivo) return;
    setArquivoNome(arquivo.name);
    setErroImport('');
    const leitor = new FileReader();
    leitor.onload = (ev) => {
      const linhas = parseCSVFatura(ev.target.result);
      if (linhas.length === 0) setErroImport('Não consegui reconhecer o formato desse arquivo. Confirma se é um CSV com colunas de data, descrição e valor.');
      setPreviewCSV(linhas);
    };
    leitor.readAsText(arquivo, 'utf-8');
  };

  const confirmarImportacao = async () => {
    if (!ativo) return;
    setImportando(true);
    const linhasParaImportar = previewCSV.filter((l) => l.incluir && l.tipo === 'saida').map((l) => ({
      household_id: householdId, account_id: ativo, descricao: l.descricao, valor: l.valor, categoria: 'Importado', data: l.data,
      parcela_atual: l.parcelaAtual, parcela_total: l.parcelaTotal,
    }));
    const { error } = await window.db.from('fatura_itens').insert(linhasParaImportar);
    setImportando(false);
    if (error) { alert('Erro ao importar: ' + error.message); return; }
    setPreviewCSV([]);
    setArquivoNome('');
    buscarTudo();
    alert(`${linhasParaImportar.length} item(ns) adicionado(s) à fatura!`);
  };

  const salvarItemFatura = async () => {
    if (!novoItem.descricao || !novoItem.valor || !ativo) return;
    const { error } = await window.db.from('fatura_itens').insert([{
      household_id: householdId, account_id: ativo, descricao: novoItem.descricao, valor: Number(novoItem.valor), categoria: novoItem.categoria,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setNovoItem({ descricao: '', valor: '', categoria: 'Geral' });
    setMostrarFormItem(false);
    buscarTudo();
  };

  const apagarItemFatura = async (id) => {
    const { error } = await window.db.from('fatura_itens').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  const salvarRecorrencia = async () => {
    if (!novaRecorrencia.descricao || !novaRecorrencia.valor || !ativo) return;
    const { error } = await window.db.from('recorrencias').insert([{
      household_id: householdId, account_id: ativo, descricao: novaRecorrencia.descricao,
      valor: Number(novaRecorrencia.valor), dia_cobranca: Number(novaRecorrencia.diaCobranca) || null,
    }]);
    if (error) { alert('Erro ao salvar: ' + error.message); return; }
    setNovaRecorrencia({ descricao: '', valor: '', diaCobranca: '' });
    setMostrarFormRecorrencia(false);
    buscarTudo();
  };

  const apagarRecorrencia = async (id) => {
    const { error } = await window.db.from('recorrencias').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  const pagarFatura = async (contaId, itensDaConta) => {
    const total = itensDaConta.reduce((s, i) => s + Number(i.valor), 0);
    if (total <= 0) return;
    const conta = contasReais.find((c) => c.id === contaId);
    if (!confirm(`Confirmar pagamento de R$ ${fmt(total)} da fatura ${conta?.nome}? Isso cria um lançamento de saída e limpa os itens dessa fatura.`)) return;
    const { error: erroTx } = await window.db.from('transactions').insert([{
      household_id: householdId, autor_id: userId, tipo: 'saida', descricao: `Pagamento fatura ${conta?.nome || ''}`,
      valor: total, categoria: 'Fatura', grupo: 'Fixa', visivel: true, data: new Date().toISOString().slice(0, 10), conta: contaId,
    }]);
    if (erroTx) { alert('Erro ao registrar pagamento: ' + erroTx.message); return; }
    const idsParaApagar = itensDaConta.map((i) => i.id);
    await window.db.from('fatura_itens').delete().in('id', idsParaApagar);
    buscarTudo();
  };

  const apagarConta = async (id) => {
    if (!confirm('Apagar essa conta? Isso também apaga as caixinhas e compras parceladas ligadas a ela.')) return;
    const { error } = await window.db.from('accounts').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    if (ativo === id) setAtivo(null);
    buscarTudo();
  };

  const apagarCaixinha = async (id) => {
    if (!confirm('Apagar essa caixinha?')) return;
    const { error } = await window.db.from('caixinhas_conta').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  const apagarParcela = async (id) => {
    if (!confirm('Apagar essa compra parcelada?')) return;
    const { error } = await window.db.from('compras_parceladas').delete().eq('id', id);
    if (error) { alert('Erro ao apagar: ' + error.message); return; }
    buscarTudo();
  };

  if (carregando) return <div style={{ padding: 40, textAlign: 'center', color: muted, fontSize: 13 }}>Carregando...</div>;

  const contaAtiva = contasReais.find((c) => c.id === ativo);
  const totais = contasReais.reduce((acc, c) => { acc.saldo += Number(c.saldo || 0); return acc; }, { saldo: 0 });
  totais.fatura = itensFatura.reduce((s, i) => s + Number(i.valor || 0), 0);

function gerarPadraoQR(seed, tamanho = 11) {
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const celulas = [];
  for (let y = 0; y < tamanho; y++) {
    for (let x = 0; x < tamanho; x++) {
      const naCanto = (x < 3 && y < 3) || (x > tamanho - 4 && y < 3) || (x < 3 && y > tamanho - 4);
      if (naCanto) continue;
      h = (h * 1103515245 + 12345) >>> 0;
      celulas.push({ x, y, ativo: (h >> 16) % 100 < 42 });
    }
  }
  return celulas;
}

}
